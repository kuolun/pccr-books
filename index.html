<script>
const BOOKS=[{"id":"l2quzx35a95kmw5eejl2epoz","n":"威洛比先生的耶誕樹","a":"羅勃．巴利（Robert Barry）","d":"羅勃．巴利（Robert Barry）","t":"林良","p":"親子天下","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786264060875","dt":"113/12","pr":380,"desc":"富人家不需要的一段聖誕樹梢，卻綿延散播了好幾家人的幸福。小老鼠雖只有枝微末節的小聖誕樹，但所得到的幸福感，卻完全可比擬富人家擁有大聖誕樹的幸福。因為幸福不在於物品的大小或形式，而是來自自己內在心裡的滿足；恰如其分，適當合宜，就已足夠，多餘的就該捨給他人。一本散播幸福與分享的幸福繪本。[114]"},{"id":"qxglqrocaljsqa5oujttfebr","n":"愛睡覺的小baby","a":"劉旭恭","d":"劉旭恭","t":"","p":"水滴文化(城邦出版)","y":["114"],"ag":"0~3","c":"認知探索、美感","cl":false,"lo":true,"isbn":"9786267352472","dt":"113/11","pr":380,"desc":"孩子的想像世界比現實生活神奇許多，《愛睡覺的小baby》無須文字，完全用圖像帶讀者探看小寶寶超級有趣的祕密生活。孩子可以好好觀察每一幅畫面，自己說故事，也可以尋訪圖像間的連結與線索，小baby最忠誠的好朋友小熊也參與了一場接一場壯闊的大冒險，實在太厲害了！本書無論主題或柔和的圖像風格都很適合嬰幼兒開"},{"id":"tovl14bh4pyjb4i381t7qhok","n":"過去一點","a":"卡崔娜夏門（Katrina Charman）","d":"吉列米卡斯汀（Guilherme Karsten","t":"何湘葳","p":"格林文化","y":["114"],"ag":"0~3","c":"身體動作、社會情緒、認知探索","cl":false,"lo":false,"isbn":"9786267295588","dt":"113/11","pr":380,"desc":"母雞請動物們過去一點，動物們依序掉下床去，可引導孩子思考下一個掉下床的是哪隻動物呀？以逐頁掉下一個動物的頁面設計，隨著翻頁更具體呈現掉下床和床上動物的視覺效果，也能點數床上剩幾隻動物。故事鋪陳幽默有趣，母雞喊「不要丟下我一個」的頁面，讓讀者有捧腹大笑之快！是一本兼具順序、數的合成分解的幽默繪本。[1"},{"id":"j2ggn5ir2nkqb657h4vbfkh8","n":"小漁顛倒游","a":"科瑞．R. 塔博(Corey R. Tabor)","d":"科瑞．R. 塔博(Corey R. Tabor)","t":"柯倩華","p":"弘雅三民(小山丘)","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263708754","dt":"113/11","pr":370,"desc":"閱讀《小漁顛倒游》是一段翻轉書本、也翻轉思考的歷程。孩子把繪本翻來倒去時，也會發現世界上存在各種觀看角度與生存方式，每個角落啊，都蘊藏著讓人目不暇給的風景。儘管本書敘述的是自我發現與自我認識這個童書裡常見的主題，卻用與眾不同的絕妙形式呈現。河面上河面下都流動著源源不絕的生命力，還有新的可能，鼓勵孩子"},{"id":"gvgwe7mdgsrgvanu5hauegl9","n":"聖誕老人的第一個聖誕節","a":"麥克‧巴奈特(Mac Barnett)","d":"席尼‧史密斯(Sydney Smith)","t":"劉清彥","p":"維京國際","y":["114"],"ag":"3~5","c":"身體動作、社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789864405640","dt":"113/11","pr":350,"desc":"辛勤工作的聖誕老人從來不曾體驗過任何一次聖誕節，在小精靈們和大白熊的籌畫下，他體驗了這輩子最溫暖動人的聖誕節……本書引領孩子們一一觀察準備聖誕節的各種儀式與活動，圖像與故事都散發溫暖情懷、讓人感覺放鬆又愜意。這本繪本也引導孩子為人設想、彼此關懷，讓每個日子都因為喜悅的微光而閃閃發亮。[114]"},{"id":"bjfgq66ou6jwokawwq1myvy8","n":"烏的","a":"儲玉玲","d":"儲嘉慧","t":"呂美親(台文審訂)","p":"聯經出版","y":["114"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789570874952","dt":"113/10","pr":320,"desc":"「烏的」，是一隻「好玄」的黑色小狗，坐在封面的左下角，「欲去逐會飛的物件」。身為一隻狗，生來要做的事就是跑、跳、滾、叫。重複的「Nga̍uh！」隨著「烏的」追的「動物伴」不同，譜寫著不同的節奏。讓孩子的好奇心也隨著「烏的」去追吧！附臺灣台語朗讀音檔，邊聽邊讀，和孩子一起親近臺灣台語。[114]"},{"id":"yeg5xipadfvfocnvc3flu5ol","n":"哪裡不舒服呢？","a":"妮娜特(Ninette)","d":"妮娜特(Ninette)","t":"李紫蓉","p":"遠見天下文化(小天下)","y":["114"],"ag":"0~3","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9786263558823","dt":"113/09","pr":360,"desc":"溫柔的母雞醫師讓孩子們知道：原來「看醫生」一點也不可怕！親子共讀時，可以從封面帶孩子們觀察動物們哪裡不舒服，再看母雞醫師針對孩子們常見的疾病如何問診，做哪些檢查，以及治療的過程，讓孩子感受母雞醫師所展現的同理心與平等友善，像是爬上高高的樓梯為長頸鹿問診和檢查喉嚨，為孩子下次去看病做好準備。[114]"},{"id":"pbm9wfzsxyc2y2qa55a9xdwt","n":"我會曉","a":"海狗房東","d":"黃海蒂","t":"陳厚潤、陳厚澤(台語朗讀)；呂美親(台文審訂)","p":"聯經出版","y":["114"],"ag":"0~3","c":"語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9789570874846","dt":"113/09","pr":350,"desc":"充滿韻律感的臺灣台語繪本，透過孩子喜愛的畫圖、唱歌與跳舞，展現純真自在的童年樂趣。故事融合可愛動物與溫馨友誼，搭配富有節奏感的臺灣台語表達方式，讓孩子自然而然親近母語，感受其獨特之美。溫暖生動的插圖營造活力十足的氛圍，搭配羅馬拼音與音檔，深化孩子對自身文化的認同感。[114]"},{"id":"wu472pa99xpkvi19f2241l6f","n":"眼淚博物館","a":"黃顯雅","d":"黃顯雅","t":"","p":"弘雅三民(小山丘)","y":["114"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":true,"isbn":"9786263707689","dt":"113/09","pr":350,"desc":"透過細膩溫暖的插圖與詩意般的敘事，這本繪本引領孩子探索眼淚背後的情感故事。獨特主題結合深刻動人的文字，不僅幫助孩子理解悲傷、喜悅與感動等多重情緒，也鼓勵他們勇於表達內心感受。在閱讀中，孩子能學習接納情緒，感受愛與關懷的力量，並在故事中找到共鳴與安慰。[114]"},{"id":"yx2owqyl87g45gdgrrcvqkis","n":"不一樣的1(新版)","a":"吳亞男","d":"柳壟沙","t":"英文翻譯：白一葦","p":"信誼基金","y":["114"],"ag":"3~5","c":"語言溝通","cl":false,"lo":false,"isbn":"9789861617497","dt":"113/09","pr":350,"desc":"棕熊老師教小動物們寫數字1，大家都很認真的練習。每隻動物的特質不同，寫出來的1也各有特色。小螃蟹用鉗子夾起筆，橫著爬，寫出正在睡覺的「一」。小螞蟻寫的1，很小很小，是個會躲貓貓的1；小雞用嘴巴咬著筆，寫出來的是歪歪扭扭、正在跳舞的1……。鼓勵孩子展現自我，安心做自己，也學習欣賞他人，理解每個人的特質"},{"id":"y6ymp1pijn5uxn310bdhas8w","n":"爸爸！別把話說光了","a":"費里希妲．薩拉(Felicita Sala)","d":"費里希妲．薩拉(Felicita Sala)","t":"陳信宏","p":"親子天下","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263059917","dt":"113/08","pr":380,"desc":"女兒馳騁著豐富的想像力，將心中的擔心，化為一句句的追問，問得爸爸得絞盡腦汁地一一回答。最終，女兒得到心中的渴望：爸爸絕對不會忘記我，而且會永遠對我說那三個字。一場父女睡前的甜蜜對話，讓女兒安心入睡，更是幫助女兒正向情緒發展的良方。[114]"},{"id":"vzcaou1vlge0h24fu8m4rgqm","n":"小狼人好餓","a":"安迪‧哈克尼斯(Andy Harkness)","d":"安迪‧哈克尼斯(Andy Harkness)","t":"黃筱茵","p":"時報文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786263965300","dt":"113/08","pr":350,"desc":"這是個充滿戲劇張力與幽默感的故事，細膩描繪小狼人因飢餓而情緒激動的過程。誇張的語言與重複句型讓孩子身歷其境，感受焦慮與急切的變化。黏土插畫結合強烈光影與鮮明色彩對比，營造懸疑氛圍，增添故事張力。透過這場情緒風暴，孩子能學習辨識與表達感受，培養自我覺察力。[114]"},{"id":"tx1dnt6xy53wabcnrbbj35xt","n":"上學快來不及了！","a":"小木屋工坊(The Cabin Company)","d":"小木屋工坊(The Cabin Company)","t":"米雅","p":"遠見天下文化(小天下)","y":["114"],"ag":"3~5","c":"身體動作、社會情緒、認知探索","cl":false,"lo":false,"isbn":"9786263558427","dt":"113/08","pr":380,"desc":"7點47分，衝出家門，快點、快點！上學快來不及了！這本充滿臨場感的繪本，一頁一頁有如電影般的沉浸式體驗，讓孩子們屏氣凝神跟著倒數。7點54分，叩隆叩隆，火車怎麼這麼長啦！急得小男孩直冒汗；柵欄升起，小男孩雙腳飛快轉得像風車般，我們也跟著冒汗！7點59分，終於到學校了，趕上日環食了！這13分鐘真是緊張"},{"id":"ewkddd16ttkyelf19utrf79q","n":"夏天就是該這樣","a":"貓小小","d":"許臺育","t":"","p":"愛米粒","y":["114"],"ag":"3~5","c":"身體動作、社會情緒、認知探索","cl":false,"lo":true,"isbn":"9786269832583","dt":"113/07","pr":350,"desc":"夏天的泳池，是那麼的悠遊有趣：噗通跳下水，像水草般在水中飄啊飄；憋住氣往下沉，像石頭般定格在泳池底；像水母般漂在水面上。喝一杯漂浮冰淇淋汽水，就像全身沉浸在水中般的舒暢，渾然不覺回家路上的雨滴，喜見窗外的雨後彩虹。一本充滿夏日戲水的想像繪本，更是激發孩子想像力的繪本。[114]"},{"id":"f1tfaqsmaa9peew5lt6az2ux","n":"請幫我撿球","a":"車雅達","d":"車雅達","t":"葉雨純","p":"維京國際","y":["114"],"ag":"3~5","c":"身體動作、社會情緒、生活自理","cl":false,"lo":false,"isbn":"9789864405442","dt":"113/06","pr":380,"desc":"一顆滾來滾去的紅球、一隻偷懶的兔子、一隻慢條斯理的烏龜，再加上一群熱心的路人，發生了一場趣味十足的故事。當兔子的紅球滾到下坡的馬路上，他本來只需花一分鐘就能撿回來，但卻試圖讓路人幫忙，這些好心的路人能成功撿回紅球嗎？共讀時，和孩子一起數數有多少人幫忙，猜猜最後是誰找回紅球？這本繪本充滿幽默與巧思，讀"},{"id":"sdc1gkh0t6l7bxpezng3rhc9","n":"沒毛雞","a":"陳致元","d":"陳致元","t":"","p":"親子天下","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":true,"isbn":"9786263058811","dt":"113/06","pr":400,"desc":"全身沒有羽毛、又瘦又小的沒毛雞，好想跟四隻光鮮亮麗的漂亮雞一起去划船。故事幽默有趣，情節高潮迭起，結局出乎意料的轉折。共讀時，可以和孩子聊一聊自己的獨一無二，欣賞自己的獨特，也進一步認識他人的特質，同理每個人的差異。[114]"},{"id":"tretb7iw0s4ko4vijxizpjzs","n":"123，噗嚕嚕！","a":"得田之久","d":"及川賢治","t":"郭孚","p":"信誼基金","y":["114"],"ag":"0~3","c":"身體動作、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789861617374","dt":"113/05","pr":280,"desc":"這是為幼兒設計的硬頁書，結合動物、擬聲詞及趣味動作，讓數數變得好玩！故事裡，小象、小黑熊、小豬等10種動物輪番登場，隨著頁面翻動，動物的數量也從1隻慢慢增加到10隻。共讀時，除了數數，還可一起學動物叫聲和模仿動作：小象「噗嚕嚕」地噴水、小豬「咕咚咕咚」地打滾…，透過遊戲互動，可提升孩子的認知、語言能"},{"id":"uplctdajnxy6q8uv6fr5rk08","n":"粒粒皆好吃","a":"高凌華","d":"八分熟的小李子","t":"","p":"翰林出版","y":["114"],"ag":"3~5","c":"身體動作、認知探索、生活自理","cl":false,"lo":true,"isbn":"9786263652767","dt":"113/05","pr":340,"desc":"粒粒的飯糰店生意不好，讓她感到沮喪。於是她回到家鄉，重溫熟悉的滋味和美好回憶。在爸媽的陪伴下，粒粒找回了勇氣與創意，回到店裡後，她重新設計菜單，加入各種米食料理，帶來了幸福的味道。共讀這本繪本時，帶領孩子認識各種稻米和美味的米食，還能讓孩子體驗「陪伴」帶來的安心與鼓舞，學習如何從愛與陪伴中獲得突破困"},{"id":"k6b0d0a5gqqvjwgn9ew06kmt","n":"我和我的小傷疤","a":"碧翠絲‧阿雷馬娜(Beatrice Alemagna)","d":"碧翠絲‧阿雷馬娜(Beatrice Alemagna)","t":"尉遲秀","p":"聯經出版","y":["114"],"ag":"3~5","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789570873788","dt":"113/05","pr":380,"desc":"跌倒，擦傷，流血，結痂，是孩子們成長過程中的恐怖電影。封面上女孩低頭看著膝蓋上的小傷疤，昨天我跌倒了，膝蓋磨破了；痛的感覺像火在燒，我哭得像個嬰兒。作者很貼切地描繪孩子的情感，傷疤不漂亮，影響膝蓋活動，希望它快點離開……日子一天天過去，她給它起名叫「佩佩」。這本繪本，陪伴孩子學習與那些讓我們害怕的事"},{"id":"fj6sbwen31prdq4moi42dy72","n":"無公平！","a":"陶樂蒂","d":"陶樂蒂","t":"","p":"小麥田出版(城邦出版)","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9786267281697","dt":"113/04","pr":340,"desc":"這本雙語繪本透過貼近日常生活的場景，引導孩子探索公平的多重面貌。小獅子與朋友們在遊戲與物品交換的過程中，發現公平並非「完全相同」，而是在尊重與分享中尋找平衡。溫暖插圖搭配臺灣台語朗讀，讓孩子輕鬆理解故事內涵，在閱讀中學習公平與合作的價值。[114]"},{"id":"cvwozasf5nvm1txaqsb0wydu","n":"小威的眼睛","a":"杜宛霖","d":"杜宛霖","t":"","p":"信誼基金","y":["114"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789861617398","dt":"113/04","pr":320,"desc":"這是關注視障朋友的溫暖故事，明眼孩子阿比帶領我們認識他的好朋友小威。雖然小威看不見，但他用耳朵聆聽、用手觸摸、用心感受世界，展現出獨特的生活方式，也讓阿比對「看見」有了全新的體會。即使身處黑暗的小威，依然用心察覺世界的愛，成為阿比的一道光。共讀時，孩子能理解和學習與視障者相處，並鼓勵孩子「用心去看」"},{"id":"evn618si941yker7dkyw5vyq","n":"大猩猩：相反是什麼？","a":"安東尼布朗（Anthony Browne）","d":"安東尼布朗（Anthony Browne）","t":"何儀","p":"格林文化","y":["114"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9786267295335","dt":"113/04","pr":350,"desc":"要怎麼跟孩子解釋「相反」的概念呢？交給大猩猩就對了！「老」的相反是什麼？一個跨頁提出問題，讓孩子有充裕的時間猜想答案，翻頁看到答案時，孩子們心中的成就感便油然而生，開心拍手或者來個 Give Me Five。問題使用重複的句型，大小讀者可以自己提出問題，無限延伸。領著孩子觀察大猩猩等動物豐富的臉部表"},{"id":"vxbq3m8escl4r6ior4qtmnmb","n":"爺爺與翠鳥","a":"安娜．威爾遜(Anna Wilson)","d":"莎拉．瑪西尼(Sarah Massini)","t":"游珮芸","p":"米奇巴克","y":["114"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786269812103","dt":"113/04","pr":360,"desc":"這本書描繪了一場溫馨動人的生命之旅。翻開書頁，爺爺與孫子在波光粼粼的河面上垂釣，享受大自然的寧靜。書中以連續分格畫面細緻描繪翠鳥飛翔與捕魚的精彩瞬間。隨著故事的發展，我們與祖孫一同觀察翠鳥築巢、育雛，到幼鳥離巢、父母逝去，最後長大的雛鳥再度俯衝捕魚，延續生命的傳承。這本繪本不僅呈現了祖孫間的溫馨互動"},{"id":"fgiy08wk9ql1owqch18bgr7v","n":"情緒大飯店","a":"莉迪亞．布蘭科維琪（Lidia Branković）","d":"莉迪亞．布蘭科維琪（Lidia Branković）","t":"黃聿君","p":"典藏藝術家庭(小典藏)","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理","cl":false,"lo":false,"isbn":"9786267430033","dt":"113/04","pr":350,"desc":"歡迎光臨！今天你是哪一位情緒貴客呢？我們就像一家神奇的飯店，每天迎接不同的「情緒客人」。這間飯店從不拒絕任何客人，每位客人都能按照自己的節奏停留。作者以色彩繽紛、生動的插畫讓每位情緒客人鮮活登場，每位客人都有獨特的個性與需求。共讀時，可以幫助孩子認識並接納情緒，學習如何與情緒相處，像一位出色的飯店經"},{"id":"w8ee56nd84zftm3t746hcauj","n":"10隻橡皮小鴨","a":"艾瑞．卡爾(Eric Carle)","d":"艾瑞．卡爾(Eric Carle)","t":"柯倩華","p":"上誼文化","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789577627766","dt":"113/03","pr":300,"desc":"封面10隻橡皮鴨和書名頁寫上1.2.3……的橡皮鴉外形，反覆翻頁時互襯對應著。一箱橡皮鴨掉海裡，10隻橡皮鴨散落海面，一箱有幾隻？第1隻漂向西、第2隻漂向東……、第10隻漂向哪？呈現先後序數、方位空間的概念。第10隻橡皮鴨跟著鴨媽媽回家，則呈現了多元融合。從數數到序數，一本橡皮鴨海上漂流奇遇記的數學"},{"id":"poeulfu0hquk9mpikokrczcj","n":"壽司買衣服","a":"田中達也","d":"田中達也","t":"李宜蓁","p":"上誼文化","y":["114"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789577627728","dt":"113/03","pr":320,"desc":"微型藝術構築的驚奇世界會讓孩子驚喜連連！壽司買衣服、香腸開新車……令人眼花撩亂的各種選擇，你想選哪一款呢？在精心設計的畫面間，陪孩子辨識各式各樣日常生活裡會看見的事物，酷炫可愛的麵包車輛一字排開時，孩子們都會眼睛一亮、哇的大呼一聲吧！辨識形貌、延伸想像，串接知識與故事，真想走進繪本裡小巧又創意無限的"},{"id":"yy9pnmp0me2vycecovzyscnw","n":"春天來了","a":"五味太郎","d":"五味太郎","t":"吳宜真","p":"上誼文化","y":["114"],"ag":"0~3","c":"語言溝通","cl":false,"lo":false,"isbn":"9789577627773","dt":"113/02","pr":280,"desc":"簡潔卻盈滿想像空間的畫面與詩意的文字，烘托了季節的流轉與生命的成長及變化。以簡馭繁、借小喻大的經典之作，讓小讀者們在觀察間自由自在孕育想像。畫面動靜有致，歡迎讀者走進每一幅圖裡，體察每一個季節的美好風情，也細細感知生命裡的驚奇與感動。[114]"},{"id":"yv2j8itpj2zwt6q4erqlwyxc","n":"短耳兔1：我是短耳兔","a":"劉思源","d":"唐唐","t":"","p":"親子天下","y":["114"],"ag":"3~5","c":"身體動作、社會情緒、健康與安全","cl":false,"lo":true,"isbn":"9786263056718","dt":"113/02","pr":360,"desc":"貼近孩子成長經驗的故事，描繪冬冬因與眾不同的耳朵而感到自卑的心路歷程。透過幽默而溫暖的情節，故事引導孩子接納自己的獨特之處，並建立自信。細膩的畫風與真摯的心理描寫，使孩子能投射自身情感，學習如何面對挫折與管理情緒，讓閱讀成為自我探索與成長的歷程。[114]"},{"id":"mpixbf1wq8835723t1owkhby","n":"雪地裡的奇蹟","a":"艾黛兒．塔耶爾（Adèle Tariel）","d":"傑鴻．貝哈（Jérôme Peyrat）","t":"徐意筑","p":"遠見天下文化(小天下)","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263555662","dt":"113/02","pr":360,"desc":"在冰天雪地中，女孩與北極熊媽媽彼此扶持，展現愛與友誼如何超越種族、年齡與背景。細膩插圖勾勒壯麗的冰雪世界與角色間深厚的情感，使故事更具沉浸感與感染力。這場旅程不僅帶來溫暖，也啟發孩子思考人與自然的聯繫與責任，培養環境關懷與尊重生命的價值觀。[114]"},{"id":"kazi9rbo0e7afo6qk73v1q6l","n":"彩色怪獸：情緒醫生和他的情緒急救箱","a":"安娜．耶拿絲(Anna Llenas)","d":"安娜．耶拿絲(Anna Llenas)","t":"李家蘭","p":"三采文化","y":["114"],"ag":"3~5","c":"社會情緒、生活自理","cl":false,"lo":false,"isbn":"9786263582330","dt":"113/01","pr":420,"desc":"孩子天生就能感知情緒，卻常不知如何表達與調適。繪本中小孩答應了一件不情願的事，心中感到怪怪的，此時，彩色怪獸情緒醫生運用神奇急救箱裡的魔法工具，協助小孩找到紓解情緒的方法。透過這本繪本，我們能幫助孩子理解情緒，並打造專屬孩子的「情緒急救箱」。準備好跟著彩色怪獸情緒醫生出診了嗎？翻開這本繪本，一起探索"},{"id":"kzv3djfi31d5jon71cs420qf","n":"飛一下、休息一下、再想一下……","a":"五味太郎","d":"五味太郎","t":"游珮芸","p":"信誼基金","y":["114"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789861617282","dt":"113/01","pr":320,"desc":"色彩鮮豔的小鳥，從畫面中間由左往右飛翔，前方一片開闊。遇到一棵樹，「休息一下，吃吃果子……」，「再飛一下下……」。接著看到一片大海，沒有地方可以休息，沒有果子可以吃，小鳥開始想著要怎麼渡海還得不餓著肚子，最後一頁峰迴路轉，發人深省。圖畫看似簡單但很傳神；文字看似簡單，但富含邏輯思考的深意。[114]"},{"id":"8cd9ca6f7a694ddeb897c022","n":"小蝸牛亨利","a":"卡塔琳娜・瑪庫洛娃","d":"卡塔琳娜・瑪庫洛娃","t":"吳文君","p":"遠流出版","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9786263614000 ","dt":"112-12","pr":350,"desc":"本書的主角小蝸牛亨利選擇面對天生「沒有黏液」的獨特。牠用行動嘗試各種可能性，面對身體極限時，牠也願意開口尋求幫助。失敗讓牠失望卻不放棄，最終練就媲美馬戲團的特技。共讀時，讓孩子感受亨利的勇氣，牠不僅完成夢想，也激勵其他動物勇敢挑戰，一起在亨利馬戲團自信同行。[113]"},{"id":"yywx7ru1b9svs5ph1nlwemm0","n":"唱歌給貓聽","a":"湯姆牛","d":"湯姆牛","t":"","p":"遠見天下文化(小天下)","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9786263554658","dt":"112/12","pr":380,"desc":"鋼琴家杜魯魯，晚上十一點就要睡了。可是，屋頂上來了一隻貓，喵～喵～喵～杜魯魯先生決定彈一首搖籃曲讓貓咪入睡……。陪著孩子一起讀，一起唱。看看時鐘，貓咪幾點幾分來的？什麼顏色的貓先來？幾點幾分唱到哪個地方？來了好多貓，總共有幾隻貓？幫貓咪們起個名字吧～邊讀邊唱，一起找找看、數數看，孩子們也睡不著了……"},{"id":"c8eeea58c8d540acb60b7053","n":"我的朋友蹛佇隔壁庄","a":"儲玉玲","d":"儲嘉慧","t":"","p":"聯經出版","y":["113","114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789570871838","dt":"112/12","pr":320,"desc":"優美愜意的日常風景，用臺灣台語朗讀出來，感覺得到徐徐的微風與甜蜜的童年滋味。坐上狗兒巴士，到隔壁庄去找朋友玩，沿途的所見所聞所感會觸動孩子的敏銳感官，也召喚他們每天的記憶地圖裡標示的種種美好。溫暖的圖像充滿情感，童年的每一刻都是生命的珍寶，叮叮噹噹，敲響著喜悅的音符。[114]小女孩要到隔壁村找朋友"},{"id":"mdnvtsxlk8i7d40ajfhaqe2i","n":"小老鼠的內褲","a":"tupera tupera","d":"tupera tupera","t":"張玲玲","p":"格林文化","y":["114"],"ag":"0~3","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9786267295182","dt":"112/12","pr":299,"desc":"這本幽默逗趣的互動式繪本，邀請孩子一同尋找神祕失蹤的內褲。內頁的挖洞設計，鼓勵孩子透過圖案與線索推測主人，結合觀察與推理，提升專注力與邏輯思考能力。繽紛的拼貼畫風、生動的角色表情，讓閱讀變得妙趣橫生，而獨特的「內褲之歌」更增添樂趣，使這場冒險充滿驚喜與歡笑。[114]"},{"id":"f47f8b2abc71494b8f3f2d66","n":"小喜鵲和岩石山","a":"劉清彥","d":"蔡兆倫","t":"","p":"拾光工作室","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789869873697","dt":"112-11","pr":360,"desc":"光禿禿的岩石山，因為小喜鵲阿利這個好朋友多次到訪，帶來鳥兒朋友和種子，變成綠意盎然的山，成為許多動物的家。雖然阿利逝世了，但是牠美好的善意與關懷，溫暖了岩石山，也帶來新生的希望。共讀時，讓孩子比較岩石山從光禿到繁茂的變化，鼓勵孩子付出善心，成為別人生命中的小喜鵲。[113]"},{"id":"fvgli96et6kn2nnmfs3d2z0s","n":"臺灣的樣子","a":"楊采潔","d":"王盈穎","t":"","p":"翰林出版","y":["114"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9786263651401","dt":"112/11","pr":300,"desc":"這是一場探索臺灣奇妙風貌的冒險之旅！從壯麗的高山到廣闊的海洋，金色的寺廟屋頂到紅色的鞭炮，走遍臺灣的每個角落，感受豐富多樣的自然景觀與人文特色。共讀時，帶領孩子認識臺灣的動植物，體驗多元的節慶活動，不同的色彩串接起多元風貌的臺灣。快來和孩子打開這本繪本，一起發現美麗的臺灣！[114]"},{"id":"0afe9cb173f24b74bd205f43","n":"比一比，誰最長？(新版)","a":"佐藤伸","d":"山村浩二","t":"蘇懿禎","p":"小熊出版","y":["113"],"ag":"0~3","c":"語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786267361368","dt":"112-10","pr":320,"desc":"本書透過孩子喜歡的「比較遊戲」，認識各種動物的特徵和長處，學會「測量」和「比較」的概念。同時透過公雞獨特的「長處」，讓孩子欣賞別人的優點，也看重自己的獨特。共讀時，和孩子進行角色扮演，朗讀重複的句型，訓練口語表達，再用書末遊戲，複習長度比較，深入討論動物的獨特能力。[113]"},{"id":"akzmlsg46hxgsngox43n4d5z","n":"一直都在","a":"青木宏江 (あおきひろえ)","d":"青木宏江 (あおきひろえ)","t":"米雅","p":"拾光工作室","y":["114"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789869873680","dt":"112/10","pr":320,"desc":"淡淡的文字，細膩地描繪小女孩與爸爸的濃密情感。爸爸買12色的蠟筆給她圓畫家夢，其實她比較想要24色，但卻說不出口；去游泳池和同伴玩得正開心，爸爸催她上岸，小女孩想著要是爸爸沒跟來就好了……字字句句凝結父女間深邃的親情。「每當我想念你，我知道，你，一直都在。」[114]"},{"id":"xjdjxugjhwp37bgp0gnik8cu","n":"看不見也沒關係","a":"李芝賢","d":"林英蘭","t":"曹一竹","p":"青林國際","y":["114"],"ag":"3~5","c":"語言溝通、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789862746530","dt":"112/10","pr":320,"desc":"臉上洋溢幸福的小女孩述說與爸爸的日常生活，爸爸不會開車載我們去玩，也不會幫我們拍照。但他很會尋找香味，跟我玩躲貓貓，用手指為我唸故事。蝴蝶頁，呈現的是視障爸爸的世界。封面的書名下方有盲文，和孩子一起摸摸看，說說有些人身體有些困難，過著獨特的生活，同理每個人不同的特質。[114]"},{"id":"cuc703sh195nhnbhsiukooj0","n":"麥克的睡覺小羊","a":"瑪格麗塔．德爾．馬佐(Margarita del Mazo)","d":"谷瑞迪(Guridi)","t":"小樹文化編輯部","p":"小樹文化(讀書共和國)","y":["114"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9786267304228","dt":"112/10","pr":350,"desc":"睡不著的時候，我們會閉上眼睛數羊……1隻羊、2隻羊、3隻羊……小羊一隻一隻跳過柵欄，我們的眼皮也愈來愈重，慢慢地沉沉進入夢鄉。可是麥克的4號睡覺小羊不願意跳過柵欄，麥克沒辦法睡覺，該怎麼辦呢？孩子們幫麥克想想辦法……寫一封信給他，信的內容要寫什麼呢？[114]"},{"id":"7f8c46b3612d4fbb97cd0884","n":"聖誕老公公是怎麼鑽進煙囪的？","a":"麥克・巴奈特(Mac Barnett)","d":"雍・卡拉森(Jon Klassen)","t":"李明彝","p":"上誼文化","y":["113","114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789577627520","dt":"112/10","pr":350,"desc":"關於聖誕老公公究竟是怎麼鑽進煙囪的繽紛奇思妙想，讓人忍不住哈哈大笑，也忍不住想起聖誕季節的美好盼望。童年的願望與作者無窮無盡的腦筋急轉彎碰撞出彩色火花，在黑烏烏的書頁間閃耀光芒。與孩子共讀時可以問問他們對每個問題的想法，也可以讓他們設想更多書裡沒有的精采情節，因為孩子們的想像世界沒有極限！[114]"},{"id":"b3ea6e91a4a54118a3bf813a","n":"你要上車嗎？","a":"宮西達也","d":"宮西達也","t":"邱瓊慧","p":"小魯文化","y":["113"],"ag":"0~3","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786267350065","dt":"112-09","pr":350,"desc":"水果寶寶們準備要上車囉！小朋友要幫他們配對好相同顏色、相同圖案的水果和卡車。繪本中車子的圖案隱藏巧思：橘色卡車的車輪藏著橘子蒂頭的圖案，黃色卡車像極了剝開一半的香蕉。這些圖案的設計巧思讓小朋友注意細節，還可以練習對應思考與邏輯推理的能力。最後一個跨頁展現宮西達也一貫的童趣，意想不到地蹦出小西瓜卡車頂"},{"id":"a4635ea53e6a4433b06ebe69","n":"農場老屋的故事","a":"蘇菲・布雷克爾","d":"蘇菲・布雷克爾","t":"柯倩華","p":"水滴文化","y":["113"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9786267352076 ","dt":"112-09","pr":420,"desc":"作者買下一座古老的農場和農場上的老屋，將屋裡遺留的物品轉化成圖畫中的細節，並且靠著豐富的想像力和對過往生活的認識，逐漸編織出這個故事。作者巧妙地融合拼貼和繪畫，把農舍和農場的裡裡外外都呈現出來，讓讀者透過畫中的細節了解過去的生活，以及時間流轉中，家人互動的點點滴滴。[113]"},{"id":"f0dbc2539d73462b9aa3abf6","n":"好高、好高！","a":"蘇珊娜・施特拉瑟(Susanne Straßer)","d":"蘇珊娜・施特拉瑟(Susanne Straßer)","t":"黃迺毓","p":"上誼文化","y":["113","114"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789577627599","dt":"112/09","pr":360,"desc":"這是一本超級有趣的對比認知繪本。好好吃的蛋糕在那麼高、那麼高的地方。小熊不夠高，他的朋友也不夠高，要一起合作疊高高才能吃得到。觀察動物們怎麼疊高高，做了哪些改變，和孩子討論怎麼安排比較好。觀察動物們表情和動作的變化，想想他們的感受，猜猜他們能吃到蛋糕嗎？[114]「好高好高」的窗上，有好吃的蛋糕，小"},{"id":"pejszs5ap3ijegrudum6vkhy","n":"哈囉！波波","a":"米津祐介（Yusuke Yonezu）","d":"米津祐介（Yusuke Yonezu）","t":"簡叔萱","p":"格林文化","y":["114"],"ag":"0~3","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9786267295113","dt":"112/09","pr":320,"desc":"小熊波波的冒險旅程激發孩子的好奇心與求知欲，透過互動式問答引導孩子思考與表達，並在探索中培養解決問題的能力。摺疊內頁設計增添閱讀驚喜，硬紙板材質與圓角設計則貼心考量孩子安全。溫馨故事結合豐富互動，使孩子在輕鬆愉快的閱讀體驗中，感受親情的溫暖與陪伴。[114]"},{"id":"m56v4x7gcm6c269woiy1yzl4","n":"最長的暴風雨","a":"丹.雅卡理諾（DanYaccarino）","d":"丹.雅卡理諾（DanYaccarino）","t":"張淑瓊","p":"親子天下","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786263055490","dt":"112/09","pr":360,"desc":"突如其來的暴風雨，限制了一家人只能躲在家裡避風雨；能做的事情不多，但時間卻很多，一家人整天窩在一起，開始產生摩擦、對彼此生氣。而深夜的雷聲，震裂了這緊張氛圍，感受到對彼此的需要，真正接納彼此。可在圖像中尋找這一家人有哪些成員？誰在洗碗、煮飯？和孩子談談性別角色分工。[114]"},{"id":"926a783208694eeba636917d","n":"小木頭機器人和圓木公主","a":"湯姆・高爾德","d":"湯姆・高爾德","t":"柯倩華","p":"小麥田出版","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786267281116","dt":"112-08","pr":420,"desc":"這是一則擁有現代元素的童話故事，角色包括國王、皇后、用魔法創造的公主，和發明家製作的機器人。正如古老的童話一般，主角必定經歷種種困難，才能淬煉出內在美好的本質。作家用分格漫畫的手法安排文字和圖畫，把故事複雜的情節梳理清楚，同時鼓勵讀者用想像力補足未竟之言。[113]"},{"id":"f8d22ece492d4d81808d2703","n":"超級無敵多隻小豬和大野狼","a":"大衛・卡利","d":"瑪麗安娜・巴杜契","t":"楊玲玲、彭懿","p":"上誼文化","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789577627667 ","dt":"112-08","pr":360,"desc":"想聽長故事的孩子遇到創意十足的爸爸用「一下子就說完了」的方式，改編十幾種三隻小豬和大野狼的故事。爸爸和孩子逗趣又真實的對話，讓故事結尾的翻轉令人讚嘆和大笑。本書鼓勵爸爸一同育兒，一起改編童話，激發孩子的想像、創造力和幽默感，再透過角色扮演，演出逗趣的創新故事。[113]"},{"id":"6a99b64f0ecc44aeb8005d51","n":"熱狗","a":"道格・薩拉帝","d":"道格・薩拉帝","t":"劉清彥","p":"遠見天下文化(小天下)","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786263552708","dt":"112-07","pr":450,"desc":"城市的夏天，熱騰騰的人行道，刺耳的聲響&hellip;&hellip;，感受臘腸狗正在經歷窒息的炎熱。當畫面上的顏色從橙色、紅色和黃色轉變為藍色和綠色時，讀者也同時感受到微風拂面的清涼。作者精準地捕捉臘腸狗的肢體語言、眼睛和臉部表情；這其實是一本視覺詞彙遠大於文字詞彙的繪本，每次讀，都有新發現。[1"},{"id":"33a4439f86524908b271edc2","n":"神奇好眠床：全世界的好孩子睡哪兒？","a":"蕾貝卡・龐德","d":"莎莉・梅弗","t":"周惠玲","p":"遠流出版","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786263611788","dt":"112-07","pr":399,"desc":"世界各地不同國家、文化的孩子，他們都安穩地睡在什麼樣的床上呢? 這是一本「縫出來」的繪本！作者用毛氈刺繡藝術，手工縫製出與文本比例大小相同的織物，再經攝影印刷創作組成，美得令人驚奇！從書中孩子安睡的房間，我們看到多元的文化特色，想像世界上有與我們迥然不同的生活方式。這本書幫孩子打開世界的窗，讓他們對"},{"id":"w8pwb0u1rcxpc8na3mq8s916","n":"再等一下下！","a":"李憶婷","d":"李憶婷","t":"","p":"親子天下","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理","cl":false,"lo":true,"isbn":"9786263055025","dt":"112/07","pr":360,"desc":"烏龜曼曼做事總是慢條斯理，兔子蹦蹦則是總想快快行動。當這兩位性格迥異的好朋友一起去爬山，會發生什麼有趣的事呢？從出發到登頂，快與慢的對比展現得淋漓盡致，也讓孩子看到朋友間的互補與珍貴友誼。這不只是關於速度的故事，更是學習每個人都有不同的個性。透過這個溫暖又幽默的故事，孩子能學會包容彼此的不同，珍惜並"},{"id":"cfad625874aa4c8ba9619c6e","n":"健忘的阿默","a":"朱迪絲・克爾","d":"朱迪絲・克爾","t":"林真美","p":"遠流出版","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9786263610408","dt":"112-06","pr":360,"desc":"阿默是一隻健忘的貓，常常闖禍，大人總是嫌牠不可愛，孩子卻能看到牠的好處。本書作者是用文圖說故事的高手，尤其會在圖中留下線索，讓讀者享受發現的樂趣。同時，讀者也會將自己投射在阿默身上，發現自己雖然不完美，但總有可愛之處，甚至可能幫助大人解決難題。[113]"},{"id":"f983f965c6db4a72b2eb2bdc","n":"第一次出門買東西","a":"筒井賴子","d":"林明子","t":"林真美","p":"親子天下","y":["113"],"ag":"3~5","c":"身體動作、社會情緒、生活自理","cl":false,"lo":false,"isbn":"9786263054035","dt":"112-06","pr":380,"desc":"這本書不僅描繪小女孩第一次獨自出門買東西的過程，也把她經歷的複雜感受表達得淋漓盡致。而圖畫除了「說故事」之外，更用各種視角呈現小女孩居住的社區，畫中安排的細節，更補充了文字沒有說的內容，讓讀者可以充分享受讀圖的樂趣，並從中領會「成長」的滋味。[113]"},{"id":"3a0c364c5e2745c99aab2610","n":"佳佳的妹妹不見了","a":"筒井賴子","d":"林明子","t":"游珮芸","p":"親子天下","y":["113"],"ag":"3~5","c":"身體動作、社會情緒、健康與安全","cl":false,"lo":false,"isbn":"9786263054820","dt":"112-06","pr":380,"desc":"讀著繪本，跟著佳佳一起焦急地尋找妹妹。巷口的煞車聲，讓人捏一把冷汗，看似熟悉的背影和哭聲卻都是誤認，心臟砰砰跳也要努力回想妹妹可能去的地方，書中的情節很容易勾起我們的相似經驗。\n讀完這本書後與孩子討論大人不在時的緊急狀況處理，以及共感佳佳與妹妹的姊妹情誼，是共讀這本書時最溫馨的延伸活動。[113]"},{"id":"ab96cdcaa2434881bcac3c1b","n":"今天是什麼日子？","a":"瀨田貞二","d":"林明子","t":"林真美","p":"親子天下","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263054004","dt":"112-06","pr":380,"desc":"這本書吸引了一代又一代的讀者，一起參與作者設計的巧妙遊戲，享受解謎的樂趣；讀者也進入了圖畫裡描繪的那個溫暖的家，一邊跟著故事裡的媽媽到不同的空間去尋找女兒藏的紙條，一邊觀察著傢俱與擺設，彷彿直接參與了這家人的生活，感受家庭美好的氛圍，和彼此之間的愛。[113]"},{"id":"c62da28d740646419898906a","n":"通往糖麵包山的那條路","a":"瑪麗安・居布克","d":"瑪麗安・居布克","t":"謝蕙心","p":"拾光工作室","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789869873673","dt":"112-06","pr":360,"desc":"這是一則關於友誼、陪伴和生命傳承的暖心故事，文字和圖畫都散發著溫柔。作者用超過32頁的篇幅，描述獾奶奶和小貓每週一次的爬山之旅、路上遇到的朋友、做過的事，以及登上山頂後看到的風景。把生命智慧教給小貓的獾奶奶，就像在孩子身邊關愛他的成人。[113]"},{"id":"q47014kz6l2z1tziathfue04","n":"更棒的骨頭","a":"科瑞．R. 塔博","d":"科瑞．R. 塔博","t":"何尉賢","p":"弘雅三民(小山丘)","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263079755","dt":"112/06","pr":350,"desc":"有一天，小狗賽門到池塘邊玩耍，找到一根世界上最棒的骨頭，突然間，他發現另一隻和他一樣的小狗，叨著一根比自己的「更棒」的骨頭，賽門用盡各種方法要跟他交換……作者巧妙地預留空間，讓孩子們發現賽門的錯誤，啟動思考，創造驚嘆的感受。直式上下翻頁的設計，巧妙形成水面上下倒影的效果，結局美好的轉折，讓孩子體會分"},{"id":"i50j5hpvjckdm7j9sup5xqxy","n":"勇氣帽","a":"凱特．霍夫勒(Kate Hoefler)","d":"潔西莎．貝格利(Jessixa Bagley)","t":"黃筱茵","p":"遠流出版","y":["114"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9786263610958","dt":"112/05","pr":370,"desc":"害怕大熊的女孩，戴上熊的頭套，偽裝成熊；害怕人類的大熊，戴上人類的頭套，偽裝成人類；偽裝的女孩和大熊卻在火車鄰座巧遇，在旅途開啟時兩者害怕彼此、隨著火車前行也開啟對話、然後一起欣賞車窗外的景象。這是一段從陌生、認識、接納彼此的心路歷程，過程中克服了恐懼、彼此卸下心防、敞開心胸坦誠以對，終究成為摯友。"},{"id":"13914bfe919a43cc8e68bf86","n":"小根和小秋","a":"林明子","d":"林明子","t":"林真美","p":"維京國際","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、健康與安全","cl":false,"lo":false,"isbn":"9789864404797","dt":"112-04","pr":350,"desc":"狐狸布偶一路陪著小女孩長大，不只當她的玩伴，也是她依靠的對象。當他們搭火車去奶奶家修補狐狸布偶脫線的手臂時，卻遇到了危難，小女孩必須為了布偶挺身而出，跨出了成長的一大步，從需要被照顧，變成能照顧別人的人。這是一本結合想像與現實的書，把成長轉化成溫暖又能激勵孩子的故事。[113]"},{"id":"b8a4ab75db8f4d7ca5b7dc98","n":"是誰在門外啊？","a":"筒井賴子","d":"林明子","t":"米雅","p":"聯經出版","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789570868364","dt":"112-04","pr":340,"desc":"剛搬家的小惠，怯生生、安安靜靜地陪著忙碌的爸爸媽媽整理新家，但郵箱裡每天都有人送來一件小東西，這是讓小惠最好奇的事！有時是一束花，有時是一封做朋友的邀請。小惠越來越期待，終於在叩咚的聲音再度響起時，她打開了大門&hellip;&hellip;筒井賴子的繪本，總會有神秘的驚喜，在書末謎底揭曉時，柔和又"},{"id":"d2707324776c40658b62538b","n":"想當太空人的大象","a":"詹姆斯・弗利","d":"詹姆斯・弗利","t":"蔡心語","p":"小宇宙文化(方言出版)","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786267208274","dt":"112-03","pr":320,"desc":"象黛拉想成為太空人，她是一隻大象！她懷著熱情去太空中心遞送申請書，但是太空衣太小、太空梭載不動、沒有適合的訓練課程，也沒有太空人願意跟她一起上太空。象黛拉最終實現她的太空人夢想，她是怎麼做到的呢？ 你想知道有哪些動物曾上過太空嗎？[113]"},{"id":"e210125de42a451ebc0e603b","n":"世界上最棒的蛇（新版）","a":"湯米・溫格爾","d":"湯米・溫格爾","t":"方素珍","p":"遠見天下文化(小天下)","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263551237","dt":"112-03","pr":320,"desc":"郵差送來一個像輪胎形狀的包裹，會是什麼生日禮物呢？這是前所未見的角色設定，故事簡潔，卻隱含多采多姿的表達，畫面以簡單線條勾勒，搭配蟒蛇的綠，畫龍點睛的紅，恰好渲染活潑逗趣的氣氛。豐富的想像力，讓人讀來欲罷不能。[113]"},{"id":"a8id3t1l4qfryjeatwt22j1j","n":"酸葡萄","a":"喬里約翰（Jory John）","d":"皮特奧瓦德（Pete Oswald）","t":"王欣榆","p":"格林文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9786267180778","dt":"112/03","pr":350,"desc":"這本繪本的主角酸葡萄曾是一顆甜葡萄，但現在總對什麼都不滿，心裡滿是讓他不開心的事，他經常對朋友發脾氣，不僅惹得大家不開心，自己也變得很鬱悶……，酸葡萄能找回甜美的自己嗎？隨著故事發展，孩子將與酸葡萄一起尋找變甜的方法，學習理解自己的情緒，並真心與朋友互動。本書可以幫助孩子培養同理心，讓生活充滿善意與"},{"id":"1cc91778a39a4454a9e36513","n":"阿嬤家","a":"翁藝珊","d":"翁藝珊","t":"","p":"信誼基金","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789861617145","dt":"112-02","pr":300,"desc":"「阿嬤家」給你什麼印象呢？是歲月的博物館，還是探索的樂園？童玩、謝籃、保溫瓶，針車、唱機、鑄鐵窗&hellip;&hellip;每一件看似囤積的物品卻都有著阿嬤珍藏的回憶。我們看到屬於阿公阿嬤年代的生活點滴，也體會到老人家愛物惜物的心情。後來因為搬家，大家陪著阿嬤對這些寶物做了一番斷捨離，只把最摯愛"},{"id":"mhi7ngr810suh9r6ma4qa70n","n":"小金魚逃走了","a":"五味太郎","d":"五味太郎","t":"信誼基金會出版社編輯部","p":"信誼基金","y":["114"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789861617084","dt":"112/02","pr":250,"desc":"小金魚逃走了，逃到哪裡去了呢？逃到窗簾上、花盆裡、鏡子裡……小金魚「躲」進各個生活場景中，和孩子們玩躲貓貓。共讀時，除了可以跟孩子一起享受「找到了」的快樂，也可以尋找圖畫裡和家裡的其它東西，認識顏色、認識數字、學數數！和孩子討論小金魚為什麼要逃走呢？最後逃到哪裡就不逃了呢？大海裡的小金魚都長一樣嗎？"},{"id":"0710235eba3f4d93909b0a84","n":"小兔子的超能力","a":"艾蜜莉・瓦茲","d":"艾蜜莉・瓦茲","t":"吳愉萱","p":"親子天下","y":["113"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9786263053762","dt":"112-01","pr":360,"desc":"小兔子最崇拜超級英雄了！先把自己打扮成超級英雄的模樣，再來要像超級英雄一樣擁有超能力。憋氣、變色、飛翔......猜猜看，誰是擁有這些超能力的超級英雄？作者用獨特的幽默和充滿童趣的精緻圖畫，幫小兔子探索自己的超能力，那孩子呢？每個孩子都有某種超能力唷！[113]"},{"id":"c15nocwu6lqaypf9zxq3plj6","n":"爸爸，10多不多？","a":"薩賓娜．波曼(Sabine Bohlmann)","d":"艾蜜莉．吉貝克(Emilia Dziubak)","t":"賴雅靜","p":"青林國際","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789862746202","dt":"112/01","pr":320,"desc":"10隻螞蟻抬一根香蕉、10隻猴子搬一根香蕉，這兩種情境裡，10多不多？一隻小狼高不高，要看跟長頸鹿比，還是跟青蛙比？因此，多不多、高不高、快不快、胖不胖，都會因跟誰比、跟什麼比，而大不同。比不比，「人生也一樣，沒有任何不同！」。一本思考「比較」的繪本，也是一本學習不用比較的繪本。[114]"},{"id":"no0msk8b46zjj82d3rsfw2hf","n":"我會飛","a":"郭飛飛","d":"郭飛飛","t":"","p":"和平國際文化","y":["114"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789863714095","dt":"112/01","pr":280,"desc":"這是一則充滿活力與希望的故事，讓孩子跟隨小企鵝泡泡一起勇敢追夢！泡泡渴望像其他鳥兒一樣飛翔，儘管大家都告訴他「企鵝不會飛」，但泡泡不輕言放棄，他堅信「企鵝也有翅膀，為什麼不能飛呢？」於是，他努力揮動翅膀，不斷嘗試與練習，最終發現了與飛翔同樣快樂的事。這本繪本不僅鼓勵孩子勇敢面對挑戰，也教導孩子在努力"},{"id":"7dc5a440dd174ba98d6d9005","n":"我的城市會說話：不用眼睛，更能聽見都市模樣","a":"戴倫‧勒布夫","d":"艾詩麗‧巴倫","t":"葉嘉青","p":"小宇宙文化(方言出版)","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9786267208038","dt":"11112","pr":340,"desc":"本書描述了一位視障女孩如何透過傾聽和感知，與周遭城市緊密連結。作者細膩地捕捉角色用心感受世界的過程，鼓勵讀者思考生活中的美好。運用獨特的紙片剪綵藝術，讓讀者感受視障者的真實經歷，增進親子互動與同理心，在多元教育的浪潮下，本書將是孩子們認識多元文化與包容差異的絕佳教材。[112]"},{"id":"0e5a086042ee488e8ab2b441","n":"晚安，小熊","a":"鄭潔文","d":"鄭潔文","t":"","p":"聯經出版","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789570864380 ","dt":"111-12","pr":380,"desc":"臺灣黑熊的寶寶和我們一樣，是媽媽的掌上明珠，出生只有巴掌大的熊寶寶從小就和媽媽形影不離，熊媽媽用憐愛的眼光看著小熊漸漸長大，看著牠走路、採果、捕食，看著牠第一次被蜂螫、第一次嚐到獨自獲取的蜂蜜，小熊的成長過程和我們如此相似。小熊住的森林裡還有許多臺灣特有的動植物，你可以在繪本裡驚喜地找到牠們！因為有"},{"id":"8cb3e33a6ff64fac994f5ee2","n":"再仔細看一看","a":"shimizu","d":"shimizu","t":"蘇懿禎","p":"小熊出版","y":["113"],"ag":"0~3","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9786267224069","dt":"111-11","pr":350,"desc":"本書透過童趣、巧思和結合日常的圖像設計，讓孩子體驗遠看「以為是」，近看「原來是」的想像大驚喜，培養孩子的觀察力、專注力、美感和創意。共讀時，和孩子享受對話和互動說故事的樂趣。再利用別冊「圓的聯想」、「我的點心」和「送給爸媽的花」的美術活動，陪孩子創造新奇世界。[113]"},{"id":"659c164619354ccda5e3e1fd","n":"恐龍先生流鼻涕以後","a":"童言","d":"劉佩佩、常博文","t":"","p":"信誼基金","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789861617077","dt":"111-11","pr":280,"desc":"恐龍先生一直以來都以「會噴火」為傲，有一天牠流鼻涕了，失去了那個牠認為最重要的噴火特質，恐龍很難過，想要把火找回來。在一個失火的場景，沒想到恐龍先生竟然用原本令他難過的強大鼻涕水柱撲滅火災。這本書的主角拙趣可愛，性格純真多面，牠經歷挫折以後，發現原來還有自己所不知道的能力。牠也從中學會自我接納，得到"},{"id":"afe75fa4e5c2424eaebb8b3f","n":"做伙來踅大稻埕-大稻埕動物園","a":"林小杯","d":"林小杯","t":"","p":"是路故事","y":["113"],"ag":"3~5","c":"本土語言圖書、語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9786269534722","dt":"111-11","pr":304,"desc":"大稻埕的街區、洋行、南北貨一直留有歷史的風韻，但是，大稻埕動物園在哪裡呢?原來在華麗的巴洛克建築中、在廟宇的屋瓦和神桌下、在傳統商行及打鐵店裏，孩子從他們的視角幫我們在大稻埕裡發現好多動物！再配上生動的臺語童謠，動物們就活靈活現地躍然眼前。透過這本書，孩子可以體會大稻埕的傳統與現代、感受臺語的內涵與"},{"id":"bbe79786e0cc4e6290ddbd57","n":"大大先生","a":"艾德・維爾(Ed Vere)","d":"艾德・維爾(Ed Vere)","t":"海狗房東","p":"維京國際","y":["113","114"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789864404483 ","dt":"111/11","pr":350,"desc":"人們是否經常先入為主地評斷他人？又有沒有可能打破偏見？本書帶著孩子們認識才華洋溢的大大先生，也看見他原本的孤獨，還有搖擺的音樂與共同分享為人群和大大先生帶來的美妙變化。學習理解自己與他人、學習表達、學著彼此欣賞，都是童年最重要的學習，值得細細體會。[114]一隻拿著喇叭的猴子用吸引人的對話泡泡介紹「"},{"id":"5e7b0ddaec0e43b08b1d895a","n":"綴圓仔講臺語2：佮阿公踅菜市場","a":"海狗房東","d":"黃立佩","t":"呂美親","p":"玉山社","y":["112"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789862943120","dt":"11110","pr":380,"desc":"這是一本充滿本土風味的閩南語繪本，力求讓本土語言在現今社會中扎根，並傳承給年輕一代。傳統市場場景喚起我們小時候與阿公一起上菜市場的美好回憶。當中，各式各樣的蔬果讓人驚喜不已，也讓人感受到臺灣豐富的農產物之美。本書適合老幼共讀，不僅可以讓長輩與孫子共同回憶過去美好時光，更能讓閩南語在新的世代中得到延續"},{"id":"2eccac82040a42d2a5881ad3","n":"媽媽，對不起！","a":"宮西達也","d":"宮西達也","t":"蘇懿禎","p":"小熊出版","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9786267140901","dt":"111-10","pr":350,"desc":"宮西達也用詼諧的方式，將孩子那些令人焦頭爛額的搗蛋行徑，轉變成會讓媽媽會心一笑的繪本，同時讓媽媽感受到溫暖的支持。 這本書少見地由孩子的視角體貼理解家長的辛勞，在跟媽媽說聲「對不起」的同時，孩子的心裡卻有著一直被包容、被愛著的踏實 。[113]"},{"id":"825f532748994175b2132ad6","n":"小紙船看海（新版）","a":"林良","d":"鄭明進","t":"","p":"聯經出版","y":["113","114"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789570865332","dt":"111/10","pr":350,"desc":"山上的小紅紙船和城市的小白紙船相遇了，各自的旅程變成共同的旅程，害怕的心也因為相互依靠而變得勇敢。這個故事讚頌冒險、旅行與持續探索，小紙船的旅行也像孩子們的成長旅程，愈是勇於逐夢，愈是驚喜連連。清亮的文字與鮮麗的畫面就像悠悠的歌，唱著走吧走吧，跟我們去看看更大更寬廣的世界。[114]來自山上的紅紙船"},{"id":"qhkq4o39xm2bbu0tbms25qw3","n":"毛朋友：小小的","a":"陳彥伶","d":"陳彥伶","t":"","p":"弘雅三民(小山丘)","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、健康與安全","cl":false,"lo":true,"isbn":"9786263077300","dt":"111/09","pr":329,"desc":"魁梧的鱷魚卡卡與夥伴們攜手尋找蛋的媽媽，在探索中，他們發現「溫柔」可以有不同的詮釋。每個角色依據自身經驗解讀蛋的形態，展現世界並無絕對標準，每種視角都值得尊重。故事巧妙融合友情、關懷與自我成長，讓孩子學習理解與包容，並體會照顧與陪伴的價值。[114]"},{"id":"2c4a066987d44c3d9fefc5be","n":"我來幫你開","a":"吉竹申介","d":"吉竹伸介","t":"游珮芸","p":"親子天下","y":["112"],"ag":"3~5","c":"生活自理","cl":false,"lo":false,"isbn":"9786263052215","dt":"11108","pr":300,"desc":"本書是一本教育性和趣味性兼備的童書，作者以輕鬆幽默的筆調，描述小男孩光光因為力氣不夠而無法打開東西的困境，並透過爸媽的協助和鼓勵，讓他克服困難，相信自己做得到，長大成為能獨立自主、為他人服務的人。父母可以陪伴孩子一起成長，以協助和鼓勵的方式，讓孩子建立起健康自信的成長心態。[112]"},{"id":"dr5w3fszpwuflhdayftqimgx","n":"神祕甲蟲","a":"許增巧","d":"許增巧","t":"蕭昀(審訂)","p":"聯經出版","y":["114"],"ag":"3~5","c":"認知探索、健康與安全","cl":false,"lo":true,"isbn":"9789570864656","dt":"111/08","pr":350,"desc":"一場奇妙的生態探險，從親子偶然發現雞母蟲展開，逐步探索牠的生態習性。透過觀察、飼養與資料查找，孩子在好奇心的引領下，體驗科學探究的樂趣。細膩的插圖與溫暖的敘事，使生物觀察生動有趣。書末附有甲蟲介紹與飼養指南，鼓勵孩子細心觀察、尊重生命，並培養環境保護意識。[114]"},{"id":"m82zf5l9c1vk47986it7rzas","n":"記憶氣球","a":"潔西．歐利維羅斯(Jessie Oliveros)","d":"達娜．沃非科提(Dana Wulfekotte)","t":"黃筱茵","p":"道聲出版","y":["114"],"ag":"3~5","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789864004225","dt":"111/07","pr":380,"desc":"以有形的氣球來表徵生命的記憶，各個顏色的氣球裝載著不同的生命故事，飄走的氣球具象化了記憶的消失。以黑色鉛筆畫為主體，只呈現氣球的顏色，突顯故事主題。爺爺的氣球卡在樹上，所以一直說重複的事；氣球飄走，所以忘了；一頁接一頁的圖像，具體呈現了逐漸老化的生命樣貌，是一本讓孩子認識失智、了解生命的繪本。[11"},{"id":"xddo9a7i7rqoskr7nijq6h44","n":"章魚先生賣雨傘","a":"韓煦","d":"韓煦","t":"","p":"南門書局","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786263420137","dt":"111/07","pr":320,"desc":"好厲害的八爪章魚，同時拿著各色雨傘推銷，大象選灰傘、獅子買橘傘……；但綠色蜥蜴卻選了彩虹傘？圖裡沒看到黑傘，有賣嗎？這樣的故事轉折，引發孩子閱讀思考怎麼辦？而章魚每頁推薦的雨傘顏色，也預告了下一位登場動物的特性；最後買黑傘的動物又是誰呢？這些都是值得引導孩子觀察和發現的共讀樂趣喔！[114]"},{"id":"hlapqj6hv0ya6w9gn7xr9k7w","n":"孩子的情緒互動書-生氣的書","a":"塞得里克．哈瑪迪耶(Cédric Ramadier)","d":"文森．布爾喬(Vincent Bourgeau)","t":"楊喬安","p":"上誼文化","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789577627353","dt":"111/07","pr":280,"desc":"這本繪本是幼兒可以閱讀的故事，也是他們可以直接對話的好朋友。小老鼠扮演引導者，帶領孩子看見與體會生氣的感受，也提供撫慰情緒與平息怒氣的方法。色彩逐漸轉換的設計不著痕跡地體現了情緒慢慢平復的過程，本書會是孩子生氣時的良伴，也可以協助父母度過親子情緒風暴。[114]"},{"id":"f971eaab690b476bbb700878","n":"大象忘忘","a":"王宇清","d":"南君","t":"","p":"親子天下","y":["112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9786263051850","dt":"11106","pr":350,"desc":"改編真實事件的故事，讓受傷的大象，在四隻大象朋友的陪伴下，重新找回自由與快樂。光影和色彩變化的細緻圖畫，傳遞忘忘痛苦過往的灰暗展現獲得關懷與陪伴的忘忘，重拾力量，活得幸福精彩。共讀時，引導孩子從文字和圖畫感受忘忘的心情轉變，安心做自己，也能用愛回應需要關懷的人或動物，成為別人安心的溫柔力量。[112"},{"id":"ad5cb3129d034c58b62380a0","n":"塞車","a":"鄭淑芬","d":"鄭淑芬","t":"","p":"和英出版社","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789869439251","dt":"111-06","pr":350,"desc":"下雨天最容易塞車了。在令人煩躁的塞車中，妹妹的思緒越過車窗，彷彿置身在一片海底世界中。因為心情的轉換和豐富的想像力，路樹變成柔軟的海草，路燈變成鮟鱇魚，雨夜裡車陣長龍的車燈變成一串漂亮的珍珠。車禍造成的爭吵像是打架的鯊魚，需要大鯨魚警察來處理。章魚先生舉著好多出口標誌，引領車子魚貫坐上貝殼電梯，最後"},{"id":"0eefc7f6044f4abfa5296af7","n":"0～3歲玩出好腦力：紅色圓形是哪個？","a":"清水大介","d":"清水大介","t":"劉子韻","p":"小熊出版","y":["112","113"],"ag":"0~3","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9786267140246","dt":"11106","pr":350,"desc":"&nbsp;對話式親子互動的手指遊戲書， 從認識「顏色」、「形狀」，到「顏色」加上「形狀」，延伸到「數數」、「數量」、「大小」等概念。提供引導句、延伸問句和主題標示，幫助家長發想更多問題和提問方式。新手家長也能輕鬆運用，享受親子共讀的歡樂。孩子答對時請給予稱讚，提昇孩子的自信心與成就感。[113]這"},{"id":"ozb6y28hm1rjg6iqwnc05k8r","n":"再試一次，行不行？","a":"娜歐蜜．瓊斯 (Naomi Jones)","d":"詹姆斯・瓊斯(James Jones)","t":"游珮芸","p":"水滴文化(城邦出版)","y":["114"],"ag":"0~3","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786267038321","dt":"111/06","pr":360,"desc":"正方形和六邊形疊出了高塔；圓形見狀也想和菱形、三角形一起搭高塔。孩子們喜好模仿的天性，但可能因為不了解自己的特性，而遭遇到困難。圓形修正自己的缺點，找出自己的優勢，形狀們學會了利用自己的特性，彼此合作變成火箭、樓梯等。可引導孩子觀察各形狀有什麼特性？拿出家中的形狀積木來實際疊疊看唷！[114]"},{"id":"f922585bb902442db8a25cd6","n":"最小的犛牛","a":"露・弗雷澤(Lu Fraser)","d":"凱特・辛德利(Kate Hindley)","t":"吳愉萱","p":"阿布拉教育文化","y":["112","113","114"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理","cl":true,"lo":false,"isbn":"9786269586844","dt":"111/06","pr":300,"desc":"孩子總是渴望長大，不過有許多珍貴的生命體驗，也只有小小的時候才能經歷。最小的犛牛在故事裡歷經一番波折，總算體會到當下的自己獨一無二的價值。孩子在優美的文字描述間走進冰天雪地的高山，跟著小犛牛鍛鍊自己、努力學習，也在詼諧生動的圖像間，踏上自我了解的旅程。[114]在白雪皚皚的山頂上，有一群穿著鮮豔時尚"},{"id":"4baf5218a0d94fc58b39449b","n":"丹尼爾的美好一天","a":"米夏・亞齊","d":"米夏・亞齊","t":"吳其鴻","p":"米奇巴克","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789860645163","dt":"111-05","pr":320,"desc":"一翻開書，就會被這本書充滿活力的色彩和生動的拼貼吸引。丹尼爾在這個生氣勃勃的社區裡提問:「怎樣才會讓你有美好的一天呢？」每個人都有不同的回答：樹蔭下的長椅、寶寶長長的午覺、蜜蜂拜訪花朵、行人友善的臉孔、乘客的感謝、丹尼爾給奶奶的擁抱等。這本書帶我們察覺這些生活中的平凡，是那麼地溫暖又歡愉。[113]"},{"id":"iowm4vxp8m21hd14es8lyr8x","n":"好想變成你","a":"奧利維耶．塔列克(Olivier Tallec)","d":"奧利維耶．塔列克(Olivier Tallec)","t":"宋珮","p":"道聲出版","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789864004188","dt":"111/05","pr":300,"desc":"一隻不想做自己的松鼠，因為羨慕其他動物而改變自己的模樣，長出鹿角、背部生出尖刺……，模樣越來越奇特，猜猜看，松鼠最後想要變成什麼動物呢？共讀時，孩子能認識許多動物的獨特身體特徵與生活習性，透過松鼠誇張逗趣的表情，一起探索松鼠內心的喜怒哀樂。這本繪本以幽默的方式引導孩子思考：做自己，或許才是最棒的選擇"},{"id":"b758dcc2b9f24a7a95599596","n":"兔子先生去散步","a":"五味太郎","d":"五味太郎","t":"信誼編輯部","p":"信誼基金","y":["112","113"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789861616759","dt":"11104","pr":220,"desc":"&nbsp;\n這本書是孩子生活符號的啟蒙書。我們的生活中充滿各種符號，孩子會根據他的生活經驗和想像力解讀符號的意義。讀這本書，孩子跟著兔子先生去散步，經歷路上各種新奇有趣的事，可以培養對圖像辨識、生活想像、和情節預測的能力。共讀時可以試著與孩子對話：「這是什麼標誌呢？」「接下來會發生什麼事呢？」閱讀"},{"id":"cd4d5b0ad8074c0db954bdef","n":"影子","a":"Suzy Lee","d":"Suzy Lee","t":"","p":"大塊文化","y":["113"],"ag":"3~5","c":"身體動作、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789860777956","dt":"111-04","pr":450,"desc":"孩子喜愛玩影子遊戲，因為光的方向、距離會影響影子的形狀，產生許多變化。這本無字書設計成上下翻頁，故事從小女孩打開儲藏室的燈開始，上下頁面分別畫出實物和實物的影子，漸漸的影子有了自己的生命，和實物交融，演了一齣戲，是孩子的想像力創造出的戲碼。[113]"},{"id":"n70duad15pd9oqyz2vgfu1bn","n":"麥基先生請假的那一天","a":"菲立普．史戴(Philip C. Stead)","d":"艾琳．史戴(Erin E. Stead)","t":"柯倩華","p":"小魯文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786267043189","dt":"111/04","pr":360,"desc":"這本溫暖動人的繪本，細膩描繪朋友間深厚的情誼。木版畫風格搭配柔和色彩，營造靜謐感人的氛圍。故事中，動物們齊心協力關懷生病的麥基先生，傳遞溫暖與守護的力量，讓孩子理解善意的付出終將獲得回饋。採用雙語對照，能提升孩子的語感與理解力，也兼具情感教育的價值。[114]"},{"id":"chxj0o39506qaaaxneg77hiq","n":"亂七八糟的口袋","a":"思琪．漢歐爾(Ziggy Habaor)","d":"丹尼爾．格雷．巴奈特(Daniel Gray-Barnett)","t":"劉清彥","p":"典藏藝術家庭(小典藏)","y":["114"],"ag":"3~5","c":"社會情緒、認知探索、生活自理","cl":false,"lo":false,"isbn":"9786267031247","dt":"111/04","pr":350,"desc":"小袋鼠亞力覺得媽媽的口袋實在是太亂了！沒想到，亞力一連串努力的背後，藏著媽媽深深的用心。這個故事以幽默慧黠的切入點，訴說親子間密不可分的親暱互動，也讓我們看見聰穎的袋鼠媽媽如何陪伴刺激孩子邁出成長的關鍵步伐。讀者在趣味洋溢的互動中感受到滿滿的愛與關懷，也為小袋鼠的茁壯高聲喝采。[114]"},{"id":"w1hm0uds34i4dab1v606mzc8","n":"香蕉事件","a":"高畠那生","d":"高畠那生","t":"米雅","p":"拾光工作室","y":["114"],"ag":"0~3","c":"身體動作、社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789869873659","dt":"111/04","pr":320,"desc":"載著香蕉的貨車，掉了一根香蕉；來了猴子撿了香蕉吃、扔了香蕉皮；後面來了兔子，踩到香蕉皮滑了跤、揉了屁股就跑了；鱷魚爬過來，看到香蕉皮……。你猜怎麼了？這樣的故事節奏，一直重複到貨車裡的香蕉都掉光；最終，以另一種形式，所有的香蕉都又回到貨車裡啦！一本引導孩子預測、推理、想像的繪本。[114]"},{"id":"0feef336467f48f1b9ae026e","n":"麥基先生錯過巴士的那一天","a":"菲立普．史戴","d":"艾琳．史戴","t":"劉清彥","p":"小魯文化","y":["112"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786267043783","dt":"11103","pr":400,"desc":"當生活的常軌被不經意打亂，當生命的際遇超出預期，迎來的只能是一連串的不順利與心煩？麥基先生的故事告訴我們，若能靜下心來直面逆境，或許將發現那隱藏其中的祝福。這是一本會讓孩子慢下來傾聽他溫柔訴說，靜靜體會隨遇而安人生智慧的特別繪本。[112]"},{"id":"12189be557994ddc845864ee","n":"森林有多少樹？","a":"巴胡","d":"巴胡","t":"歐玲瀞","p":"小宇宙文化(方言出版)","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9786269576333","dt":"11103","pr":320,"desc":"「需要多少棵樹，才能成為森林？」，每一種動物都認為自己知道答案，各說各話，不傾聽也不同意彼此的看法。最後，從灌木叢傳來好小好小的聲音，小螞蟻說話了&hellip;&hellip;這個最小的聲音，說出了讓大家認同且折服的答案。這個故事提醒我們，互相傾聽、每一種聲音都很重要！[112]"},{"id":"7a72408fb4c94fed9e99f923","n":"我要找回我的帽子","a":"雍．卡拉森","d":"雍．卡拉森","t":"柯倩華","p":"親子天下","y":["112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9786263050709","dt":"11103","pr":360,"desc":"獲獎無數的雍‧卡拉森身為當代說故事達人，不但擅於利用低斂的色彩、沈穩的動作、極簡的表情，為繪本創造出鮮明而獨特的藝術高度，更總能以精煉的文字對話、巧妙的故事構思引人在闔上書頁後低迴再三，創造想像力豐富開放，甚至結局各異，神奇多元的閱讀體驗。[112]"},{"id":"113dd699f8344b1e8f05fb31","n":"阿里的飛機","a":"約翰‧伯寧罕、比爾‧薩拉曼","d":"海倫‧奧森柏莉、約翰‧伯寧罕","t":"林真美","p":"遠流出版","y":["112","113"],"ag":"3~5","c":"語言溝通、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789573294498","dt":"111-03","pr":320,"desc":"&nbsp;\n如何讓孩子練習對待和陪伴親近的寵物或家人慢慢衰老、離別，最後好好地說再見？本書為老狗阿里造了一架飛機，讓牠能行動自如、冒險飛翔，最終選擇屬於牠的說再見方式。共讀時，讓孩子從色彩柔和的畫面和「再見了，阿里」這句話，感受守候與陪伴是對最愛的家人的祝福。[113]\n如何和孩子述說對待、陪伴親"},{"id":"f42919eead0a4a3a88554f5d","n":"蔬果戴帽子","a":"三浦太郎","d":"三浦太郎","t":"林佩勳","p":"小魯文化","y":["112","113"],"ag":"0~3","c":"身體動作、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789865566814","dt":"11103","pr":300,"desc":"&nbsp;\n本書以常見的蔬果為主角，巧妙地將形狀不同的「蒂」化為蔬果的帽子，配上簡潔構圖、色彩和文字，充滿童趣。共讀時，讓孩子觀察茄子爸爸、鳳梨哥哥、豌豆莢三兄弟&hellip;&hellip;拿的配件，朗讀文字和狀聲詞，猜猜他們要出門做什麼？也可畫不同蔬果配戴形狀、數量不同的帽子，會產生很多趣味"},{"id":"19171e4ac242459cbd71e096","n":"海底在排什麼呢？","a":"大村知子","d":"大村知子","t":"林芝儀","p":"小魯文化","y":["113","114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9786267043820","dt":"111/03","pr":350,"desc":"融合海洋世界奇妙的生態與孩子熟悉的日常活動，《海底在排什麼呢？》是一部兼具知識探索趣味與遊戲感的生動作品。爸媽可以陪著孩子慢慢觀賞畫面、仔細查看每隻魚或海洋生物的表情與身上的特徵。書末的拉頁與令人驚奇的情節轉折，使這本繪本更添猜謎偵探故事與角色懸殊比例帶來的震撼。願每個孩子都能珍愛自然，與地球上所有"},{"id":"ss3w6mxjg0wiwhicgbgxmn5f","n":"媽媽小時候：第一次參加婚禮","a":"鄭靜儀","d":"陳麗雅","t":"","p":"小魯文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789865566692","dt":"111/03","pr":350,"desc":"孩子對婚禮的印象是什麼呢？穿著美麗禮服的新娘？還是滿滿的喜糖？現代的孩子少有機會親身體驗傳統婚禮，這本繪本就像一扇時光之窗，帶領孩子走進一場充滿儀式感的傳統婚禮。故事中的小女孩淳淳參加叔叔的婚禮，從迎娶、拜祖先到熱鬧的宴席，她感受到習俗的獨特與家人團聚的溫馨。共讀時，透過生動的插圖與淺顯易懂的文字，"},{"id":"owgds16vo6y8bvohed7ea1hz","n":"大口大口吃掉一半","a":"渡邊鐵太","d":"南伸坊","t":"許婷婷","p":"弘雅三民(小山丘)","y":["114"],"ag":"3~5","c":"身體動作、語言溝通、生活自理","cl":false,"lo":false,"isbn":"9786263075306","dt":"111/03","pr":329,"desc":"「記得留一半」，孩子們可以從越來越小的蛋糕中認識分數。來吃蛋糕的動物體型越來越小，蛋糕也越來越小，透過視覺圖像一步步引導孩子認識「二分之一」的概念。重複的對話，傳遞分享美食的喜悅；「大口大口的吃掉一半」，大家都不貪心，就算到最後蛋糕變得好小好小，還是要「留一半給奶奶」。也跟孩子一起來玩「大口大口的吃"},{"id":"m5osmc47yxl75c16oiz37oxa","n":"大熊來了","a":"理查．莫里斯(Richard T. Morris)","d":"范雷韻(LeUyen Pham)","t":"黃聿君","p":"遠見天下文化(小天下)","y":["114"],"ag":"0~3","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789865254230","dt":"111/02","pr":320,"desc":"這是一個充滿活力與創意的冒險故事，描繪大熊與森林夥伴們的奇遇旅程。故事情節既幽默又充滿驚喜，節奏明快且引人入勝。獨特的透視畫法與細緻的角色表情，使畫面富有戲劇張力，增添視覺層次感。透過這場挑戰與歡樂交織的歷險，孩子將體會團結與包容的可貴。[114]"},{"id":"9ef6ef4e3b89478da01d2ab6","n":"屋裡屋外","a":"范雷韻","d":"范雷韻","t":"柯倩華","p":"青林國際","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862745663","dt":"11101","pr":360,"desc":"當無數人們向生命叩問，一場世紀大疫帶給世界的，除了悲慟的生命犠牲，還能有什麼？本書除了描繪有形的外在轉變之外，更透過圖像記錄下一個個犠牲奉獻的真實故事，讓讀者看見人們在苦難中淬鍊而出的愛人與關懷的能力、仁慈與良善、堅毅與謙卑、感謝與希望。[112]"},{"id":"8049b3967f834efdb32381af","n":"貓咪看家","a":"町田尚子","d":"町田尚子","t":"上誼編輯部","p":"上誼文化","y":["112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789577627018","dt":"11101","pr":320,"desc":"今天要陪貓咪留下來看家。咦？貓咪進入衣櫥了，快跟上。哇！貓咪從樹洞出來，伸個懶腰，去喝咖啡了。這一天貓咪去了好多地方溜達，玩到天黑才回家。小朋友找找看晚上的客廳和早上的客廳，有哪些不一樣的地方。町田尚子用油畫細膩地描繪貓咪的獨享時光，貓咪的每個眼神，都會讓大小讀者的心瞬間融化。[112]"},{"id":"0fd051bd6daa42f8ad97e8d5","n":"一粒種籽（初心版）","a":"劉旭恭","d":"劉旭恭","t":"","p":"玉山社","y":["112"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789862942956","dt":"11101","pr":350,"desc":"本書以細膩的筆觸描述種籽在春天的期待與掙扎，以及在經歷心情低落後所綻放的美麗。從醫師角度來看，家長在陪伴孩子成長的過程，需要理解每個孩子的成長獨特性，與醫療人員討論，避免過度擔憂。這是一部鼓勵孩子懷抱希望、持續努力和擁抱正向思考的繪本。[112]"},{"id":"4160f3d5aa5e4003b909f5a6","n":"樹的透視書","a":"Nosy Crow","d":"漢娜．艾莉絲","t":"鍾慧元","p":"三民書局","y":["111"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9786263072350","dt":"111.01","pr":399,"desc":"&nbsp;\n提高對四季更迭的敏銳度，有益於養成好奇心與美感。本書是關於樹木及周遭生態的微科普知識書，內頁透明膠片的設計，讓季節變化、樹上與土地下的動態一覽無遺。即使孩子年紀尚小，無法靜心聽完書中文字，本書的設計也能帶給小讀者獨特的美感體驗。\n&nbsp;\n&nbsp;"},{"id":"07df49f50cbb40daba9ace20","n":"翠鳥","a":"邱承宗","d":"邱承宗","t":"","p":"親子天下","y":["112","113"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":true,"isbn":"9789575036799","dt":"111-01","pr":380,"desc":"&nbsp;\n翠鳥，閩南語稱「魚狗」，背部和翅膀的羽毛是寶藍色。生態畫家用細膩生動的筆觸，帶我們欣賞平日難以捕捉的美麗身影，翠鳥姿態優雅地站在香蒲花柱頂，快如閃電地衝入水中捕魚，身上的水珠和羽毛閃閃發光，畫面超寫實，就像親臨現場的生態觀察。這本書更透過生物放大鏡，帶我們認識潛藏在書中的近二十種動植物"},{"id":"96f6eda604064c669295e439","n":"輕輕的","a":"瀧村有子","d":"丸山綾子","t":"米雅","p":"青林國際","y":["111"],"ag":"0~3","c":"社會情緒、生活自理","cl":false,"lo":false,"isbn":"9789862745595","dt":"110","pr":300,"desc":"透過三歲的小女孩小莉和媽媽之間的互動，教導閱讀此書的孩子在相同的狀況之下，如何做出合適的行為，也從小莉和媽媽溫柔的對話當中，以及繪者柔和霧化的圖畫之下，強烈感受到媽媽和孩子之間愛的流動。"},{"id":"bf6e92e96c1d4aa8aaa64024","n":"躲好了沒？","a":"吉列爾梅・卡斯騰(Guilherme Karsten)","d":"吉列爾梅・卡斯騰(Guilherme Karsten)","t":"艾可","p":"水滴文化(城邦出版)","y":["113","114"],"ag":"0~3","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9786267038079","dt":"110/12","pr":360,"desc":"節奏明快且充滿戲劇張力的故事，讓孩子在驚喜中享受閱讀樂趣。大拉頁設計隱藏豐富細節與意想不到的結局，引導孩子透過翻頁探索，培養觀察力與專注力。幽默敘述搭配鮮明插畫，營造宛如躲貓貓遊戲的趣味體驗，使孩子在尋找動物藏身處的過程中，發展邏輯推理與物體恆存的認知能力。[114]黑色的森林裡，明亮的色塊呈現出動"},{"id":"bmtexj99xzvhlkq2zmspuxwn","n":"最後一匹狼","a":"蜜妮‧葛瑞(Mini Grey)","d":"蜜妮‧葛瑞(Mini Grey)","t":"柯倩華","p":"米奇巴克","y":["114"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789860645132","dt":"110/12","pr":300,"desc":"充滿同理心與幽默感的故事，引導孩子探索森林與野生動物面臨的生態挑戰。小紅從捉狼計畫轉變為環境守護者，啟發孩子關注生物多樣性與棲息地消失的議題。透過動物的經歷，孩子能理解人類活動對自然的影響，進而萌生環保意識與責任感，讓閱讀成為關懷環境與行動改變的起點。[114]"},{"id":"e01cf9cc2e0c4432aadd8f8e","n":"耶誕老公公的紅手套","a":"三浦太郎","d":"三浦太郎","t":"紀富元","p":"小魯文化","y":["112"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9786267043004","dt":"11011","pr":320,"desc":"在一個好冷好冷的耶誕夜裡，小女孩在路上撿到了一隻大大的紅手套。她心想，這應該是耶誕老公公的手套。天氣這麼寒冷，耶誕老公公一定很傷腦筋吧！小女孩要用什麼辦法找到耶誕老公公，把手套送還給他呢？作者以幾何圖形排列組合，營造出積木般的城鎮圖案。仔細觀察圖案，會有意想不到的驚喜。[112]"},{"id":"8de1a12322ab4da2ba163e4f","n":"100顆種子","a":"伊莎貝．明霍斯．馬汀","d":"河野雅拉","t":"歐玲瀞","p":"小魯文化","y":["111"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9786267043318","dt":"110.11","pr":350,"desc":"本書乍看像是科普繪本，也像是算數主題的故事，實際上都是，但又不僅只如此。隨著情節緩緩推進，簡單的情節竟能創造高潮迭起的閱讀體驗，最終再令讀者感受到這是一本奇蹟之書、祝福之書，如同故事中所說：「樹早就知道：如果我們願意耐心等待，事情終究會有好的結果。」"},{"id":"624cc94c763d4ccd98f6cffe","n":"小雞逃跑記","a":"五味太郎","d":"五味太郎","t":"游珮芸","p":"信誼基金","y":["112","113","114"],"ag":"0~3","c":"社會情緒、認知探索","cl":true,"lo":false,"isbn":"9789861616636","dt":"110/11","pr":250,"desc":"盡全力逃跑的主題完全切中孩子的喜好，看三隻小雞活力充沛地跑、跑、跑，經過好多地方，遇見好多人，忽高忽低、搭車走路地跑、跑、跑。這則故事以小小的奇妙遭遇輕巧地道出孩子想要活動、探索與獨立的心思，雞爸爸雞媽媽從頭到尾都把一切看在眼底吧，故事的尾聲讓人會心一笑，愛的臂膀啊，就是這麼深遠、這麼寬闊！[114"},{"id":"acbeae519a8847b48d5076e1","n":"住在黑白洞穴裡的鼴鼠","a":"特瑞莎・賽迪瓦(Tereza Sediva)","d":"特瑞莎・賽迪瓦(Tereza Sediva)","t":"黃筱茵","p":"阿布拉教育文化","y":["113","114"],"ag":"0~3","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9786269500741","dt":"110/11","pr":320,"desc":"這是一本激勵人心勇於追求多彩生命的繪本。根莖葉分別在地面上下的蘿蔔，鼓勵住在黑暗潮濕洞穴裡的鼴鼠，要勇敢的到地面上尋找多彩世界。繪本設計為橫幅上下翻頁，用裝訂軸來區分地面的上下世界。隨著故事的發展，頁面從上空下黑白，逐頁轉變為上多彩、下黑白的構圖，最後為上下皆多彩的頁面，呈現花團錦簇、萬象重生的生氣"},{"id":"b6544c9c81374406bc20f4dd","n":"來跳吧!律動遊戲書","a":"赫威・托雷(Hervé Tullet)","d":"赫威・托雷(Hervé Tullet)","t":"","p":"上誼文化","y":["111","113","114"],"ag":"0~3","c":"身體動作、認知探索","cl":true,"lo":false,"isbn":"9789577627117","dt":"110/10","pr":450,"desc":"運用青、品紅、黃的色料三原色為主、輔以黑色，運用了印刷四分色模式。以線條和圓點描繪出人體的動作，以鏤空四邊形為軀幹的設計，整本可拉開、摺疊，各頁鏤空四邊形交疊出層次感。封面封底兩頁加入錫箔的金屬元素，也能當鏡面映照，以及以兩頁滿版的線條格線和圓點的頁面設計，提供小小讀者多元的閱讀經驗。[114]從封"},{"id":"e1389c5d232e4a8d9cbb12cc","n":"最棒的樹","a":"約翰．杜佛（John Duvall）","d":"茹貝卡‧吉本（Rebecca Gibbon）","t":"黃筱茵","p":"青林國際","y":["112","114"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9789862745588","dt":"110/11","pr":320,"desc":"小男孩艾利克勇敢守護心愛的大雲杉，透過溫柔而堅定的行動，帶領大家以永續方式延續樹木的生命。故事引導孩子尊重自然，理解環境保護的重要性，並培養獨立思考與解決問題的能力。細膩水彩畫營造溫馨氛圍，使閱讀更具感染力，同時鼓勵孩子珍惜並守護大自然的美好。[114]熱愛樹木並以護樹為終身職志的作者，以流暢動人的"},{"id":"45c1f42df9164272ae092d4d","n":"動物園的祕密","a":"黃一文","d":"黃一文","t":"","p":"遠流出版","y":["113","114"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":true,"isbn":"9786267043820","dt":"110-11","pr":320,"desc":"融合推理與探險的奇幻旅程，帶領孩子踏入充滿驚喜與懸疑的世界。透過獨特視角發掘隱藏線索，培養觀察力與推理能力。拼貼與寫意畫風交錯，營造神祕氛圍，上下翻頁設計增添閱讀層次與互動樂趣。孩子在探索未知的過程中，不僅能享受故事的驚喜，更能鍛鍊思考與解謎的能力。[114]孩子喜愛的動物園、童話故事中的大野狼，加"},{"id":"9004eaa5335f478a95b3ac76","n":"123生台灣","a":"陳盈帆","d":"陳盈帆","t":"","p":"聯經出版","y":["112"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789570860405","dt":"11010","pr":280,"desc":"以如歌謠般朗朗上口的詩文，童趣歡快的豐富圖像，帶領讀者體驗臺灣這豐饒之島上，多姿多彩的四季更迭與繽紛熱鬧的節慶人文，品味一整年愜意豐足的臺灣生活。這是一本值得一再讀圖，享受挖掘驚喜的繪本，更是兼容文學與藝術之美的創作，是寫給臺灣的情書、獻給海外遊子的最佳收藏、送給外國友人的最佳禮物。[112]"},{"id":"099c470fed2540a88bfd1915","n":"我的粉蠟筆","a":"許智偉","d":"許智偉","t":"","p":"青林國際","y":["112","113"],"ag":"3~5","c":"社會情緒、生活自理、美感","cl":false,"lo":true,"isbn":"9789862745458","dt":"110-10","pr":300,"desc":"這本無字繪本用分鏡畫面、黑白素描，凸顯彩色粉蠟筆在愛畫畫小男孩心中的重要性。最後他才明白真正的「擁有」不是「有形」的蠟筆，而是在背後默默守護他的阿嬤給予他的支持、愛與陪伴。共讀時，讓孩子閱讀和說說畫面中的事件和情緒變化，感受祖孫的情感，讓小男孩擁有堅強的勇氣。[113]\n這個純粹以圖像述說的無字故事"},{"id":"53187d8337a4472da0687a2f","n":"國王的孩子們","a":"三浦太郎","d":"三浦太郎","t":"邱瓊慧","p":"小魯文化","y":["111"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789865566852","dt":"110.10","pr":350,"desc":"作者運用鮮明的色彩和簡單的形狀，組成多采多姿的畫面，並搭配國王每個孩子各自想要做的事情來介紹各行各業，讓孩子對於職業有初步的認識和想像，書中不斷出現的數字也有助於提升孩子對於數字的概念。"},{"id":"34b16310185a4fcb8be88074","n":"Sassy0~3歲視覺刺激遊戲書：獅子吼吼","a":"La ZOO","d":"La ZOO","t":"何姵儀","p":"采實文化","y":["111"],"ag":"0~3","c":"認知探索、語言溝通","cl":false,"lo":false,"isbn":"9789865074432","dt":"110","pr":280,"desc":"五彩繽紛的小狗、大象、長頸鹿、小猴子顛覆了你對動物造型的想像，也體驗到線條、形狀、色彩組合的千變萬化，書中色彩鮮豔對比的動物畫風，除了刺激嬰幼兒的視覺發展，文字內容搭配動物叫聲，讓幼兒不但能「看」，也能「聽」或模仿動物的叫聲喔！"},{"id":"db0233ddf2dd4c348f42f06c","n":"阿祖，再見","a":"林柏廷","d":"林柏廷","t":"","p":"遠見天下文化(小天下)","y":["112"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789865253257","dt":"11010","pr":330,"desc":"本書用小女孩的視角，描繪參加阿祖喪禮的過程。面對臺灣傳統喪葬習俗與儀式──捻香、摺蓮花、誦經、燒金紙，小女孩的好奇和天真童趣的想像，透過色調柔和繽紛的圖畫，淡化喪禮的哀傷，成為一場溫馨的歡送會，撫慰大人和小孩的心。共讀時，讓孩子參與這場紙上祝福儀式，明白死亡是自然的生命旅程，學習面對失去，好好說再見"},{"id":"a3510d9eccb940d990ad95a2","n":"魔法的秋天","a":"崔麗君","d":"崔麗君","t":"","p":"聯經出版","y":["113"],"ag":"3~5","c":"語言溝通、認知探索、健康與安全","cl":false,"lo":true,"isbn":"9789570860078 ","dt":"110-10","pr":300,"desc":"秋天到底有什麼魔法呢？作者一開始用秋天的天空、涼風和桂花香帶我們走進初秋的世界，接著用飽滿的金黃色，串起一頁又一頁深秋的美景。跟著主角小花旅行，我們體驗到秋天的聲音、色彩、出沒的動物和植物的豐收。建議家長帶著這本書，和孩子走進山林，探訪螽斯、藍鵲、綠繡眼；撿拾楓香、芒花、山歸來等，一起感受臺灣秋天的"},{"id":"ae8ddc57e7d04a6baf732a22","n":"愛說不要的小兔子","a":"瑪佑克．亨瑞克斯(Marjoke Henrichs)","d":"","t":"柯倩華","p":"水滴文化(城邦出版)","y":["112","114"],"ag":"0~3","c":"社會情緒、認知探索、生活自理","cl":false,"lo":false,"isbn":"9786267038055","dt":"110/10","pr":380,"desc":"幼兒常有一段強烈表達自我、「什麼都不要」的時期，繪本裡的小兔子正是如此。不管媽媽提議做什麼，他都不要、不要、不要！不過兔子媽媽充滿智慧，不強迫孩子立刻照做，而是從旁觀察孩子的喜好，默默細心引導孩子靠自己的意志與力量去探索生活中的各種樂趣。小兔子唯一直接贊同的事只有抱抱，媽媽包容無限的愛與溫暖的抱抱啊"},{"id":"17b28d76f80d4692b129e4c8","n":"起床囉！","a":"陶樂蒂","d":"陶樂蒂","t":"","p":"親子天下","y":["113","114"],"ag":"0~3","c":"身體動作、語言溝通、健康與安全","cl":false,"lo":true,"isbn":"9786263050860","dt":"110/10","pr":280,"desc":"甜蜜的起床儀式配上孩子熟悉的生活物件、親密動作與聲音，爸爸媽媽可以一邊陪寶貝讀這本繪本，一邊再次喚醒全新的一天。文字與圖像都讓人心頭暖洋洋，湧現滿滿的愛與情感。右頁的小圖也拋出一連串美妙的視覺線索，起床囉，準備一同享用一頓美味豐盛的早餐囉！[114]啾、啾、啾～小鳥説：起床囉！搔搔寶貝的小腳ㄚ，起床"},{"id":"4ff3746f5c064f2682016522","n":"永遠都不要！","a":"碧翠絲・阿雷馬娜(Beatrice Alemagna)","d":"碧翠絲・阿雷馬娜(Beatrice Alemagna)","t":"郭妙芳","p":"阿布拉教育文化","y":["113","114"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理","cl":false,"lo":false,"isbn":"9786269500734 ","dt":"110/10","pr":360,"desc":"本書以俏皮直觀的眼光，看待孩子的分離焦慮與上學的心情。以小蝙蝠作為故事的主角既增添了情節的變化與趣味，也融入豐富曼妙的生態觀察。這則故事溫柔地鼓勵孩子進行嘗試與探索、放心表達自己的感受，讓他們知道爸爸媽媽也有做不到的事，不過無論如何都會永遠陪在寶貝身旁。[114]蝙蝠小女孩第一天上學，因為可以把縮小"},{"id":"9cd0ce893d2446cdb1b6d03c","n":"亞歷山大和發條鼠","a":"李歐‧李奧尼","d":"李歐‧李奧尼","t":"葉嘉青","p":"步步出版","y":["112","113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789579380959","dt":"110-09","pr":320,"desc":"人人喊打的老鼠亞歷山大非常羨慕備受寵愛的發條鼠，當牠知道可以借助魔法蜥蜴變身時，很努力地想要達成願望。然而，他發現了發條鼠的困境，於是有了不同的願望。這則寓言故事頗具哲思，可以引發親子間的討論，到底是做亞歷山大好呢，還是當發條鼠幸福？[113]\n本書用一隻真老鼠亞歷山大和一隻發條鼠威利之間純真溫暖的"},{"id":"39ca7280378742fbbc7eca41","n":"我的新鄰居","a":"凱思雅．丹尼斯維奇","d":"凱思雅．丹尼斯維奇","t":"潘欣","p":"遠見天下文化(小天下)","y":["111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789865252564","dt":"110.09","pr":320,"desc":"女孩搬到了新家，面對新環境，內心對新鄰居產生出一連串的好奇與想像。作者以黑、白、灰為主色鋪陳故事，巧妙運用色彩變化來反映女孩和外在世界的連結與關係，圖畫中出現許多現實和女孩幻想元素交織的細節，延伸閱讀豐富性，值得親子共讀時一起細細探索。"},{"id":"f66e6a12f07a49b18fad6cd0","n":"一起來做兔子吧","a":"李歐．李奧尼","d":"李歐．李奧尼","t":"葉嘉青","p":"步步出版","y":["111","112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789579380973","dt":"110.09","pr":320,"desc":"本書以簡潔的文字和清新的圖畫風格呈現，讓孩子們可以輕鬆地跟隨故事內容進行手工創作，使用鉛筆和剪刀來製作出自己的兔子。不僅能夠培養孩子的觀察和動手能力，也能激發他們的藝術創意和想像力。此外，家長可以通過聽、說、讀、寫的方式引導孩子閱讀，啟發他們對故事的興趣，培養孩子的閱讀素養。[112]\n本書作者李歐"},{"id":"ea9864cdab694e02b6d11124","n":"世界上最美的聲音","a":"吳欣芷","d":"吳欣芷","t":"","p":"拾光工作室","y":["111","113"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":true,"isbn":"9789869873642","dt":"110-09","pr":360,"desc":"熱愛音樂的小獅子羅伊走遍世界各地，尋找世界上最美的聲音。小狐猴傑米也一直跟在身邊，找找看傑米在做什麼？旅途中有很多有趣的狀聲詞，美好的聲音彷彿繚繞在讀者耳邊～如果要選世界上最美的聲音，你會選什麼呢？會用什麼狀聲詞來形容呢？[113]\n打開這本書，紙頁上充滿聲音，除了來自故事情節、圖畫中的線索，也透過"},{"id":"0fc4a7bdf5f84181b3dda897","n":"哪邊是哪邊","a":"張筱琦","d":"張筱琦","t":"","p":"南一書局(親子時堂)","y":["112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":true,"isbn":"9789865306922","dt":"11009","pr":350,"desc":"三個孩子閉著眼睛，開心地隨著想像力前往不同的方向，張開眼睛大家都到了令人驚嘆的這邊。或許我們也陪孩子搞不清楚哪邊是哪邊地走走逛逛，會有意想不到的美好。書裡摸起來粗粗的那幾頁，有夜光效果，爸爸媽媽記得把那幾頁拿到太陽底下或是燈光下照射吸光。共讀完，把燈關了，和孩子一起找找隱藏的小驚喜。[112]"},{"id":"1cd953dd66f74639b7a64721","n":"狐狸與樹","a":"陳彥伶","d":"陳彥伶","t":"","p":"東方出版","y":["112","113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789863384137","dt":"110-09","pr":300,"desc":"這是一則包含著大自然四季變化、生命週期和友誼的動人故事。故事中的狐狸從幼年、成為母親，到最後死亡，完整地呈現動物的生命週期，而楓樹則以樹葉的變化呼應著春夏秋冬。看似不相關的兩個角色彼此依存，得到陪伴和照護，讀者藉此感受到自然環境與人之間密切的關係。[113]這是一個跨越物種，情感真摯又動人的生命故事"},{"id":"7d44bb4ac9e644aeb4ccfd76","n":"1、2、3，上學去！","a":"瑪麗安．杜布","d":"瑪麗安．杜布","t":"辛兆瑜","p":"遠見天下文化(小天下)","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865251970","dt":"11008","pr":350,"desc":"這本繪本描繪可愛小動物們在各種主題學校上課的故事，豐富有趣的課程，可以啟發小朋友對學習的興趣和熱情。各類的室內場景，讓讀者可以反覆探索，而小動物間的對話，也讓親子共讀時可以創造更多有趣的故事。適合入學前準備的孩童，藉由共讀時引發孩子對學校的好奇心，讓孩子對上學抱持著積極和興奮的態度。[112]"},{"id":"c6a8ca2d3b7d443b9f01c51e","n":"呼嚕呼嚕的書店小貓","a":"吳欣芷","d":"吳欣芷","t":"","p":"典藏藝術家庭(小典藏)","y":["112"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9789579057868","dt":"11008","pr":350,"desc":"喜愛看書和發掘新奇事物的小黑貓，勇敢選擇最愛的書店工作，也把「每次翻開書，總能帶我們到達任何地方和成為各種角色。」的閱讀樂趣，用實際的行動傳遞給更多人。共讀時，引導孩子從圖像豐富的細節中，找到閱讀百態，說出角色的行動與對話，明白遇到困難時，懂得求救，因為家人永遠都在，鼓勵他也能勇敢去冒險，完成夢想。"},{"id":"d1b1c20b29ca4a5d8dcad2e5","n":"綠上加綠","a":"黛安娜・懷特","d":"費希塔・莎拉","t":"游珮芸","p":"米奇巴克","y":["112","113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789860645101","dt":"110-08","pr":320,"desc":"&nbsp;\n文字像輕快旋律的歌，充滿色彩、氣味和聲音，適合為孩子朗讀。圖畫描繪不同季節的綠上加黃、藍、棕和白，一直到新生命誕生的綠上加綠。讓孩子除了觀看自然美景外，還能從圖畫中的另一條故事線，感受家庭愉悅的四季生活與新生命誕生的美好。共讀後，再和孩子一起走進自然，親身體驗。[113]\n春天的綠上加"},{"id":"e6510350a1474afe952ad215","n":"藍色小屋","a":"凱莉．喬丹","d":"潔西卡．寇特妮─堤可","t":"柯倩華","p":"米奇巴克","y":["112"],"ag":"3~5","c":"社會情緒、認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789860645125","dt":"11008","pr":320,"desc":"本書用詩意的文字描寫小女孩和藍色小屋的情誼。因為藍色小屋年復一年的期盼、等待和溫暖的守護，讓女孩一家人，甚至她成為母親之後，一直都能在海灣邊的小屋，享受充滿歡樂和回憶的夏天。共讀時，引導孩子品味文字中描述的色彩、氣味、聲音和動作。在溫暖又細緻的圖畫中，感受小屋對女孩堅定不移的愛和家人間的真摯情感。["},{"id":"97428fe41c06456c95719748","n":"反正都可以到嘛！","a":"張筱琦","d":"張筱琦","t":"","p":"遠流出版","y":["111","112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789573292241","dt":"110.08","pr":350,"desc":"交通工具一向是小男孩的最愛，跟著別緻的貓咪臉公車一路前行，可見到孩子情不自禁的擺動身軀，上下左右，時慢時快，或前進或駐足，感受跟身體同在的一場冒險旅程。充滿節奏感的精煉文字，隨意自在的筆觸，打破陳規的用色，生動的描繪出孩子活在當下的專注美好。[112]\n本書靈感來自作者某次雨天搭錯了公車，轉念一想─"},{"id":"4394ed7d194a433f85b86942","n":"熊與鳥──不受限的故事","a":"金容大 ","d":"金容大","t":"蕭瑋婷","p":"小宇宙文化","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789860641721","dt":"110.08","pr":320,"desc":"作者從具象的鳥籠，透過熊，闡釋捍衛自由的嚴肅主題，然而無字圖畫書包容各種不同的觀點和想像，相信這本不受限的故事，從小讀者出發的觀點，可以發揮故事情節的多元解讀，小讀者依據筆觸細膩的圖畫，拍動著想像力的翅膀說故事，親子間的對談，充滿幽默和趣味，自不在話下。"},{"id":"b5485e4bc132444ea8f30e03","n":"我是黑天鵝","a":"劉清彥","d":"張蓓瑜","t":"","p":"親子天下","y":["111"],"ag":"3~5","c":"社會情緒、身體動作","cl":false,"lo":true,"isbn":"9786263050327","dt":"110.08","pr":320,"desc":"破除性別刻板印象，鼓勵不論男生女生，都能發展自己的興趣，以及展現自己所長，一直以來都是性平社會的教育重點，本書描繪一名喜歡跳芭蕾舞的小男孩故事，讓讀者有機會透過小男孩的苦惱，省思讀者自己的性別刻板印象，後記的舞蹈紀實，更引領讀者重新認識芭蕾舞，破除男生不能跳黑天鵝的印象。"},{"id":"87fbee8098b4466494f110e3","n":"什麼形狀，都行！","a":"娜歐蜜・瓊斯","d":"詹姆斯・瓊斯","t":"游珮芸","p":"水滴文化","y":["113"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789579529914","dt":"110-08","pr":360,"desc":"三角形不能像圓形那樣滾動、不像正方形那樣平穩，也不能像六邊形那樣和朋友連成一片，他總是覺得格格不入，所以他出發去找和自己一樣形狀的朋友。最後發現，其實除了和自己一樣形狀的夥伴可以融合在一起，和自己形狀不一樣的夥伴可以組合出不同的圖案，玩出更多的樂趣！家長藉由「三角形」尋找能融入群體的過程，帶著孩子發"},{"id":"f6264931e63a45bea8426426","n":"從無到有工程大剖析：大樓","a":"鹿島建設株式會社","d":"田島直人","t":"李彥樺","p":"小熊出版","y":["112"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789865593483","dt":"11007","pr":350,"desc":"這系列繪本以繪圖來介紹「巨大建設」（道路、大樓、隧道和橋樑）的建造過程。本書用直式大跨頁圖，展現大樓的高度感。詳細記錄大樓建造的工法和細節，各種巨型機具的使用，不僅激發孩子的探索樂趣，也體會從無到有的工程奧秘。共讀後，再帶孩子去看臺北101大樓或世界知名大樓，感受特殊建築工法，培養探索科學的興趣。["},{"id":"391f354d975f49e5a68fc05e","n":"熱天的時陣──嚕嚕的夏天","a":"儲玉玲","d":"儲嘉慧","t":"","p":"聯經出版","y":["111","112"],"ag":"3~5","c":"語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789570858600","dt":"110.07","pr":300,"desc":"這是一本用閩南語和華語朗讀，都能感受圖文合奏絕佳的繪本。文字念起來有詩的韻味，搭配色調單純、畫面清爽的版畫，喚起夏日在雨天中玩耍的童年記憶。共讀時，可以先聽閩南語的朗讀版，讓孩子體會呲嗤呲、澹漉漉、霎霎仔雨&hellip;&hellip;這種豐富又美麗的聲調。也可在下雨過後，帶孩子到戶外搖搖小樹、大"},{"id":"fffc254f16264ae6b1ce6ad8","n":"爸爸的小貨車","a":"Mori 三木森","d":"Mori 三木森","t":"","p":"拾光工作室","y":["111","112","113"],"ag":"3~5","c":"社會情緒、認知探索","cl":true,"lo":false,"isbn":"9789869873635","dt":"110-07","pr":320,"desc":"&nbsp;\n小女孩坐上爸爸的藍色小貨車，跟著哼唱爸爸喜歡的歌。經過城市、高山，遇到烏雲暴雨、高山懸崖，經歷驚險意外，她也不害怕，因為爸爸永遠陪在她身邊，她相信小貨車會送她到安全的地方。共讀時，朗讀感情細膩的文字，讓孩子欣賞車中玩偶幻化成充滿想像力的圖畫，感受親情陪伴的力量。[113]\n噠啦答～噠啦"},{"id":"ommbduoau7dt80jwz1ep1t1z","n":"森林100層樓的家","a":"岩井俊雄","d":"岩井俊雄","t":"林佩勳","p":"小魯文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789865566555","dt":"110/07","pr":350,"desc":"走進森林100層樓的家，每個孩子可以得到不同的禮物：有人學數數、有人認識了習性大不同的動物好朋友，也有人睜大眼睛，快樂地欣賞不同動物的家有什麼不同的奇妙設計……。本書結合作者對自然生態豐富的調查與理解，和令人歎為觀止的想像力與創意，贏得孩子們與大人一致的喜愛。畫面細膩，充滿看不盡的細節與趣味，每次翻"},{"id":"bkyapm33sez3g4u7gglc3dej","n":"春天佇佗位","a":"黃靜雅","d":"鹿雅","t":"","p":"玉山社","y":["114"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9789862942727","dt":"110/07","pr":420,"desc":"春天佇佗位？阿雅佮阿馳想欲去問花蕊。親子共讀時，試著將歌謠的拍子融入閱讀節奏裡，跟著兩位小主角做伙去揣春天！這本繪本也很適合邊走邊讀，牽著孩子的小手哼唱著「春天佇佗位？」，問問路邊、公園裡的花草樹木、貓狗魚鳥，佇咱的身軀邊……尋找神祕的「春天」。[114]"},{"id":"5d21ea793d874cce98278081","n":"夏夜","a":"楊喚","d":"黃本蕊","t":"","p":"愛米粒","y":["111"],"ag":"3~5","c":"語言溝通、美感","cl":false,"lo":true,"isbn":"9789869991773","dt":"110.06","pr":320,"desc":"這是一本臺灣難得的童詩繪本，童詩的音韻和圖畫的節奏，融為一體，親子齊聲朗讀，隨著詩意的音韻，進入這美不勝收的夏夜，真是一場不可錯過的宴饗！圖畫引領小讀者體會詩的意境，享受童詩朗讀後，不妨讓孩子說說自己對於詩句的想像以及感受，詩意的童言童語常會令父母眼睛為之一亮。"},{"id":"01f82b9745d34f0da15c778b","n":"夏天的滋味","a":"千美眞","d":"申珍岵","t":"簡郁璇","p":"遠流出版","y":["111","112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789573290124","dt":"110.06","pr":360,"desc":"跟著夏日美好躍然紙上的如詩圖畫，帶領讀者奔向自然，在廣陌的天地之間遊走。盡現眼底的繽紛色彩、不絕於耳的蟲鳴鳥叫、清涼的雨水、香甜的水果，不但協奏出生氣篷勃的交響樂，更堆疊出層次豐富的怡人滋味。而心愛家人的陪伴，更讓夏天的滋味凝結成幸福的滋味。[112]\n這本美麗、繽紛的繪本，每一頁展開都像是一幅療癒"},{"id":"7b015a3532204a4e8873dfb1","n":"神奇行李箱","a":"克里斯．內勒–巴列斯特羅斯","d":"克里斯．內勒–巴列斯特羅斯","t":"柯倩華","p":"遠見天下文化(小天下)","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789865251635","dt":"110.06","pr":350,"desc":"如何溫柔待人、接納包容異己，以及如何誠摯為自己對他人造成的傷害致上歉意，此書都做了極好的示範。即使如此，卻不是用教條式的規勸，而是透過故事中幾個角色的對話、反思，帶著小讀者一起思考、理解。另外，此書也不刻意加入時事或沉重的情節，只是還原人與人之間的善意交流，亦是相當可貴之處。"},{"id":"613a31754085426193ca2b0f","n":"不一樣的1","a":"吳亞男","d":"柳壟沙","t":"","p":"信誼基金","y":["111","112","113"],"ag":"3~5","c":"語言溝通","cl":true,"lo":false,"isbn":"9789861616551","dt":"110-06","pr":280,"desc":"&nbsp;\n一群特質不同的動物學生學習寫數字1，每一位寫出的1都不同，棕熊老師卻都能欣賞，讓每位學生得到衷心的讚美。故事雖簡單，卻能讓讀者期待情節的發展，他們不僅從動物角色中看到自己的身影，進而得到鼓勵，也能在圖畫中讀到許多文字沒有提到的細節。[113]\n棕熊老師教小動物們寫數字1，小動物們寫出各"},{"id":"2fbc8b32381f4545a2f8ced3","n":"好想好想見到你","a":"宮西達也","d":"宮西達也","t":"林真美","p":"維京國際","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789864403899","dt":"110-06","pr":300,"desc":"孩子如何交朋友、建立良好人際關係，對他們非常重要。本書講述物種和體型差距極大，卻同樣形單影隻的大野狼和毛毛蟲成為朋友的過程，讓孩子理解如何結交摯友。主動邀請、分享彼此的獨特和一起活動，最重要的是真誠的心和彼此信任，不管環境或形體如何改變，想和好朋友在一起的心永不改變。[113]"},{"id":"wxv6qc990els2dt4he8kny93","n":"怎麼說對不起","a":"大衛‧拉羅謝(David LaRochelle)","d":"麥克‧沃那卡(Mike Wohnoutka)","t":"上誼編輯部","p":"上誼文化","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789577627001","dt":"110/06","pr":300,"desc":"做錯事該怎麼道歉？有些人道了歉反而讓人更生氣，那到底該怎麼辦呢？作者用幽默且貼近日常生活的動物故事，帶領孩子學習不同場合該如何真心道歉，幫助孩子理解「對不起」的真正意義，誠懇地道歉才能讓自己和對方都感覺更好。共讀時，和孩子討論怎樣才能「道歉得恰到好處」，學會尊重他人與修復關係，並在生活中運用這項重要"},{"id":"32171396c2254f4f8f9a6927","n":"翠翠掉下去了！","a":"科瑞．R‧塔博","d":"科瑞．R‧塔博","t":"柯倩華","p":"三民書局","y":["111","112","114"],"ag":"3~5","c":"認知探索、社會情緒","cl":true,"lo":false,"isbn":"9789571471983","dt":"110/06","pr":350,"desc":"獨特的上下翻頁設計，使孩子彷彿與翠翠一同墜落，增強沉浸感與互動性。故事以幽默與想像力呈現高度變化與掉落的動態，提升孩子的空間認知。插畫生動活潑，情節充滿趣味，引導孩子勇敢面對未知，並在探索中尋找自我與建立友誼。這場跌宕起伏的冒險能激發孩子的好奇心與同理心。[114]本書情節緊湊，充滿童趣，加上獨特互"},{"id":"a655ce25f90241cab4700348","n":"沒有字的明信片","a":"向田邦子、角田光代","d":"西加奈子","t":"林真美","p":"小麥田出版","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789578544758","dt":"11005","pr":360,"desc":"本書以充滿文學性的筆法、質樸的蠟筆畫，描繪了日本二戰時期稚齡孩童被迫遠離家人，疏散至鄉間的真實故事。作者細膩描繪了情感轉折，成人深切的憂慮、孩童艱困的處境無不令人心生悲憫。我們彷彿跨越了時空限制，切身感受了戰爭的殘酷沈重，並動容於家人間真摯濃烈的愛。[112]"},{"id":"64c23d601d67483a87b723fb","n":"世界喜歡這樣的你","a":"喬安娜．蓋恩斯","d":"朱利安娜．史旺尼","t":"陳采瑛","p":"遠流出版","y":["111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789573290728","dt":"110.05","pr":350,"desc":"從製作熱氣球開始述說每個人都有不同的想法、不同的做事方式、不同的風格，藉此讓孩子知道自己的獨特性，並學會尊重別人的不一樣，了解到每個人都是世界上獨一無二的，而世界就是喜歡這樣特別的每一個人。"},{"id":"934160d897094c0da6ac2810","n":"我的完美願望","a":"麗莎．曼徹芙","d":"潔西卡．寇特妮-堤可","t":"游佩芸","p":"米奇巴克","y":["111"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789866215995","dt":"110.05","pr":320,"desc":"在一個過度物質化的世代，孩子們很容易陷入無法滿足的漩渦，這本繪本巧妙地從許願的主題，刻畫小女孩精神上的知足與幸福。當你只有一個願望的時候，你要許什麼願呢？親子共讀環繞在小女孩的這個思考議題上，是價值澄清的好話題，也能夠讓孩子好好想一想，刻畫出自己滿滿的幸福感！"},{"id":"84205b2e5856401cbcdea2b0","n":"毛衣勾到了！","a":"趙小傑","d":"森酪梨","t":"","p":"康軒文教","y":["111"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789865357078","dt":"110","pr":280,"desc":"小孩穿上漂亮的紅毛衣出門散步，卻渾然不知毛衣被勾到了，他穿過馬路、經過公園、跨過水塘、穿過樹林&hellip;&hellip;，直到通過果園時才赫然發現身上的毛衣變短了，接下來又該怎麼辦呢？脫落的毛線所建構的軌跡看似小孩的行動路線，卻也像在反映孩子與環境及動物的關係，是一本可以細細品味圖畫的好書。"},{"id":"c7ecd8a8562044ac918fa9e5","n":"我們的星期六","a":"歐葛．摩拉(Oge Mora)","d":"歐葛．摩拉(Oge Mora)","t":"宋珮","p":"遠見天下文化(小天下)","y":["111","112","114"],"ag":"3~5","c":"社會情緒、美感","cl":true,"lo":false,"isbn":"9789865251284","dt":"110/05","pr":350,"desc":"《我們的星期六》以色彩和諧、姿態生動多樣的拼貼，述說一對親子美好的星期六。雖然幾乎所有的一切都與原本的計畫不同，他們還是手牽手編織出專屬於彼此的珍貴記憶。故事細數日常生活種種有趣體驗，在平實的敘述間，讚揚了真誠過日子、相互珍惜的情誼與意義，可以帶領孩子進行多元化的討論，也可以延伸更多思考與創作活動。"},{"id":"8dcce67aebe24963ad3e6d24","n":"我的花卉寶寶","a":"陳麗雅","d":"陳麗雅","t":"","p":"小魯文化","y":["112","113","114"],"ag":"0~3","c":"社會情緒、認知探索、美感","cl":true,"lo":true,"isbn":"9789865566180","dt":"110/05","pr":300,"desc":"這本書為幼兒打造了一場色彩繽紛的自然探索之旅。透過繪本中鮮豔的花卉與可愛的小昆蟲插圖，搭配互動問答與拉頁遊戲，讓孩子動手動腦，在遊戲中喚醒孩子的好奇心。我們可以和孩子一起觀察種子的模樣、葉片的形狀、花瓣的顏色，還有不同花卉適應的生長環境，讓孩子在玩樂中學會細心觀察大自然的奧祕。共讀之後，別忘了牽起孩"},{"id":"7c4e06563f8d412c9fcbf806","n":"是誰在跳呢？","a":"李政霖","d":"李政霖","t":"","p":"維京國際","y":["112","113"],"ag":"3~5","c":"身體動作、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789864403479","dt":"110-04","pr":399,"desc":"這本操作書，選擇孩子熟悉的動作「跳」，利用動畫格放的原理，透過動手操作，展現五種昆蟲和動物「跳躍」的姿態。這樣的閱讀互動，不僅激發孩子探索自然的好奇心，更提高孩子手眼協調和操作能力。共讀後，利用書末的知識頁引導孩子了解和主動探索更多其他昆蟲或動物跳躍的秘密。[113]\n&nbsp;\n本書兼具教育性和"},{"id":"81d75e6713c64a9185ea9190","n":"大家一起玩泥巴","a":"張秀毓","d":"張秀毓","t":"","p":"小魯文化","y":["111"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789865566067","dt":"110.04","pr":320,"desc":"此本以玩泥巴為主題的寫實繪本，跨越了幼兒對於玩泥巴的想像，帶領幼兒進入鄉土手藝工坊的寫實場景，引發小讀者對傳統陶藝的興趣，父母不妨考慮帶著孩子去體驗玩泥巴、做陶的樂趣，另外，書中有許多步驟說明，也可培養幼兒對於工作執行過程的覺察能力。"},{"id":"d957c0ebc93048e79253b3bc","n":"我要","a":"粘忘凡","d":"Mori 三木森","t":"","p":"青林國際","y":["111"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789862745380","dt":"110","pr":300,"desc":"書中不斷出現「我要」，簡單的兩個字先讓孩子產生共鳴，作者隨即運用圖畫跟文字告訴孩子可以自己動手，獲得一切想要的東西，更重要的是，爸爸和媽媽也會陪著孩子一起。這本書不僅可以拉近孩子與爸媽的關係，也讓孩子的需求被滿足的同時，更懂得先付出自己。"},{"id":"7dd24e37eb9e41189de64196","n":"沒有名字的貓","a":"竹下文子","d":"町田尚子","t":"黃惠綺","p":"東方出版","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789863383857","dt":"110-04","pr":320,"desc":"一隻流浪貓遊走在街市間，睜著綠色的大眼睛，羨慕地看著每個店家養的貓，一一叫出牠們的名字，而牠自己沒有名字。作者採第一人稱觀點，用簡短的文字表達出流浪貓的心情，而繪者不僅生動地畫出貓的眼神、表情和姿態，更讓讀者跟隨流浪貓逛了一圈，直到遇見為牠取名字的人。[113]"},{"id":"b1cbdb75e4e5454583ab65ee","n":"企鵝演奏會","a":"陳彥伶","d":"陳彥伶","t":"","p":"信誼基金","y":["111","112","113"],"ag":"3~5","c":"社會情緒、語言溝通","cl":true,"lo":false,"isbn":"9789861616360","dt":"110-04","pr":320,"desc":"這是一則企鵝和保育員之間的故事，文字描述保育員無法成功與企鵝拉近距離，直到發現口風琴可以幫他解決難題。口風琴的黑白琴鍵和企鵝身上的黑白兩色互相呼應，幫助孩子領悟故事轉折的關鍵，藍白交織的場景使他們感受到寒冷，而紅色不僅是保育員衣服的顏色，也是友誼的溫度。[113]\n這是一個企鵝與保育員的友誼故事。傳"},{"id":"397fbba184cd45cc8d51c661","n":"校外教學到月球","a":"約翰．海爾","d":"約翰．海爾","t":"小麥田出版","p":"小麥田出版","y":["112","113"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9789578544512","dt":"110-03","pr":360,"desc":"故事從封面開始，孩子們搭上亮黃色太空校車，航行在萬籟俱寂的浩瀚星空中，直到降落月球。月球的重力小，小孩彈躍就可以輕鬆越過溝谷。迷路的小男孩，用色彩和月球人成為朋友。不需要文字，大小朋友都能心領神會融入故事情節，編寫自己的劇本，設計與月球人的對話。[113]\n&nbsp;\n這本紀念阿波羅11號登月五十"},{"id":"ffe822649d914a61ba058c36","n":"地球寶寶晚安","a":"幾米","d":"幾米","t":"","p":"遠見天下文化(小天下)","y":["111"],"ag":"0~3","c":"社會情緒、語言溝通、美感","cl":false,"lo":true,"isbn":"9789865250508","dt":"110.03","pr":380,"desc":"地球寶寶明明玩了一天，已經很累很睏了，卻又睡不著，於是開始哇哇大哭，誰聽得到他的哭聲呢？知名本土繪本作家幾米以美感優雅的畫風呈現夜空之美，讓孩子對黑暗不會感到害怕，也延伸幼兒豐富的想像力，讓身旁的布偶娃娃、窗邊的月亮，都變成孩子最親密的陪伴者，慢慢進入夢鄉，在床邊哄孩子睡覺的您，千萬不能錯過喔！"},{"id":"ec92cfead5e34570a10658a4","n":"小寶寶快來了","a":"莉比．葛利森(Libby Gleeson)","d":"潔妲．羅巴德(Jedda Robaard)","t":"柯倩華","p":"水滴文化(城邦出版)","y":["112","114"],"ag":"0~3","c":"社會情緒、語言溝通、生活自理","cl":false,"lo":false,"isbn":"9789579529778","dt":"110/04","pr":360,"desc":"小老鼠姐姐和媽媽一起洗小衣服、漆嬰兒床、收拾玩具，一起等「我們的小寶寶出生」。重複的文字，有旋律、有節奏地呈現姐姐殷切的期盼。溫馨的畫面，洋溢著滿滿的幸福。「快了、快了」，「然後，然後，然後……」當小寶寶終於出生，小老鼠欣喜若狂，陪伴照顧著小寶寶。誠摯推薦給所有即將迎接二寶、三寶的家庭。[114]用"},{"id":"db3ddc48adc743eab78309f4","n":"安野光雅的數數看","a":"安野光雅","d":"安野光雅","t":"","p":"遠見天下文化(小天下)","y":["113","114"],"ag":"0~3","c":"語言溝通、認知探索、美感","cl":false,"lo":false,"isbn":"9789865250737","dt":"110/03","pr":350,"desc":"這是一本充滿驚喜與想像的數數書！從一片荒蕪雪地的「0」，到春天草地的「3」朵花，秋天田園的「9」匹馬，將數學與自然美學巧妙融合。父母可以陪伴孩子欣賞田園風光，並發現藏在畫中的樹、房子、汽車、人以及動物。小鎮上的人們在忙些什麼呢？四季變化時，房子和大樹有何不同呢？享受數數樂趣之外，還能發揮創意，為畫面"},{"id":"rqrsegmnzvpmkypo5dupbvab","n":"拍花籮","a":"潘人木","d":"曹俊彥","t":"","p":"信誼基金","y":["114"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789861616377","dt":"110/03","pr":200,"desc":"拍呀，拍呀，你拍幾？我拍一呀，一隻蝸牛，上樓梯呀！……我拍二呀，二隻螞蟻，抬著大花瓣呀！……我拍十呀！十隻青蛙跳進荷花池呀！唸謠唱數一二三四五，拍掌互擊六七八九十，唸謠數數、對應點數圖裡的動物有多少。這是一本培養孩子享受語文節奏與韻律的唸謠繪本。[114]"},{"id":"44ed255c81e04facbbd07778","n":"鱷魚的不行不行小黃瓜","a":"隅倉智子（すみくらともこ）","d":"隅倉智子（すみくらともこ）","t":"米雅","p":"拾光工作室","y":["113","114"],"ag":"3~5","c":"社會情緒、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789869873628 ","dt":"110/03","pr":280,"desc":"作者隅倉智子以生動的插畫和幽默的故事，描繪鱷魚面對誘惑時的內心掙扎。因為鄰居小豬種的黃瓜藤越過籬笆，蔓延到鱷魚的院子裡，鱷魚覺得有些困擾，但當他發現藤上結滿小黃瓜時，鱷魚又面臨能不能採來吃的困難抉擇。共讀時，可以問問孩子：如果我們是鱷魚，會怎麼做呢？透過討論不同選擇與結果，孩子能在歡樂的閱讀中，學習"},{"id":"67df0f2ab2af4d548382a604","n":"我們班的新同學 斑傑明‧馬利","a":"賴馬","d":"賴馬","t":"","p":"親子天下","y":["112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789575037581","dt":"11002","pr":380,"desc":"這本書用孩子熟悉的校園故事和直觀的畫面，讓他們以開放的心，去理解轉學到小馬學校的非洲斑馬，雖然外表不同，但是大家一起相處，仔細觀察之後發現，原來斑傑明和大家都一樣。不僅讓孩子接納別人的不同，也愛上自己的獨特。共讀時，讓孩子尋找圖像中隱藏的豐富細節，也可聽中英故事，唱「小馬歌」，體驗多元閱讀的樂趣。["},{"id":"e1010c69ab6147118517addd","n":"數字比一比","a":"西內久典","d":"安野光雅","t":"唐亞明","p":"步步出版","y":["112","113"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789579380652","dt":"110-02","pr":320,"desc":"&nbsp;\n這是本「數數書」，用最直覺的圖像語言來學習數字的概念。小手伸出來，無花果葉子的形狀和手指的數字相同，都是5。共讀時，可以運用生活中的事物，讓小蝸牛從小手慢慢爬出去連連看，各式各樣的數字比一比，誰比較多？誰比較少？幫助孩子用「感官」來認識周遭事物，增強孩子的觀察力。[113]\n&nbsp"},{"id":"3fd0efd91dfa44ba83be9525","n":"那些消失的事","a":"碧翠絲‧阿雷馬娜","d":"碧翠絲‧阿雷馬娜","t":"王卉文","p":"阿布拉教育文化","y":["112"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":false,"isbn":"9789865876999","dt":"11001","pr":399,"desc":"生活中，有很多事物會消失，他們會轉換形式，來了又走。阿雷馬娜特別運用「描圖紙左右翻頁」的設計，帶領讀者體會事物的「存在」與「消逝」。阿雷馬娜溫暖地提醒著，所有的一切，到了最後，都會過去、改變或離開，只有一件事始終都在，永遠不會消失。永遠都不會。[112]"},{"id":"50320d7e13194005851d419f","n":"一百萬個親親","a":"諶淑婷","d":"詹廸薾","t":"","p":"巴巴文化","y":["112"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789869880374","dt":"11001","pr":350,"desc":"對父母來說，親職教養不該只有責任與壓力，更該用心享受愛的真摯美好。本書以輕盈的水彩，柔和的用色描繪了父母對孩子的愛，在一個又一個平凡的日子裡，透過一個又一個的親吻堆疊、發酵，產生力量。每次的共讀，都能讓親子間的愛在當下交流，感動彼此。[112]"},{"id":"648cfe43bb1945178b12ce10","n":"比利，你在哪裡？","a":"米雅","d":"米雅","t":"","p":"三民書局","y":["112"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789571469874","dt":"11001","pr":250,"desc":"每個小小孩都曾經是比利，總是努力以自己僅有的小小身軀，專注一致的在大人始料未及的各種空間裡探索，用自己的身體丈量世界，以動物敏銳的五感來認識世界。好的兒童文學不僅讓孩子在書裡遇見自己，更透過親子共讀，讓父母看見孩子的本真樣貌，認識兒童之內在本質與想像。[112]"},{"id":"47a3cf29e3ef43cb8d0a9136","n":"阿啾在哪裡？","a":"廖書荻","d":"廖書荻","t":"","p":"玉山社","y":["111"],"ag":"0~3","c":"社會情緒","cl":false,"lo":true,"isbn":"9789862942659","dt":"110.01","pr":350,"desc":"阿晴對周遭環境的事物充滿好奇，她和天外飛來的小鳥阿啾很快地成為好朋友，他們一起玩、一起跳，還一起睡午覺，直到某個早上，阿晴發現阿啾不見了&hellip;&hellip;。阿晴認識阿啾的過程展現孩子對生命的熱情和友誼的渴望，然而阿啾不見後，單純的阿晴卻渾然不知原因，故事中有懸疑，也有生命的無常，值得親"},{"id":"8e5424d0009d4fe1b2482cdf","n":"比利生病了","a":"米雅","d":"米雅","t":"","p":"三民書局","y":["111"],"ag":"0~3","c":"語言溝通、健康與安全、生活自理","cl":false,"lo":true,"isbn":"9789571469898","dt":"110.01","pr":250,"desc":"比利感冒了，他說吃冰淇淋跟甜甜的糖果、玩遊戲會把感冒趕走，結果卻變得更嚴重，所以他決定要去看醫生，那麼醫生會怎麼說呢 ﹖書中的大人以溫柔的建議代替權威的指令，讓比利自己發現他的想法行不通，所以醫生什麼都不必說，比利就決定要喝溫水、按時吃藥、多休息，他可是比醫生更像醫生呢！"},{"id":"703de9cc90af4fea912e3bc3","n":"不要叫我小不點！","a":"瑪雅邁爾斯","d":"任惠元","t":"王欣榆","p":"格林文化","y":["112"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理","cl":false,"lo":false,"isbn":"9789865576349","dt":"11001","pr":320,"desc":"她的個子很小，名字也很小，叫點點。當高大的壞男孩欺負新轉來的弱小同學時，點點採取的行動卻很強大。插圖細膩地捕捉點點每分每秒的細微情緒變化，可以聽到點點的吼叫、從鼻子呼出的怒氣。清新文字搭配呈現多元與包容的圖畫，展現勇氣與真正的「偉大」！[112]"},{"id":"sqkrw57z2vc5g7urwaiugsa9","n":"人體透視書","a":"Nosy Crow","d":"漢娜．艾莉絲(Hannah Alice)","t":"鍾慧元","p":"三民書局","y":["114"],"ag":"3~5","c":"認知探索、健康與安全、美感","cl":false,"lo":false,"isbn":"9789571468976","dt":"110/01","pr":399,"desc":"封面圖像的一半透視的人體設計吸引你了嗎？看不見的人體內部器官構造，用透明塑膠片設計呈現，一覽無遺。各頁面疊加上去的透視效果，隨著一頁頁翻閱，可看得到從身體的外像到內部器官：從皮膚、肌肉、骨頭、呼吸、血液、 胃腸、腦、神經、脊髓、到臉部，是一趟探尋身體內外結構和器官運作系統的閱讀之旅。[114]"},{"id":"v825i2tvgq0ecs2u2xp9oy0f","n":"小烏龜楚門","a":"珍．瑞迪(Jean Reidy)","d":"露西．魯絲．庫敏士(Lucy Ruth Cummins)","t":"張淑瓊","p":"道聲出版","y":["114"],"ag":"3~5","c":"認知探索、生活自理","cl":false,"lo":false,"isbn":"9789864003204","dt":"110/01","pr":300,"desc":"溫暖動人的故事，描繪小烏龜楚門在主人莎拉離開後，鼓起勇氣踏上尋找她的旅程。從楚門的視角，孩子能感受探索新世界的興奮與挑戰，細膩的插圖巧妙呈現角色情感與冒險歷程。這趟旅程不僅傳遞勇氣、友情與愛，也鼓勵孩子勇敢面對未知，學習適應變化，並在成長中培養獨立與堅定的心。[114]"},{"id":"5047c4d21dac4cd79746a28a","n":"地圖喵：啟蒙孩子的圖像思維","a":"喬伊絲．海索柏斯(Joyce Hesselberth)","d":"喬伊絲．海索柏斯(Joyce Hesselberth)","t":"高尼可","p":"親子天下","y":["111","114"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789575037079","dt":"110/01","pr":350,"desc":"以貓在夜晚的街道探尋旅程，引領讀者認識生活中的各種圖示，例如：地圖、地圖上的方位記號、比例尺；動物身體構造剖面圖、街道圖、植物構造圖、地面上下剖面圖、水分子示意圖、地球儀、星座圖、建築施工圖。一本讓孩子認識生活中各種圖示的圖解繪本。[114]本書主角是隻獨立又聰明的貓，作者將家中的橘貓，化身為小鎮鎮"},{"id":"d52ae3426c6e4a22a7559e89","n":"喀噠喀噠喀噠（新版）","a":"林小杯","d":"林小杯","t":"","p":"步步出版","y":["111","112"],"ag":"3~5","c":"語言溝通、認知探索、社會情緒","cl":false,"lo":true,"isbn":"9789579380744","dt":"109.12","pr":450,"desc":"喀噠喀噠喀噠，是阿媽的大玩具發出來的聲音。喀噠喀噠喀噠，是一本朗讀的繪本，阿公阿媽，大聲地讀給孩子聽、讀給孫子聽、讀給自己聽，翻新美好的回憶。翻開裝幀精美的《臺文別冊》，閩南語共讀，嘛也通。對臺羅文字不是很熟悉，趕快掃QRCode，跟著呂美親老師朗讀，把閩南語舌頭練回來！[112]\n本書描述阿嬤用自"},{"id":"bd836fd6722245e799db4889","n":"大家來玩躲貓貓","a":"王春子","d":"王春子","t":"","p":"遠流出版","y":["111","112"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789573289111","dt":"109.12","pr":320,"desc":"戰爭帶來的不幸該如何向孩子訴說？親赴約旦難民社區的作者，以全世界孩子都愛的遊戲「躲貓貓」概念、如詩的文字與鮮明的視覺元素，描繪了戰地庶民日常、民族記憶裡失去的種種美好，都如躲貓貓般躲進了食物、歌謠、花布裡活在人們心中，在艱難困境中為人們散發愛與希望的微光。[112]\n異國風格的刻畫下，呈現小朋友都愛"},{"id":"85c6ae2c3ee941adb72a9327","n":"道路","a":"五味太郎","d":"五味太郎","t":"高明美","p":"步步出版","y":["111"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789579380645","dt":"109.12","pr":320,"desc":"日本童書大師五味太郎伴隨一代又一代的孩子成長，其作品天真而富有哲思，簡明卻實有深度。本書是五味太郎的第一本繪本，近半世紀再於台灣復刻出版，絲毫沒有陳舊的氣息，在流暢俐落的圖文敘事中，呈現出「道路」的無限可能性，從現實蔓延到想像，饒富趣味。"},{"id":"2ee783237e3b47048bbc4e8e","n":"猜猜我有多愛你：你想和我做朋友嗎？","a":"山姆．麥克布雷尼","d":"安妮塔．婕朗","t":"","p":"上誼文化","y":["111"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789577626929","dt":"109.12","pr":300,"desc":"猜猜我有多愛你的續集問世了！小兔子長大了，遇見了一位新朋友，一起追逐、一起挖洞、一起堆樹葉，還有可以把新朋友介紹給爸爸媽媽看一下。友誼是一件多麼美好的事！ 繪本中有柔美的色調，完美描繪出兩隻小兔子間的親密情感。"},{"id":"fe483eee25404f7db652595a","n":"小噗，晚安","a":"珊卓．波伊頓","d":"珊卓．波伊頓","t":"李紫蓉","p":"","y":["110"],"ag":"0~3","c":"生活自理","cl":false,"lo":false,"isbn":"9789577626813","dt":"109-12","pr":"","desc":"哄孩子入睡是親子間熟悉的日常狀況，書中不論是鮮豔的色彩、可愛的角色造型、簡單又幽默的故事，乃至於小巧的書籍開本，都很適合幼兒的身心。共讀時不妨拿書中情景與現實生活對照一番，更添閱讀樂趣。本書為系列作品，同系列作品亦值得一看。"},{"id":"6222aa0f0fb345eabb67e54c","n":"媽咪在哪裡？","a":"貝芙莉‧唐諾費歐","d":"芭芭拉‧麥克林托克","t":"陳慶祐","p":"","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789579529716","dt":"109-11","pr":"","desc":"小女孩與小小老鼠是好朋友，但是不敢讓其他人知道。透過雙主軸交織的故事，小女孩在睡覺前找媽媽，小小老鼠也在找媽媽，在彼此生活互動中，最後發現一個大秘密。這本溫馨的圖畫書描述人和動物間的深厚友誼，在親子共讀的時候，除了有趣的故事之外，還多了欣賞圖畫的樂趣。"},{"id":"e53aa623ebc541158db55d51","n":"蒙特梭利寶寶啟蒙繪本：跟我來!","a":"琪亞拉・皮羅迪","d":"安涅絲・巴魯吉","t":"","p":"大石國際","y":["113"],"ag":"0~3","c":"身體動作、認知探索","cl":false,"lo":false,"isbn":"9789869956321","dt":"109-11","pr":260,"desc":"專為0-1歲孩子設計的三色學習書。這個階段的孩子，手指小肌肉開始發展，會想試著翻書，書頁自動展開的硬紙書，可以幫助孩子成功翻頁，累積美好經驗。帶有紅色細節的主題插畫，能吸引幼兒的注意力，黑白對比明顯的曲折凸起路線能同時刺激觸覺和視覺。和孩子一起，用手指順著印有凸起的觸摸路線，從起點的圖走到終點的圖，"},{"id":"ab6768cf9e1f4cb89cefb0d9","n":"在圓木橋上搖晃（新版）","a":"木村裕一","d":"秦好史郎","t":"林真美","p":"維京國際","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789864403516","dt":"109-11","pr":280,"desc":"作者在有限的篇幅內，把化敵為友的故事說得極為精采，讀者能充分感受故事的張力。豎直的畫面、自由奔放的筆觸、渲染的水彩和拼貼造型被用來呈現湍急的河水、兩旁的山石、危危顫顫的圓木橋，以及故事主角-狐狸和兔子。畫面充滿動感，以大自然懾人的場景襯托兩個角色的遭遇。[113]"},{"id":"85d285c2971d4453843e88da","n":"等啊等，在排什麼隊呀？","a":"高畠那生","d":"高畠那生","t":"黃惠綺","p":"親子天下","y":["111"],"ag":"3~5","c":"社會情緒、健康與安全","cl":false,"lo":false,"isbn":"9789575036720","dt":"109.10","pr":300,"desc":"排隊是生活中常見的場景、必要的社會行為，也是幼兒在遊戲中喜歡的劇情。本書從頭到尾都在排隊，一再吊人胃口、加深好奇，吸引孩子不斷看下去，最後看似沒有明顯的結局，卻也向孩子開放了思考的空間。此外，本書繪圖暗藏許多幽默的細節，為簡單的文字情節增添許多可看性。"},{"id":"9aca4e0760954a8694d20084","n":"我說話像河流","a":"喬丹．史考特","d":"席尼．史密斯","t":"劉清彥","p":"拾光工作室","y":["111","112","113"],"ag":"3~5","c":"社會情緒、語言溝通","cl":true,"lo":false,"isbn":"9789869873611","dt":"109-10","pr":380,"desc":"&nbsp;\n早晨醒來，周圍都是文字的聲音，我沒辦法把它們說出來&hellip;&hellip;栩栩如生的插圖，帶讀者進入每個場景，述說男孩與說話不流利奮戰的心路歷程&mdash;&mdash;教室裡一片模糊的期待臉龐，卡在喉嚨裡的話語，以及在河面上舞動的耀眼陽光。這是一本提供愛與接受的書，值得分享"},{"id":"ccd9dddfeaed41daa17bbe81","n":"漢妲的驚喜","a":"艾琳‧布朗","d":"艾琳‧布朗","t":"游珮芸","p":"遠見天下文化(小天下)","y":["111","112","113"],"ag":"3~5","c":"認知探索、社會情緒","cl":true,"lo":false,"isbn":"9789865535698","dt":"109-10","pr":320,"desc":"&nbsp;\n這是以肯亞為場景、以盧歐族的小女孩為主角、非洲的動物和水果為配角，編織出的故事。文字從小女孩的視角出發，她頭頂著水果，一路想著朋友會不會喜歡她的禮物，但是圖畫卻用客觀角度呈現事情的全貌，讓讀者看到小女孩不知道的狀況，而產生故事的趣味。[113]\n&nbsp;\n充滿趣味與驚奇的繪本，融合"},{"id":"ef9d32d4d75c4e27a9480da8","n":"喀嚓喀嚓爺爺的恐龍王國","a":"松岡達英","d":"松岡達英","t":"周郁寧","p":"米奇巴克","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789866215971","dt":"109-10","pr":280,"desc":"作者用剪紙和繪畫展演出一場戲中戲，故事中的爺爺用剪紙佈置了遠古時代的場景，製作出恐龍和各種動物角色，演出了一場小恐龍找媽媽的戲；而在戲外，也演出了創作者與他的故事角色間的故事。書裡不僅包含恐龍的知識，也展現了剪紙的技巧，以及把剪紙佈置成畫面的方法，很能引發讀者創作的興趣。[113]"},{"id":"aff13ac0da6f488784ac5f27","n":"被罵了，怎麼辦？","a":"北村裕花","d":"北村裕花","t":"蘇懿禎","p":"小熊出版(讀書共和國)","y":["112","114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789865503857","dt":"109/10","pr":320,"desc":"這本繪本中，孩子們穿上西裝和套裝，模仿父母，認真討論如何解決被大人罵的困境，最後孩子們提出了什麼妙招呢？從嚴肅的提案到搞笑的爆料，孩子們用輕鬆的方式告訴我們：其實，他們明白大人發火的原因，但最困擾他們的，是大人情緒化的反應。共讀時，讓我們和孩子一起討論，還有其他解決方案嗎？引導孩子找到應對怒氣的巧妙"},{"id":"fgjlaitk177wr68gzf2d6wfm","n":"如果冬天來了，告訴它我不在喔","a":"西蒙娜．希洛羅","d":"西蒙娜．希洛羅","t":"黃筱茵","p":"三民書局","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789571468556","dt":"109/10","pr":350,"desc":"在愉快戲水、開心吃冰淇淋的炎熱夏日，想像這些開心事都不能做的冬天，小男孩怎麼樣也不願和冬天見面。封面上拿著黃傘遮臉的孩子強烈訴說著：我不在。姊姊說著冬天的不好玩，弟弟滿是抗拒的不願相信，但還是努力地尋找「冬天」，最終真正地體驗了冬天好玩和有趣。對於未知，應是正面對決，親身體驗和感受，才能真正認識和了"},{"id":"vzr7vpujmksxzdqx9zirss34","n":"給森林照相館的信","a":"李時遠","d":"李時遠","t":"許延瑜","p":"青林國際","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789862745021","dt":"109/10","pr":320,"desc":"森林照相館的攝影師和助理踏上漫長的旅途，只為了幫客人圓夢。一張又一張照片啊，捕捉了濃濃的家族情感與生命的詩篇。這本繪本以溫柔的情意描繪動人的尋訪歷程，孩子們會自然而然地認識各種北極的動物，也體會家人間深厚的感情與連結，並在曼妙抒情的圖像引領下，延伸對愛的理解與想像。[114]"},{"id":"33773ea4255f40cb82cf7aa4","n":"小星的大月餅","a":"林珮思","d":"林珮思","t":"黃筱茵","p":"遠見天下文化(小天下)","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865535193","dt":"10909","pr":360,"desc":"在母女一起做月餅的生活場景中，巧妙融合中秋節、月餅和月亮的變化。在黑色襯托下，月餅閃閃發光，碎屑像星星灑在空中，讓母女彷彿生活在宇宙星空中，既奇幻又寫實。但最動人的是，每一幕母女的親密互動，臉上的微笑，都洋溢著暖暖的愛與喜悅。共讀時，看看小星可愛的神情和笑容，再和孩子手牽手，一起去做愛的月餅。[11"},{"id":"f42262be2ae2493fa81551b0","n":"水果海水浴！","a":"石津千尋","d":"山村浩二","t":"林真美","p":"","y":["110"],"ag":"0~3","c":"美感","cl":false,"lo":false,"isbn":"9789864403295","dt":"109-09","pr":"","desc":"琳瑯滿目的水果是現實生活中常見的，幼兒應該學會一一認識。本書從書名開始就充滿歡樂，書中將水果擬人化，每種水果都很可愛，再加上有趣的故事，容易讓幼兒愛上本書，進而愛上水果。"},{"id":"3d97df52afac45b3abf5ee93","n":"小手變變變","a":"盧揚、波切拉","d":"奧雷基亞","t":"楊雲琦","p":"","y":["110"],"ag":"0~3","c":"身體動作","cl":false,"lo":false,"isbn":"9789861899756","dt":"109-09","pr":"","desc":"繪圖精緻，文字更是精采。六首兒歌兼具音韻及趣味，譯筆毫不俗氣，應是原著與翻譯具佳的成果。這本遊戲書必須親子共讀共玩，才能領會其樂趣。書角磨圓，既顧慮到幼兒拿來玩耍的安全，又呼應挖圓洞的設計，可見該書的用心。"},{"id":"7721818721624e3298c52afd","n":"狐狸拔了11顆牙","a":"鄭淑芬","d":"鄭淑芬","t":"","p":"水滴文化","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789579529624 ","dt":"109-09","pr":340,"desc":"這是村民和貪吃狐狸鬥智的故事，透過逗趣幽默的情節和顏色柔和的水彩畫，展現呆萌狐狸驚慌失措，對比村人用智慧取勝的自在模樣，讓本書充滿童趣，喜感十足。共讀時，帶孩子關注結局，學習狐狸用正面的態度面對意外帶來的新改變，找到新的生存之道，反而有意想不到的收穫。[113]"},{"id":"le3wpkqxd8yp1q46yr1rwaaw","n":"這樣公平嗎？","a":"皮帕‧古哈特(Pippa Goodhart)","d":"安娜‧多博蒂(Anna Doherty)","t":"黃筱茵","p":"典藏藝術家庭(小典藏)","y":["114"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789579057691","dt":"109/09","pr":300,"desc":"野兔、熊與甲蟲的互動，引導孩子思考公平的本質與意涵。三個性格迥異的角色在資源分配上的不同觀點，呈現「公平」不僅關乎數量平均，更涉及需求與條件的考量。幽默對話與趣味情節，使孩子在輕鬆閱讀中學習換位思考與尊重他人，進而培養同理心與解決問題的能力。[114]"},{"id":"faa178b2e384463696ca5323","n":"遇到選擇時，你會怎麼做？","a":"五味太郎","d":"五味太郎","t":"游珮芸","p":"小熊出版(讀書共和國)","y":["112","113","114"],"ag":"3~5","c":"語言溝通、認知探索","cl":true,"lo":false,"isbn":"9789865503734","dt":"109/09","pr":320,"desc":"有很多禮物，但只能選一個？有四種水果，要怎麼平分給五個小孩吃呢？小狗掉到水裡，要怎麼救牠呢？這些生活中可能遇到情境題，不只是選擇、也是做決定，更是解決問題。一本引導孩子思考、親子共讀和對話的繪本。[114]我們希望孩子有判斷力，有解決問題的能力，但是這些都是需要學習的。生活裡好多選擇題，用講的，很沒"},{"id":"6b6687f8afb9452e94a1a68b","n":"猴子撈月","a":"張俊杰","d":"張俊杰","t":"","p":"信誼基金","y":["112"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789861616131","dt":"10908","pr":320,"desc":"本書賦予古老故事新的生命，在親子共讀時，猴子們在漆黑山洞中勇敢尋找光明，彷彿帶領讀者踏上奇幻冒險之旅。猴子們意欲撈下明月，為實現目標，讀者猶如身臨其境感受猴子堅定決心。此書不僅激發孩子想像力，同時也讓大人領悟生活寓意。[112]"},{"id":"6a1f706650164fb89f4a7d34","n":"今天的月亮","a":"張筱琦","d":"張筱琦","t":"","p":"南一書局(親子時堂)","y":["111","112"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":true,"isbn":"9789574436675","dt":"109.08","pr":320,"desc":"對孩子來說，「聯想」是有趣的遊戲，更是認識世界的重要途徑之一，在真實與想像之間穿梭，比較核對，偶爾小小犯錯，偶爾鬧出可愛的笑話，不但為生活憑添幾許樂趣，更是激發創意的最佳練習。這個筆觸隨意自在，角色表情豐富逗趣的小故事，帶孩子歷經了一趟迷人的聯想旅程。[112]\n本書非常單純可愛，圖畫看起來雖然樸實"},{"id":"60311c029d3c49a4867e8bc5","n":"惡龍在哪裡","a":"雷歐・提姆","d":"雷歐・提姆","t":"林敏雅","p":"青林國際","y":["113"],"ag":"3~5","c":"身體動作、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789862744994","dt":"109-08","pr":299,"desc":"三位有勇無謀的騎士，半夜摸黑出發尋找惡龍，在他們擊敗惡龍之前國王不敢上床睡覺。騎士們對惡龍瞭若指掌，背上有奇怪的刺、滿嘴的尖牙、還會噴火。他們手持蠟燭，很快就發現了看起來非常像龍的東西&hellip;&hellip;奇怪，騎士臉上貼的OK繃怎麼越來越多！大小朋友們，快跟著騎士一起暢玩光影和形狀的遊戲"},{"id":"13bbff97e7d74214b7001ddd","n":"一個像海的地方","a":"林柏廷","d":"林柏廷","t":"","p":"遠流出版","y":["110","112","113"],"ag":"3~5","c":"認知探索","cl":true,"lo":true,"isbn":"9789573288480","dt":"109-08","pr":300,"desc":"&nbsp;\n小男孩和父母親去海洋生態館參觀，卻和父母走散了，孤單焦急的心情使他對被圈養在生態館的海洋生物產生了同理心。作者用類似版畫的技法，讓粗重的黑色襯托色彩鮮明、光影交錯的海水，創造出生態館獨特的氛圍，又用第一人稱表達出男孩的感受，讀者也因此能認識自己的情緒。[113]\n&nbsp;\n閱讀本書"},{"id":"f9143d7da4ac4696816a48bf","n":"誰的襪子","a":"孫俊","d":"孫俊","t":"","p":"信誼基金","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789861616230 ","dt":"109-08","pr":280,"desc":"小貓撿到從頂樓掉下的一隻襪子，開始扮演福爾摩斯，展開一到五樓尋找失主的行動。整本黑白圖畫中，亮黃襪子指引小貓遇到不同動物鄰居、發生不同事，直到他在轉角發現驚喜答案。共讀時，讓孩子觀察畫面上不同襪子、細節和巧思，再猜猜結尾撿到紅襪子的小兔會遇到誰？發生什麼事？[113]"},{"id":"9bf64e03396544f28365274c","n":"大家來畫月亮","a":"曹俊彥","d":"曹俊彥","t":"","p":"信誼基金","y":["113","114"],"ag":"0~3","c":"身體動作、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789861616186 ","dt":"109/08","pr":200,"desc":"這是一本充滿樂趣的數學啟蒙繪本，邀請孩子跟著不同的動物，用各種生活物品來畫出圓形的月亮，小花貓用硬幣畫、老虎用盤子畫……哇！月亮的大小竟然會不一樣。在畫月亮的過程中，孩子能學習圓形大小的差異，發現數學就藏在日常生活裡。共讀後，還可以和孩子一起動手玩，在家裡找找不同的圓形物品，試著畫出各種大小的月亮，"},{"id":"54b463eeb3454daa9038cf97","n":"鼹鼠的禮物","a":"海文．歐瑞","d":"蘇珊．巴蕾","t":"范曉星","p":"和英出版","y":["112"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869883139","dt":"10907","pr":320,"desc":"溫暖的獾為朋友辦一場自帶禮物的聚會，所有動物都歡天喜地精心準備，唯獨忙著建造新家的鼴鼠空手前來，當眾人的奚落指責此起彼落，當我們以為對錯只有一種可能，甚至唯一標準時，卻因獾的寬容與智慧而扭轉了情況。讓人相信，真正的朋友會看進我們的內在，並激發我們深藏本質裡的美好。[112]"},{"id":"c40e4215565f49ca843ab54d","n":"鼴鼠的願望","a":"金祥謹","d":"金祥謹","t":"許延瑜","p":"青林國際","y":["112","113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":false,"isbn":"9789862744925","dt":"109-07","pr":320,"desc":"&nbsp;\n孩子年幼時，常會出現的「幻想朋友」對他們的成長很重要。透過和幻想朋友相處，孩子能學會和真實朋友交往。色彩柔美的圖畫中，小鼴鼠因搬家孤單，把雪球和雪熊當朋友。在理解牠的鹿叔叔和奶奶的陪伴下，牠的情緒得以紓解。而最後再度出現在屋外的雪熊，讓故事有了溫馨結尾和想像空間。[113]\n&nbsp"},{"id":"c3c90c3ea9c6437da0f3f419","n":"柯爾達的鐵線世界","a":"希伯．波思圖瑪","d":"希伯．波思圖瑪","t":"謝佩霓","p":"典藏藝術家庭(小典藏)","y":["112"],"ag":"3~5","c":"身體動作、認知探索、美感","cl":false,"lo":false,"isbn":"9789579057646","dt":"10907","pr":300,"desc":"這個歡快愉悅的故事，恰如其份地展現了藝術的本質。藝術是想像出來的，充滿意想不到的各種可能：藝術的世界可以無限，想要多大就有多大，想去哪裡就去哪裡；藝術是玩出來的，以我們的手和各種工具；藝術甚至不怕挫折，無懼迷失，因為藝術裡面沒有標準答案，只有無止盡的探索追尋。[112]"},{"id":"81217bc66f984193b4291d1e","n":"跨代的對話：請聽我說","a":"林玫伶、 臺北市國語實驗國民小學學生","d":"鄭淑芬、國語實小美術創文社","t":"","p":"國語日報社","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":true,"isbn":"9789577518521","dt":"109.07","pr":300,"desc":"十個生活狀況下，阿公阿嬤跟孩子不同的反應和做法，讓不同的世代了解彼此的觀點差異，也讓孩子從這樣的內容學習到溝通和同理心，同時書中的圖畫都很符合孩子的畫風和畫法，讓這本書更加的貼近孩子。"},{"id":"d3180643599e43b79863e114","n":"第五個","a":"恩斯特‧揚德","d":"諾爾曼‧容格","t":"高玉菁","p":"三之三文化","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789865664442","dt":"109-07","pr":"","desc":"書中文字非常簡約，句型也很簡短，而且不斷重覆。若僅看文字，很難知道書中的動物玩偶們發生了什麼事，但插圖提供了豐富的訊息。本書很適合讓孩子根據圖文所提供的線索，推敲故事發生的情節和角色的心情，也可鼓勵孩子加上自己的想像，創造他們自己版本的「第五個」故事。"},{"id":"65ea36efdda947cf9147a210","n":"寶寶好習慣養成系列套書4：安全小常識","a":"田淑現","d":"閔有敬","t":"簡郁璇","p":"","y":["110"],"ag":"3~5","c":"健康與安全","cl":false,"lo":false,"isbn":"9789865517144","dt":"109-07","pr":"","desc":"3到5歲的學齡前孩童不但好奇心旺盛，更有足夠的行動力，因此帶著孩子認識居家安全相當重要。這本書最大特色是讓孩子認識危險在哪裡，以及提供對策。家長可以和孩子用討論的方式，找到更多解決問題的辦法，來建立安全觀念和培養良好生活習慣。"},{"id":"44187122c8f54c789df5aca4","n":"阿奇最愛說：不要！","a":"翠絲．寇德羅伊","d":"提姆．沃恩斯","t":"孫昭業","p":"","y":["110"],"ag":"0~3","c":"社會情緒","cl":false,"lo":false,"isbn":"9789862488911","dt":"109-07","pr":"","desc":"圖文精緻，故事也很幽默，能協助處理幼兒情緒學習。父母帶著幼兒逐頁閱讀下去，必然會覺得書中內容就像自己的日常生活，因而令孩子愛不釋手。本書為系列作品，若喜歡不妨再看看其它作品。"},{"id":"a0c805f6696a4c7aa2a91274","n":"小黑熊形狀遊戲書──圓形 三角形 正方形","a":"柏原晃夫","d":"柏原晃夫","t":"上誼編輯部","p":"上誼文化","y":["110","111","113"
