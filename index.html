社會情緒、美感","cl":false,"lo":false,"isbn":"9789863209812","dt":"105-04","pr":300,"desc":"「有時候，當你被髒亂圍繞，反而更能體會什麼是美好。」家裡沒有汽車、沒有腳踏車、 沒有隨身聽的小杰抱怨著為什麼做完禮拜都要去髒亂的社區幫忙。奶奶帶著小杰用正向力改變身邊的世界，體會人與人之間的溫暖，在髒亂中領會美，在貧乏中領會付出的幸福。[109]\n星期天，小杰不能和朋友一起騎腳踏車，他得和奶奶一起上"},{"id":"e1514fb3298749d49759b7b1","n":"出門囉，出門囉！","a":"木村裕一","d":"瀨邊雅之","t":"鄭明進","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862742761","dt":"105-04","pr":199,"desc":"活潑好動的老鼠寶寶和爸爸、媽媽一起逛百貨公司。走啊走，逛啊逛，爸爸買襯衫，媽媽買睡衣，哇～老鼠寶寶也買了玩具汽車！回家囉！鼠寶寶累得走不動，想要媽媽抱。不行！媽媽手上拿著東西唷。騎在爸爸的肩上？不行！爸爸手上也有東西唷。哎呀！累壞了的鼠寶寶該怎麼辦呢？"},{"id":"0f4220cc64fa4807a1ba76bd","n":"巫婆阿妮和黑貓阿寶","a":"韋樂莉．湯瑪士","d":"柯奇．保羅","t":"吳其鴻","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862742648","dt":"105-04","pr":320,"desc":"「Abacadabra 阿布拉喀達碰！」是一句神奇的咒語，它可以把世界變成彩色的，也可以把心情變成彩色的。黑貓阿寶是巫婆阿妮的寶貝，他們住在黑色的房子裏，牆壁是黑色的，地毯是黑色的，床是黑色的，連浴缸也是黑色的。為了看清楚黑貓阿寶，巫婆阿妮把牠變成奇奇怪怪的顏色，結果弄得大家都不開心。「Abacad"},{"id":"1c097610ee044a2e8397dd68","n":"小熊奇兵","a":"安東尼布朗","d":"安東尼布朗","t":"黃鈺瑜","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861896557","dt":"105-04","pr":280,"desc":"小熊有一支神奇的魔法鉛筆，可以畫出許多食物為貓咪止飢，能夠畫輪鞋、梯子、鋸子、香蕉皮、小圖釘解救受困的動物們，還能畫一處碧草如茵的的丘陵讓動物們安居。「魔法鉛筆，解決難題；創意思考，威力無敵！」快和孩子一起加入小熊的超現實旅程，探索新世界吧！"},{"id":"9d01b2895ee8460a8dbe2742","n":"小桃妹","a":"江明恭","d":"江明恭","t":"","p":"","y":["106","109","110"],"ag":"3~5","c":"社會情緒、美感、認知探索","cl":false,"lo":true,"isbn":"9789861615387","dt":"105-04","pr":250,"desc":"這是一本富有臺灣在地文化的繪本，故事講述的是客家人的傳統米食「粄」。主角小桃妹為了阿婆，四處探詢千金粄的事，終於幫阿婆想到如何做出千金粄。此書無論故事和繪圖，都可讓小朋友感受到客家文化的特色，是介紹客家文化不可或缺的一本童書，書中透露的祖孫情、鄉土情也很真摯可貴。[110]\n這是一本充滿溫情及傳承的"},{"id":"a7a4173ac624487cae91b60d","n":"老鼠、鼴鼠挖番薯","a":"藤本四郎","d":"藤本四郎","t":"鄧吉吉","p":"","y":["110"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789577625885","dt":"105-04","pr":"","desc":"本書適合與孩童戶外教學生活經驗相結合，生動活潑的畫面中描述老鼠幼兒園和地下的鼴鼠幼兒園小朋友們遠足的故事。地上與地下的世界，對照有什麼不一樣的地方？當大夥遇到大番薯興奮拔河，地上是拔葉子、地下是拔根，比較差異發揮親子共讀探索的樂趣。"},{"id":"ce569a74a33d40b3beb0f9de","n":"有你有我","a":"莉莉．拉洪潔","d":"莉莉．拉洪潔","t":"黃筱茵","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571365930","dt":"105-04","pr":240,"desc":"集天真、活潑、可愛、聰明、淘氣、任性、愛哭、愛模仿、不講理、精力無窮⋯⋯於一身，前一刻還是個甜蜜可人的小天使，瞬間卻變成了令人頭痛的小惡魔。喔，我的小寶貝！雖然「天使與魔鬼」的戲碼不斷上演，但是生命中有你有我，一切就是如此美好！"},{"id":"56c9c5409b994e9e8daf2ce3","n":"愛心樹","a":"謝爾．希爾弗斯坦","d":"謝爾．希爾弗斯坦","t":"劉美欽","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865730352","dt":"105-03","pr":320,"desc":"大樹好愛小男孩，陪他玩遊戲、給他盪鞦韆，男孩玩累了，就睡在樹蔭下休息。男孩長大離開了，大樹變得很孤單。直到有一天當男孩需要大樹的時候他回來了，大樹奉獻蘋果讓他賣錢，奉獻樹枝給他蓋房子，奉獻樹幹供他造船，一再地把她僅有的一切奉獻給男孩，然後默默的守護著男孩回來，直到男孩年老。能夠讓男孩快樂，大樹就好快"},{"id":"016daa2912a247f593001ceb","n":"花開了！","a":"石川浩二","d":"石川浩二","t":"張玲玲","p":"","y":["106","107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861896465","dt":"105-03","pr":280,"desc":"把有條紋的種子埋進土裡會長出什麼？《花開了！》呈現各種植物從種子、發芽到開花等不同階段的生長過程，每翻開一頁向上展開的折頁都是驚喜！書中重複式的段落語句，猜謎式的趣味，以及色彩鮮明的圖案，會吸引孩子一翻再翻，看看種子、看看花，也找找裡面的小昆蟲。[107]\n有條紋的種子、有鱗片的球莖，埋進土裡，會怎"},{"id":"7834e12ad68e46a38274f4b9","n":"小黃點大冒險！","a":"赫威•托雷","d":"赫威•托雷","t":"周婉湘","p":"","y":["106","110"],"ag":"3~5","c":"美感","cl":false,"lo":false,"isbn":"9789577625861","dt":"105-03","pr":300,"desc":"作者畫了一系列「小黃點」的書，每一本都令孩童喜愛。在本書中，小黃點展開冒險旅程，讓孩子一頁頁跟著它過關斬將，非常過癮。小黃點可以跑，也可以飛，孩子的心情也一樣。看完本書，通常會馬上再回頭重看一次，因為這是一趟令人身心愉快的冒險。[110]\n把孩子肥肥小小的手指頭變成「魔法棒」吧！手指按一下，隨著小黃"},{"id":"b2a51718d5e8493fb368482c","n":"我是一棵櫻花樹","a":"長谷川攝子 (Setsuko Hasegawa)","d":"矢間芳子(YoshikoYazama)","t":"張東君","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789573277941","dt":"105-03","pr":270,"desc":"春天時，粉色櫻花開滿枝頭，鳥兒開心享用花蜜大餐。風來了，吹起陣陣櫻花雨，枝椏上冒出的點點新綠，很快長成濃密的綠葉，到了夏天，便是蟲子們喜愛的綠色盛宴。秋涼時，櫻花樹的葉子轉為紅與黃，為大地增添幾分顏色。冬天裡，櫻花樹枝條上的芽兒不畏冷風呼呼吹，靜靜地等待，春風拂來，又見櫻花綻放！"},{"id":"b88e48eba284420d873a65c7","n":"十個小朋友跑哪去？","a":"卡洛(Amélie Callot)","d":"卡洛(Amélie Callot)","t":"劉孟穎","p":"","y":["106","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864270460","dt":"105-02","pr":300,"desc":"十個可愛的小朋友在一起玩耍，但是他們每做一件事，就會有一個人遇到一件奇妙的事，然後就不見了！下一個不見的會是誰呢？不見的人又會到哪裡去呢？誰又會留到最後呢？這是一本令人感到奇妙的繪本，而大開數的繪本帶給我們樂趣，使我們彷彿置身在故事中的情景般地逗趣！[108]\n十個小朋友一起玩，一個一個都發生了奇妙"},{"id":"44be40069a65454497e8cbde","n":"如果你給老鼠吃餅乾","a":"蘿拉．喬菲．努墨歐夫","d":"蘿拉．喬菲．努墨歐夫","t":"林良","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863208730","dt":"105-02","pr":320,"desc":"如果你給老鼠吃餅乾，就會啟動老鼠一個接一個的要求，沒完沒了；而且老鼠對於要求要做的事，一點都不馬虎，總是認真以對，盡善盡美。小男孩對小老鼠則是有求必應，還不慍不火，最後雖不免疲累，仍是無怨無悔，讓看似麻煩的老鼠，卻一點都讓人討厭不起來。"},{"id":"2eb1e2b76276439ebc54c589","n":"公主怎麼挖鼻屎？","a":"李卓穎","d":"李卓穎","t":"","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861615370","dt":"105-02","pr":250,"desc":"公主怎麼挖鼻屎？老奶奶提了這個奇怪的問題，引起動物們熱烈的討論。用手指挖，然後交給媽媽？假裝不小心，彈到很遠的地方？一口吞掉？黏到牆上？偷偷埋起來？悄悄放進杯子裡，等它溶化？公主究竟怎麼挖鼻屎？請看《公主怎麼挖鼻屎？》！"},{"id":"54827b68ee824eebb3f61f3f","n":"山羊蛋糕店","a":"木村裕一","d":"木村裕一","t":"倫子","p":"","y":["106","107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625847","dt":"105-02","pr":260,"desc":"動物村裡新開了一間蛋糕店，有鬆餅、蛋糕捲和生日蛋糕！透過精心設計的軋型翻頁，可以讓孩子體驗製作甜點、品嘗美食的過程，並化身成甜點師傅、服務生或客人，享受扮演遊戲的樂趣。[107]\n山羊小姐在動物村裡開了一間蛋糕店，有鬆餅、蛋糕捲、特大號的栗子蛋糕，還有草莓生日蛋糕呢！開幕第一天，小動物們紛紛上門來吃"},{"id":"f446262421a641cc81938aa7","n":"發現一頂帽子","a":"雍．卡拉森","d":"雍．卡拉森","t":"李貞慧","p":"親子天下","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789869317917","dt":"105-01","pr":320,"desc":"沉穩的兩隻烏龜，以簡約的對白，精準呈現群體生活資源有限時，慾望的可能出路。三幕劇一貫都是灰色背景，演員的動作和表情相當節制，出現的物件只有仙人掌、夕陽和一頂帽子-- 這些「少」，正好對比「複雜」的心理掙扎。一天之間，主角無法言明的幾種心緒，幾經轉折，仍然頑固存在。冷調幽默，風格獨具。"},{"id":"5ae672f8c39a46458b7fbb27","n":"動手玩童話--小木偶皮諾丘","a":"Tiago America","d":"Tiago America","t":"林幸萩","p":"禾流 文創","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869369909","dt":"105","pr":380,"desc":"很久很久以前，有位叫蓋比托的老木匠，製作了一個漂亮的木偶&hellip;&hellip;《動手玩童話-- 小木偶皮諾丘》將大家耳熟能詳的經典童話重新演繹，透過動手操作的小機關讓小木偶動起來，嬰幼兒在聽故事與遊戲中自然而然就能認識顏色、圖形，訓練手指小肌肉，提升「手眼協調、五感統合」。"},{"id":"4fb68076c2b0464f9f9c6f54","n":"鱷魚餓了","a":"歐希里亞．伊給","d":"歐希里亞．伊給","t":"阿爾發工作室","p":"阿爾發","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869006187","dt":"105-09","pr":238,"desc":"鱷魚是位美食家，肚子餓了！有什麼食物可以吃呢？烏龜？不，牠太硬了。刺猬？不，牠刺刺的。野兔？不，牠跑太快了。大象？不，牠好大啊！啊！來了一位小男孩&hellip;&hellip;，鱷魚張大了嘴巴衝過來，是要吃他嗎？！作者用一個輕鬆詼諧的手法，引發孩子的思考和想像。"},{"id":"00a9ba4085e94bc3ae35d885","n":"貝蒂不想不想去睡覺","a":"史帝夫．安東尼","d":"史帝夫．安東尼","t":"柯倩華","p":"親子天下","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869248662","dt":"105-01","pr":"","desc":"故事描寫大人為了誘哄孩童入睡，在睡前展開的多回合協商與折衝，故事緊湊幽默、畫面生動活潑、結局轉折巧妙。書中兩名主角大嘴鳥與猩猩女娃貝蒂的關係類似家長與孩子，很適合作為睡前書。主角貝蒂因情緒變化起伏鮮明，造型亮眼討喜，堪稱當代圖畫書明星。"},{"id":"4aa7481340bf4c98983b163a","n":"早起的一天","a":"賴馬","d":"賴馬","t":"","p":"親子天下","y":["109"],"ag":"0~3","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869261470","dt":"105-01","pr":360,"desc":"豬小妹難得早起的一天，是為了幫奶奶的忙，籌備爺爺的壽宴。因為早起，她看到不一樣的城鎮面貌，包括早起工作或運動的居民，以及早晨的市場。小讀者可以體驗隱藏在平凡生活中的幸福，以及濃厚的人情，包括幫忙奶奶的孝順心意，以及一家人團聚的溫馨親情。"},{"id":"fcc1a1f2b00045dc8770aede","n":"河馬波波屁股大","a":"迪迪耶李維","d":"馬克‧布塔方","t":"謝蕙心","p":"","y":["106","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789866215469","dt":"105-02","pr":270,"desc":"河馬波波煩惱自己的屁股太大了！森林裡的動物全跑過來，熱烈討論波波的屁股。 七嘴八舌的動物們竟為這個問題爭論不休，甚至大打出手，最後因為波波想上廁所，當他坐上自己的小馬桶後，才發現自己的屁股其實不大也不小，真的是剛剛好呢！[108]\n動物們都開開心心的在河邊喝水，只有河馬波波為「屁股大」所苦，悶悶不樂"},{"id":"791f9a488522431794e2c6be","n":"大熊小椅子","a":"莉茲．博伊德","d":"莉茲．博伊德","t":"郭妙芳","p":"","y":["106","110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789865876333","dt":"105-01","pr":300,"desc":"這本充滿童趣的大小對比概念書分為四部分，讓大熊、小熊、大椅子、小椅子輪番上場，每個部分分別並置各種不同的大小概念，例如大鳥兒、小雨傘；大兔子、小花朵；大企鵝、小冰山等。最後大熊抱著小熊坐在大椅子上，大大小小的動物再次出現，把這小小的故事，做了完美的結束。[110]\n什麼東西大？什麼東西小？這本充滿設"},{"id":"f21130a4f60b47d6a81fa1b4","n":"洞裡頭有什麼東西？","a":"蕾貝卡•寇柏","d":"蕾貝卡•寇柏","t":"艾可","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865730260","dt":"105-01","pr":280,"desc":"球掉到院子的洞裡，沒有彈回來！「好深的洞！」這裡面是小老鼠的家嗎？裡面住著青蛙？鼴鼠？還是小兔子呢？說不定裡面住著龍，或是大妖怪呢！小男孩很喜歡有個奇妙的東西住在他們家，也很期待與它見面。你們家也有這樣令人想像力爆發的小洞、小縫隙嗎？跟著爸媽一起去探索一下吧！猜猜裡頭有什麼？"},{"id":"3f2b1f4b3e2245908ba47fed","n":"你看看你，把這裡弄得這麼亂！","a":"劉旭恭","d":"劉旭恭","t":"","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789865730314","dt":"105","pr":280,"desc":"百無聊賴的總統先生，來到部長辦公室。部長忙得不得了，桌上堆滿了文件，辦公室裡亂七八糟。總統先生大吼一聲︰「你看看你，把這裡弄得這麼亂！」之後覺得好多了。翻開書頁繼續往下看，唉呀！部長太太的廚房、小孩的房間、流浪漢的窩全都亂七八糟&hellip;&hellip;"},{"id":"b62c9310e338487d87657058","n":"靜悄悄的蛋","a":"黛安娜・哈茨・阿斯頓","d":"希薇亞・隆","t":"張東君","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865730390","dt":"105-07","pr":320,"desc":"蛋除了橢圓形，還有圓的、尖的、管狀的？蛋不只白色，還有紅的、綠的、橘的、藍的？蛋竟然可以大到超過三公斤重，還會偽裝以融入周遭環境，避免自己被其他動物吃掉？！書中充滿各式各樣的蛋，展現著它們的美麗與神奇。"},{"id":"4051c81b8d814f17b5e9937d","n":"鱷魚阿本的家","a":"豐田一彥","d":"豐田一彥","t":"高明美","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864790029","dt":"105","pr":260,"desc":"星期一，動物園休息，阿本不上班。動物園的朋友都來阿本家玩，河馬、紅鶴、大猩猩&hellip;&hellip;連附近的小朋友都拿著游泳圈來了。叩叩叩，你也想看看阿本的家嗎？快打開書認識阿本的動物園朋友們、瞭解鱷魚的棲地特色。"},{"id":"393f100b02e948c496159c9f","n":"十隻腳趾頭","a":"卡洛琳．珍．雀爾屈","d":"卡洛琳．珍．雀爾屈","t":"高明美","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864790777","dt":"105","pr":280,"desc":"《十隻腳趾頭》完美演繹幼幼書共玩共學的特色，幫助幼兒從觀察、聽覺、動覺，開始學習的第一步。親子共讀建議：小小孩：跟著朗朗上口的韻文，抓著孩子的小手小腳，動動身體，認識自己。大小孩：請孩子指出「關鍵字」的身體部位，引導孩子觀察小熊和男孩的互動。"},{"id":"94f051275ceb40aa83dfb9e9","n":"小小孩最愛問百科書-為什麼呢?","a":"Anne Royer","d":"Charlie Pop、Marion Piffaretti、Christine Ponchon、Lucile Ahrweiller","t":"王晶盈","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864292431","dt":"105","pr":450,"desc":"為什麼我們需要空氣呢？為什麼會有地震？小孩子總有好多個為什麼，讓《小小孩最愛問百科書》幫幫頭大的父母吧！透過主題式重點解釋，活潑簡潔的文字與童趣歐風插圖，還有55 張以上認知貼紙輔助，將最複雜的知識簡單化，讓每個好奇的小小孩都能輕鬆開啟知識的大門。"},{"id":"293a8682df8844ec9a489438","n":"蜜蜂與我","a":"艾莉森‧傑伊","d":"艾莉森‧傑伊","t":"","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864271139","dt":"105","pr":280,"desc":"《蜜蜂與我》藉由蜜蜂和小女孩的故事，帶出人類與自然生態的關係。蜜蜂在生態系扮演非常重要的角色，但近年來，因環境的破壞，蜜蜂的數量逐漸減少。作者在書末介紹了一些適合蜜蜂的花朵，讀者不妨選幾株種在自家的花園裡，一起來拯救這個可愛又重要的生物－－蜜蜂。"},{"id":"13250201ded347adbffcf35c","n":"我想當獅子","a":"艾瑪‧卡莉蘇","d":"艾瑪‧卡莉蘇","t":"鄭榮珍","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863380948","dt":"105","pr":280,"desc":"蘿拉最愛玩「學習」的遊戲。她愛學袋鼠跳，愛學鸚鵡拍翅膀&hellip;&hellip;。某天，蘿拉想當獅子。因為獅子跳得高、跑得快、擅長捉迷藏。「吼&mdash;嗚」的吼叫聲還非常神氣。但是爸媽覺得她會吵到家裡的小嬰兒，讓蘿拉好難過。猜猜看：爸媽會學當什麼動物來安撫蘿拉的心情呢？"},{"id":"5bfa2633ac084c4d82a250ca","n":"刷牙號小火車，出發！嘟嘟——汽鏘汽鏘——","a":"久保真知子","d":"久保真知子","t":"陳瀅如","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862743041","dt":"105","pr":220,"desc":"小迪最討厭刷牙了，但當小火車出現在他面前，誠摯地請小迪讓自己進入他嘴巴時，他竟然願意大大張開嘴巴！原來是牙刷化身成小火車，打開大燈照著嘴裡的菜渣、玉米粒，多虧有刷牙號小火車，口腔一下子就清潔溜溜了。啊！可是頑固的肉渣卡住了，該怎麼辦呢？"},{"id":"f06ab04d7e954179be60cf79","n":"小鳥請唱歌","a":"五味太郎","d":"五味太郎","t":"黃惠綺","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862742945","dt":"105-09","pr":220,"desc":"小鳥的歌聲，有時很柔美，有時則很有精神。聽見牠的歌聲，會使人喜悅、充滿活力、產生勇氣，或懷念往事&hellip;&hellip;，有的人則會想跳舞，還有人會想一起唱歌。連原本想做壞事的人，聽見小鳥的歌聲，就打消了壞念頭。下次遇見小鳥時，記得聽聽那奇妙的歌聲吧！"},{"id":"8abfb78cc6d64478a16ecaa8","n":"丹丹的手帕","a":"岩村和朗","d":"岩村和朗","t":"黃惠綺","p":"","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862742716","dt":"105-06","pr":260,"desc":"丹丹胸前的紅色手帕看起來小小的，可是只要唸唸「變大吧！手帕，啪啦，啪！」的咒語，它就會變大了！紅色手帕可以變成領帶，像爸爸一樣，看起來很威風；手帕再變大一點，可以用來鬥牛；再大一點，還可以當作披風變身超人！"},{"id":"aa5437093d224405986229ea","n":"誰輕？誰重？","a":"秋山匡","d":"秋山匡","t":"蘇懿禎","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789862115800","dt":"105-01","pr":"","desc":"翹翹板可用以輕重的比較，作者利用這個概念發展成幽默的小書。在幼兒閱讀本書之前，應已玩過翹翹板，也已了解重量的意義。親子共讀時，翻頁不宜過快，要引導幼兒發揮想像，因為書中所畫的並非唯一的答案。若能發現其他答案，樂趣倍增。"},{"id":"75bdd68f6a94458981682fef","n":"小雞換聲音","a":"佐藤和貴子","d":"二俣英五郎","t":"張玲玲","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861897295","dt":"105","pr":280,"desc":"這一天，小雞出門玩，在路上遇見了忙著儲藏堅果的老鼠、砍柴的小豬、游泳的青蛙、澆花的小狗，並且跟他們玩起交換聲音的遊戲&hellip;&hellip;當小雞不再啾啾叫，會發生什麼意想不到的事？"},{"id":"27e8933bf9424337b020dae5","n":"一個部落的孩子","a":"藍史密斯","d":"藍史密斯","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861896748","dt":"105-06","pr":280,"desc":"小男孩展開一趟奇妙的旅程，他在路上所遇見的每位新朋友，都擁有各自的群體；只有他，是獨自一人。他試著努力融入各種族群，裝上羊角、學企鵝走路...... 可是新朋友都只能陪伴他一陣子，就要往各自的方向前進。到底小男孩是迷失的孩子，還是好奇的探險家呢？他最後會找到屬於自己的歸屬嗎？"},{"id":"e7c0681fd7284d39bfb594a2","n":"大家晚安!","a":"克里斯霍頓","d":"克里斯霍頓","t":"賴云倩","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861896632","dt":"105","pr":320,"desc":"天色越來越暗，小老鼠、小兔子、小鹿&hellip;&hellip;一個個都打起呵欠。上床睡覺的時間到了，但小熊卻一點睡意也沒有，他覺得好無聊，可是朋友們都累了，沒有人可以陪他一起玩，小熊該怎麼辦呢？"},{"id":"bd154cb683ba4727b9442b6e","n":"雲豹的屋頂","a":"王春子","d":"王春子","t":"","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789573278825","dt":"105","pr":320,"desc":"「親愛的長頸鹿，我現在很好，住在城市的屋頂上喔。」長頸鹿收到穿山甲郵差送來的一封信，信是來自遠方熱帶小島上的雲豹。長頸鹿想：「城市？那是什麼樣的地方？雲豹那麼大又那麼重，要怎麼住在屋頂上呢？」長頸鹿實在太好奇了，也很想見見他的朋友，於是決定出發去找雲豹&hellip;&hellip;"},{"id":"4b8bccc7a17546f6ac42027a","n":"鴨子?兔子?：啟動想像、學習尊重的創意繪本","a":"艾美．克蘿思．羅森朵","d":"湯姆．利希騰赫","t":"楊郁慧","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789573278870","dt":"105","pr":280,"desc":"「書裡有一隻可愛的鴨子耶！」「才怪！是兔子啦！」到底是兔子還是鴨子，誰來評評理？學習尊重與接納，看見世界的多元與豐富！這是兔子還是鴨子？其實，很多事情並沒有「不可能」或「一定是」，盡情想像、發揮創意，就能看到更多可能性！"},{"id":"4fd97a80de3341a2950fa5db","n":"分享椅","a":"香山美子","d":"香山美子","t":"邱瓊慧","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863208457","dt":"104-12","pr":280,"desc":"小兔子做了一把椅子，放在大樹下，並在椅子旁立了一個寫著「請」字的牌子。小驢子把一籃滿滿的橡實放在椅子上，坐在樹下歇一歇，不覺在微風中睡著了。大熊來了，看見立牌上寫著「請」，便開心地把橡實吃光光。「要是只留下一個空空的籃子，對後來的人很不好意思。」於是，大熊將一罐蜂蜜放進籃子裡。不久，狐狸帶著剛出爐的"},{"id":"8cd7128dd6f34ce5b68db417","n":"髒兮兮國王","a":"嚴凱信","d":"嚴凱信","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789862115824","dt":"104-12","pr":280,"desc":"有個國王髒兮兮，他的國家、子民也都髒兮兮，但是他的那些黏答答、累乎乎、酸溜溜的子民們還是會努力討好他⋯⋯後來抓抓和癢癢也來了，他們一心想要讓國王開心，可是國王依然很不快樂！來看看「乾乾」和「淨淨」兩兄弟是怎麼幫國王找到快樂的方法！《髒兮兮國王》用輕鬆的故事潛移默化教會孩子，保持清潔，讓人舒服又快樂。"},{"id":"8f5c00a5f43d4030aa265cbe","n":"花子小姐是誰呀？","a":"古川拓","d":"古川拓","t":"陳靜怡","p":"阿爾發","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869006163","dt":"104-11","pr":230,"desc":"跟著爺爺一起去動物園的小兄妹，一回到家就喋喋不休的告訴父母花子小姐的樣貌。書的左頁呈現孩子的家庭生活與互動，右頁則是孩子記憶裡的花子特色。全書活潑的呈現幼兒的觀察和表達，可引導孩子「看」、「說」的能力。書中所附海報是實際大小的「大象腳」，可讓孩子想像「象的全身」。"},{"id":"ca3cae9a137943a79afb4069","n":"豬先生和他的小小好朋友","a":"艾力克斯‧拉提蒙","d":"艾力克斯‧拉提蒙","t":"黃筱茵","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866215445","dt":"104-11","pr":280,"desc":"豬先生的鼻子突然發出「吱吱」的聲音，這是怎麼一回事呢？醫學百科裡找不到「鼻子吱吱叫」的病；原來，豬先生的鼻子上站著一隻揮手的小蟲哪。他們想成為好朋友；不過，豬先生穿不下小蟲編織的毛線衣，小蟲費盡力氣才能推動棋子和豬先生下棋，他們都很傷心，只好分開。有一天，風把報紙吹到豬先生臉上，他因而想到可以和小蟲"},{"id":"b8fd53232fbf4f48ae420b79","n":"水藍色的圍巾","a":"楠茂宣","d":"松成真理子","t":"李慧娟","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864400263","dt":"104-11","pr":280,"desc":"什麼友誼令人難忘，什麼祝福誠摯長久？故事透過孩子的互動及誤會導致的嫌隙表現人我的不同，但同樣充滿了善良的情操。翻閱間能感受到世上聚散離合的不捨，卻也領悟到親情與友誼的可貴。看似輕鬆、童稚，卻運用了不同視角與特寫的圖像充滿了情感的張力及懷舊的氛圍。"},{"id":"2a26634dea5c4c8b86e07ace","n":"我的蔬菜寶寶","a":"陳麗雅","d":"陳麗雅","t":"","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789862115855","dt":"104-11","pr":280,"desc":"蔬菜是絕佳的植物學素材，可摸、可看、可吃，若留下根部做植栽，還可實際觀察成長兼美化環境。佐以本書，3D轉成2D，食用部位與整株植物，以及周邊昆蟲的關係，清晰可見。由下往上翻的垂直頁面，突出地表與地底的縱深，再從預留的線索，猜猜蔬菜寶寶是誰喔！"},{"id":"8f7db7ebe15b46fd8ff9ad58","n":"毛毛123：我一歲了系列套書 毛毛 123：開開","a":"陳盈帆","d":"陳盈帆","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789570846348","dt":"104-11","pr":350,"desc":"主角毛毛一早就在公雞的啼叫聲與和煦的陽光中起床，接下來刷牙、聞食物和媽媽一起走出戶外等都是在體驗週遭事物與自己的本能感知。在這過程中，毛毛體會了各項事物的美好，也漸漸變得活潑自主。親子共讀時，可以請孩子預測毛毛接下來的動作與反應，並說出與自己相關的五感經驗。"},{"id":"eb6445bb542b497496eb2605","n":"毛毛123：抱抱","a":"陳盈帆","d":"陳盈帆","t":"","p":"","y":["108","109"],"ag":"0~3","c":"社會情緒","cl":false,"lo":true,"isbn":"9789570846362","dt":"104-11","pr":350,"desc":"這是一本睡前的「晚安抱抱」，睡前的安撫儀式，對寶寶來說很重要。毛毛有一整套睡前儀式，有書、有小熊，最重要的是有爸爸媽媽的愛與陪伴，讓毛毛放心入睡。整本書塑造一種規律性，由規律帶來安心與寧靜。[109]\n毛毛是你我身邊的任何一位小寶貝，他們好奇、敏感、想要探索世界、依賴爸爸或媽媽、純真可愛又有冒險精神"},{"id":"07ebb01a2e214f14bea0a7d8","n":"隨風飛揚的十片葉子","a":"默勒(Anne Möller)","d":"默勒(Anne Möller)","t":"劉孟穎","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864270187","dt":"104-09","pr":250,"desc":"秋風吹過，柳葉片片飄落，隨風飛揚。落在小溪上的葉子，成了蚱蜢的救生艇；掉在公園裡的黃葉，變成獨特的便條紙和美麗的壓花；落在柳樹下的葉子，就成了蚯蚓的美食和滋養大地的肥料。春天來了，柳樹上又是一片翠綠。《隨風飛揚的十片葉子》帶我們領略自然之美，進入生態循環的世界。"},{"id":"042cee78ae704bfb9fd2b45d","n":"我是公車司機","a":"草野滝","d":"間瀨直方","t":"黃惠綺","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863380825","dt":"104-09","pr":280,"desc":"百貨公司廣場停放一輛古董公車，小拓戴上司機帽化身為公車司機，行駛在有小動物的鄉間小路，一路上載著想摘花送給喜歡女孩的兔子，急著送太太下山生產的狐狸，要到鎮上車站的女孩⋯⋯，短短五分鐘的體驗，小拓歷經一場想像遊戲的奇妙旅程，咦！小拓口袋裡的橡實、松果和金幣是乘客的投幣嗎？"},{"id":"e7895564a9b24c8bb361eb11","n":"可以說晚安了嗎？","a":"喬里．約翰","d":"班傑．戴維斯","t":"李紫蓉","p":"","y":["105","109"],"ag":"0~3","c":"社會情緒","cl":false,"lo":false,"isbn":"9789863208167","dt":"104-09","pr":280,"desc":"大熊想睡覺，隔壁的鴨子卻接二連三找藉口上門，最後到底大熊能不能好好睡個覺？幽 默簡潔的對白，配上大熊和鴨子誇張的表情和姿態，非常討喜逗趣。 表面上是一隻熊和鴨子的故事，實際上是大人與不想睡覺的小孩的故事。[109]\n故事中精神抖擻的小白鴨與疲累有眼袋的大黑熊形成了強烈的對比及滑稽感。主角們喃喃自語的"},{"id":"8a77e29dde814c0ca6bc2caf","n":"阿婆的燈籠樹","a":"張秀毓","d":"張秀毓","t":"","p":"","y":["105","109"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":true,"isbn":"9789862115633","dt":"104-09","pr":280,"desc":"九月，山坡上金黃色的小燈籠，是迎接安安的禮物。 摘柿子、削皮、幫柿子按摩、鋪上棚架曬太陽⋯⋯回到鄉下幫阿婆曬柿餅，讓安安感受到豐收與分享的喜悅，也帶著看繪本的孩子認識臺灣獨有的人文美景。 繪本中用版畫深刻地刻劃出祖孫之間的情感，用飽滿溫暖的色彩讓讀者感受到溫馨和幸福。 新埔柿餅 - 專屬於臺灣人的文"},{"id":"ad41ae2726cf43f387482bc3","n":"敲一敲、搖一搖，魔法樹！","a":"克莉絲蒂．麥瑟森","d":"克莉絲蒂．麥瑟森","t":"李紫蓉","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863207573","dt":"104-08","pr":320,"desc":"打開《敲一敲、搖一搖，魔法樹！》，用手指在光禿禿的樹上輕輕點幾下、搖一搖、敲一敲，再對著樹呼呼吹、拍拍手，春夏秋冬的美景與生命繁衍的喜悅就像魔法一樣，隨著四季流轉在樹上不斷循環。這本遊戲互動書很適合親子共讀，只要發揮創意和想像力就能有千百種讀法，快和孩子一起體驗魔法樹的樂趣吧！"},{"id":"f858b48fa9c94b44a372679d","n":"蝴蝶","a":"江國香織","d":"松田奈那子","t":"米雅","p":"","y":["105","106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864000470","dt":"104-07","pr":270,"desc":"心靜下來的時候，五官就更敏銳了。跟著這隻蝴蝶四處遊走，當女孩的髮飾、感覺貓咪頭的柔軟、當一枚戒指、當鞋帶聞聞草地的香味；自己設想遊戲的時間與方式，不理會世界的擾嚷；以獨特的方式，品嘗黑夜和陽光。心靜下來，細細體驗這首詩，我們會聽到蝴蝶「甜美的嘆息」。"},{"id":"33054e630e6a4006ae129bd3","n":"小青和小蛙：好熱、好熱啊！","a":"岩村和朗","d":"岩村和朗","t":"米雅","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862742211","dt":"104-07","pr":280,"desc":"夏日是什麼？在岩村和朗的彩筆下，是「好熱、好熱啊！青蛙、農作物、雷陣雨與涼快！」兩個主角小青和小蛙的個性不同，一個醒覺積極，一個睡眼惺忪。為尋找涼快，小蛙跟著小青跳過一畦又一畦的農田，最後在芋頭葉上玩起滾水珠遊戲。"},{"id":"d666295511234da4af017c85","n":"偷偷看一下：夜晚","a":"安納．米爾布倫","d":"席夢娜．迪米特利","t":"臺灣麥克編輯部","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862036051","dt":"104-07","pr":320,"desc":"翻開書，假裝獲得夜晚探遊的機會，好好看看每天自己沉沉睡去時，還醒著的城市和大自然：麵包店飄出來的熱氣和香味、螢火蟲和路燈發出的不同光芒、青蛙的合唱、一節節火車裡各式各樣的「乘客」，市場裡等著和人群見面的花、蔬菜和水果-- 每頁都好看。翻頁的設計，使得這場「偷看」更加有滋味。"},{"id":"dd452505f673400292a7ae12","n":"我的一天","a":"信誼編輯部","d":"陳志賢","t":"","p":"","y":["109"],"ag":"0~3","c":"語言溝通","cl":false,"lo":true,"isbn":"9789861615196","dt":"104-07","pr":180,"desc":"正在學習說話的小小孩，需要成人提供豐富的詞彙與短句的練習。這本圖畫書敘述小小孩一天的生活經驗。成人可以透過指物命名的方式，帶著孩子指認書中圖畫的名稱，再唸讀短句。讓孩子可以經由成人重複的示範，慢慢累積自己的詞彙量，奠定日後語言能力的發展。"},{"id":"cc1e67e1acd34a20bf212608","n":"地瓜發芽了","a":"林柏廷","d":"林柏廷","t":"","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789570845952","dt":"104-07","pr":250,"desc":"猴小孩家的地瓜發芽了，阿公把它種在漂亮的花盆裡，爸爸為它釘了一個牌子，哥哥替它量身高，媽媽為它澆水，小狗陪它曬太陽，弟弟妹妹圍著它玩。阿嬤也沒閒著，她做了甜蜜蜜的拔絲地瓜和大家一起享用。屋裡的角落，老鼠家族也忙得好快活，鼠媽媽用地瓜做了酥酥脆脆的薯條，一家人吃得正香哪！"},{"id":"acaee359dddd4aff8d1507d5","n":"不可思議的吃書男孩","a":"奧立佛‧傑法(Oliver Jeffers)","d":"奧立佛‧傑法(Oliver Jeffers)","t":"柯倩華","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789571460239","dt":"104-07","pr":350,"desc":"亨利喜歡書。不過，他喜歡的方式跟你我不一樣！亨利喜歡吃書，字典、地圖集、笑話大全、知識百科全書，甚至數學書他都愛吃。最棒的是，他吃得越多，就越聰明。亨利想變成地球上最聰明的人，於是，他拼命地吃各種書，也變得更聰明。不料，糟糕的事發生了，一次胃痛之後，亨利學到的東西竟亂成一團⋯⋯。"},{"id":"15a2d14dea24499dba68fd0d","n":"鴨子的假期","a":"吉萊德．蘇法","d":"吉萊德．蘇法","t":"柯倩華","p":"","y":["105","106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864000258","dt":"104-06","pr":260,"desc":"鴨子去海邊，獨自坐在海灘椅，面對一片湛藍的大海，享受安靜的度假時光。不過美好的計畫起了變化，有人開始翻頁，打亂了鴨子的片刻寧靜。飛鳥空中撒尿、螃蟹攻擊他、遊客嬉鬧著，更糟糕的是還被海盜活捉，鴨子受夠了，匆匆結束假期。運用翻頁閱讀的動作串聯故事，營造讀者與故事主角的巧妙互動，創意十足！"},{"id":"959f2a7be4754d19a37d9bbe","n":"我的寶貝蛋","a":"艾蜜莉．葛拉菲特","d":"艾蜜莉．葛拉菲特","t":"郭恩惠","p":"","y":["105","106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862114827","dt":"104-06","pr":290,"desc":"故事中綠頭鴨撿到一個奇異的巨無霸蛋， 雖然大家都嘲笑在她眼中最寶貝的蛋，鴨媽媽仍滿懷期望的守候與等待小寶寶的來到。蛋殼終於裂了，蹦出意想不到的鱷魚寶寶，讓鴨媽媽滿心歡喜。裁切成大小不同的頁面設計讓這本小尺寸的硬頁書很適合小小孩把玩與探索。[106]\n所有的鳥兒都下了蛋，只有綠頭鴨沒有。 她找到一顆世"},{"id":"d163882b0a2445d68c469dd7","n":"叩叩叩，是誰呀？","a":"莎莉．葛林德列","d":"安東尼．布朗","t":"侯秋玲","p":"","y":["109"],"ag":"0~3","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789862115312","dt":"104-06","pr":280,"desc":"《叩叩叩，誰在敲門？》是一本幽默又符合孩子發展與興趣的繪本。小女孩和爸爸玩著角色扮演遊戲，一問一答的互動猜謎，盡情的發揮想像，猜猜門外的來者是誰？充滿了趣味的預測與溫馨的親子情。睡前親子共讀這本好書可以作為互道晚安的儀式，也是安撫孩子進入甜蜜夢鄉的好方法。"},{"id":"408c84c850024e598fe71434","n":"100 層的巴士","a":"麥克•史密斯","d":"麥克•史密斯","t":"侯秋玲","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862115336","dt":"104-06","pr":290,"desc":"每天的生活若一成不變是否會無聊到失去創意與包容心？故事中巴士司機突發奇想且付諸行動地載著乘客脫離了日常軌道，進行一個充滿趣味的冒險之旅。畫面中熱鬧非凡的場景包含了各種文化的特色與人們的精彩互動，大拉頁的設計帶給讀者驚喜與超出書本大小的宏觀視野。"},{"id":"e92cb37af8d347abb950c3c3","n":"小老鼠飛上天","a":"彼得‧霍拉賽克","d":"彼得‧霍拉賽克","t":"賴慈芸、陳玟馨","p":"","y":["109"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789577625717","dt":"104-06","pr":300,"desc":"這隻可愛的小老鼠，看見樹上掛著又紅又圓的東西，想方設法地想要拿到這個東西。找來了許多朋友幫忙，在共讀中，讓孩子跟著故事情節也進入想辦法的思考中。同時也認識了這些動物朋友的樣貌與能力。這是本親子一起共讀與對話的有趣圖畫書。"},{"id":"dd2ba88367454ebaabd5f9d6","n":"吉歐吉歐的皇冠","a":"岸田衿子","d":"中古千代子","t":"艾宇","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865863586","dt":"104-05","pr":280,"desc":"吉歐吉歐強壯又勇猛，牠是森林之王！動物們遠遠看見牠頭上那頂著亮晶晶的皇冠，就會偷偷躲起來。其實，吉歐吉歐對追逐斑馬或長頸鹿已經不感興趣。只是，一隻毛髮灰白，視力模糊的獅子還能做什麼？「吉歐吉歐國王，您看起來好像很不開心，不過，我也很不開心⋯⋯」小灰鳥對牠說。"},{"id":"66ae285af34b4ccdb94e3fce","n":"大吼大叫的企鵝媽媽","a":"尤塔‧鮑爾","d":"尤塔‧鮑爾","t":"賓靜蓀","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863980681","dt":"104-05","pr":270,"desc":"媽媽生氣、大聲吼叫，把小企鵝嚇得全身都快散掉了，小企鵝想要逃跑，想要喊救命⋯⋯書裡用簡單的文字、圖畫，卻可強烈的提醒父母，在孩子的世界裡，媽媽有多麼大的力量。只有媽媽的安慰才能幫小企鵝找回身心的完整與安寧。用這本書，跟孩子和好吧！"},{"id":"8a7842cd01fc493da685b00d","n":"夏日的一天","a":"秦好史郎","d":"秦好史郎","t":"周佩穎","p":"","y":["105","106","108","109"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789862742198","dt":"104-05","pr":280,"desc":"好熱的夏天！小男孩一個人跑過蟬聲唧唧、 跑過綠色田野、跑過好臭的牛棚⋯⋯一口氣跑到山裡，在林子裡尋找鍬形蟲。 這是一本文字簡潔，繪畫的張力更大於文字的繪本。蔚藍的天空，翠綠的田野，夏日的景、鳥、蟲、蛙⋯⋯盎然生動的充滿在頁面。 在翻開繪本的一頁頁之間，我感受到夏日的清新沁涼令人心情舒暢。[109]\n"},{"id":"9db1804240814571a8d92a1d","n":"我不跟你玩了","a":"珍妮絲梅尤德里","d":"莫里斯桑達克","t":"熊苓","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861896038","dt":"104-05","pr":220,"desc":"小朋友之間吵架是常有的事，因為搶第一、爭奪玩具或不經意的小玩笑，都能相互賭氣、鬧彆扭。但想想和好朋友一起歡度生日、分享好東西，都叫人回味。故事主角決定找朋友當面說清楚，說了要絕交，但一個轉念卻又和好了。故事反映孩子純真直率的特質，也引導孩子勇於表達內心的想法，自我解決問題。！這個故事詼諧中引發了值得"},{"id":"932402d6892f4765bea7189f","n":"晴天雨天幸福天","a":"朵琳．克羅寧","d":"雷娜塔．麗斯卡","t":"李紫蓉","p":"","y":["105","106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789577625724","dt":"104-05","pr":250,"desc":"蹦蹦、阿慢和飛飛，悠閒的坐在大樹下，迎接一天的開始。他們是好朋友，個性卻大不相同，蹦蹦活潑外向、飛飛心細而手巧、阿慢則顯得怡然自得。在面對周遭的變化，他們也表現出截然不同的生活態度。但無論是出太陽、颳大風或下大雨，只要大家能相互依靠著，就是最幸福的事情！"},{"id":"e88f00a6cefd4d37ad6baa34","n":"阿立會穿褲子了","a":"神澤利子","d":"西卷茅子","t":"米雅","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625762","dt":"104-05","pr":250,"desc":"阿立想要自己穿褲子，站著穿總是會摔倒，於是阿立光著屁股跑了出去，路上的小狗、小貓、小老鼠、牛兒、馬兒都嘲笑他光溜溜的屁股沒有尾巴！⋯⋯阿立最後學會了自己穿內褲，還穿著媽媽做的短褲向動物們炫耀！阿立是用什麼不會摔倒的穿褲子好方法呢？原來躺著穿就不會摔倒啦！"},{"id":"1fb2ac31511047dba3dc0e7c","n":"珍古錐老師和搗蛋精靈","a":"高樓方子","d":"高樓方子","t":"鄭淑華","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789570845556","dt":"104-05","pr":280,"desc":"全班認真打掃倉庫時，老師突然說出一些奇怪的話：請小朋友躺在地上裝死、做出怪怪的動作或是玩「擠饅頭」遊戲。小朋友全都開心配合，老師卻因為沒辦法說出想說的話而哭了起來。原來是「搗蛋精靈蹦蹦」跑到老師的喉嚨裡了。沒想到問題解決了之後，小朋友反而懷念起嘴巴裡有搗蛋精靈的老師了。你想知道這是怎麼一回事嗎？"},{"id":"c57276e9d5284749a25cb4db","n":"黑象與白象","a":"大衛．麥基","d":"大衛．麥基","t":"劉清彥","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865664145","dt":"104-04","pr":270,"desc":"這本書以隱喻、擬人化的寓言手法表現族群融合的議題，刺激孩子審視人際關係與個人的行為、態度。作、繪者善用圖畫書跨頁形式，表現出對立與和諧的局勢。故事的節奏、轉折及豐富性吸引人，開放式的結局增加想像與討論的空間，是適合激發孩子們思考接納與排斥，戰爭與和平的繪本。"},{"id":"535d4a9885f94a8e8467676e","n":"貝蒂好想好想吃香蕉","a":"史帝夫．安東尼","d":"史帝夫．安東尼","t":"柯倩華","p":"","y":["105","106","107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863980582","dt":"104-04","pr":280,"desc":"有一天，貝蒂的肚子餓了。她好想好想吃香蕉，但她不會剝開香蕉皮。她生氣得又哭又叫，兩隻腳踢上踢下。幸好，大嘴鳥先生來幫忙了，「你不需要這樣」，大嘴鳥先生一臉淡定的示範如何剝開香蕉皮，但是，當香蕉剝好了，貝蒂卻又生氣了，為什麼呢？[107]\n學步兒的自主剛開始萌芽，很多事都想自己來，只是他們的動機雖強，"},{"id":"9393f5e467d549aa99d1eb27","n":"拉拉去溜冰","a":"茉莉．艾德爾","d":"茉莉．艾德爾","t":"","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863206903","dt":"104-04","pr":360,"desc":"跟著拉拉去溜冰吧。在大片白色的冰上，拉拉邀請從洞裡探出頭來的企鵝共舞。每一幕裡，兩位舞者的動作曼妙，翻頁的設計，展現溜冰動作優雅流轉，冰下的魚群也以同樣的節奏共同移動，讓讀者同感迴旋。中場，小企鵝突然鑽入洞裡捕魚，拉拉為什麼卻皺起眉頭呢？跟著拉拉和企鵝去溜冰吧。"},{"id":"5f7ec2e3c88b4cbdbe820876","n":"狗狗好愛書","a":"露易絲‧葉慈","d":"露易絲‧葉慈","t":"黃筱茵","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863380603","dt":"104-03","pr":280,"desc":"狗狗好愛書，牠愛書的味道，愛摸書的感覺，只要和書有關的牠都愛。牠決定開一家自己的書店，書店開幕卻等不到愛書的顧客，於是牠獨自享受閱讀，展開一段又一段新的冒險，直到第一位客人走進書店。故事中的狗狗熱愛閱讀，也樂於與人分享好書，期望牠能成為小小孩的模仿對象，引領他們走進美好的閱讀世界。"},{"id":"9903a7f7f9214e8ca5f32308","n":"小藍和小黃","a":"李歐‧李奧尼","d":"李歐‧李奧尼","t":"彭懿 、楊玲玲","p":"","y":["105","106","107","109"],"ag":"0~3","c":"身體動作、認知探索、美感","cl":false,"lo":false,"isbn":"9789577625694","dt":"104-03","pr":250,"desc":"藍色顏料點點和黃色顏料點點是好朋友，他們一起上學，一起玩遊戲。當他們開心地抱在一起的時候，沒想到竟然變成綠色點點 了，連他們的爸爸媽媽也認不出自己的孩子來！直到小藍和小黃傷心地流下眼淚，變回原來的顏色⋯⋯猜猜怎麼樣？後來藍點點爸媽和黃點點爸媽也開心地互相擁抱了。[109]\n小藍和小黃是一對好朋友，當"},{"id":"9fe713b7eafc42358435cb7d","n":"蔬菜躲貓貓","a":"tupera tupera","d":"tupera tupera","t":"陳珊珊","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865811549","dt":"104-02","pr":320,"desc":"打開書名頁，一位穿著吊帶工作服，提著空菜籃的人走過來，原來是農夫要來收成囉！透過一問一答的重複句型「蔬菜，蔬菜，你是誰？」引導孩子觀察各種不同形狀的葉子，猜測摺頁下藏著什麼蔬菜？簡單的故事節奏，帶著孩子辨識土生土長的各類蔬菜。結尾時農夫帶著滿滿一籃子的蔬菜回家，孩子也想像著蔬菜能變出美味的菜餚呢！"},{"id":"6e2721dae1c64ac6906d7881","n":"咦！是誰呢？","a":"越野民雄","d":"高畠純","t":"陳珊珊","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865811808","dt":"104-02","pr":280,"desc":"我啊，長得很高、看得很遠，猜猜我是誰？我用鼻子洗澡、也用鼻子吃飯，猜猜我是誰？我喜歡顛倒看世界、白天很貪睡、晚上精神卻很好，猜猜我是誰⋯⋯一片深藍的神祕夜空，只看得到動物的身形和姿態，伴隨著動物的趣味描繪，猜一猜影像的主人究竟是誰呢？如果真的無法辨識，故事的結尾自會見分曉喔！"},{"id":"30f02c1b59d94d94a8f08fb4","n":"完美的正方形","a":"麥可・荷爾","d":"麥可・荷爾","t":"宋珮","p":"三之三文化","y":["105","106","107","108","109"],"ag":"3~5","c":"美感、身體動作","cl":true,"lo":false,"isbn":"9789865664138","dt":"104-02","pr":270,"desc":"每個形狀都有其特徵，正方形就是四個等邊、四個等角，方方正正的。但透過想像與創意，正方形也可以變身，變成許多有趣的圖案。這本圖畫書引導孩子進行美感領域的創作，親子間可經由共讀這本圖畫書，帶著孩子一起動手做出屬於自己的獨特作品。[109]\n這是一個完美的正方形。有四個相同的角，和四個相等的邊。 正方形既"},{"id":"1479d5030e4b4b6ba449a15d","n":"歷險","a":"艾隆．貝克","d":"艾隆．貝克","t":"","p":"","y":["109"],"ag":"3~5","c":"認知探索、語言溝通","cl":false,"lo":false,"isbn":"9789864000067","dt":"104-02","pr":280,"desc":"這是一本沒有文字的圖畫書，小讀者透過圖畫的線索，一步步地進入神秘的王國，跟著書中的男孩與女孩一起歷險與解決難題。在親子共讀的過程中，成人可以引導孩子成為說故事的人。經由孩子的眼光，看見故事中的情節與樣貌。此外，成人適時的提問，還可以讓孩子敘述的故事更加豐富、精彩與有趣。"},{"id":"1a7fe18224364afba60955a4","n":"浴缸變小了！","a":"郝廣才","d":"村上仁美","t":"","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789861895727","dt":"104-02","pr":280,"desc":"什麼是長大？從發現腳踏車變小，騎車時膝蓋頂到手把，浴缸變小，洗澡時塑膠鴨滿溢出來，到覺察衣褲變小，鞋襪穿不下，原來是長大了！窗外的景象透露了小孩和小狗隨著季節轉變都長大了，小狗的家也從小紙箱搬到戶外的大狗屋，長大以後，有新的衣褲鞋襪，連玩的遊戲也都不一樣了喔！"},{"id":"5fa5c459c5334c058c7d68d5","n":"我長大了: 幫你的小恐龍洗澡","a":"珍．克拉克","d":"喬治雅．博琪","t":"黃筱茵","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863980025","dt":"104","pr":220,"desc":"髒兮兮的小恐龍不想要洗澡，這該怎麼辦？來做一缸滿滿都是泡泡的洗澡水，把橡皮鴨、噴水魚放進水裡，也把小恐龍放進水裡。吹泡泡啵、啵、啵，小恐龍笑呵呵，搔搔癢，洗澡真好玩！透過小小生活練習曲，你也可以在遊戲中幫孩子養成生活自理的好習慣唷。"},{"id":"ee4f969453db43a1957f95a7","n":"小象的雨中散步","a":"中野弘隆","d":"中野弘隆","t":"林真美","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863980087","dt":"104","pr":260,"desc":"不會游泳的小象，想和好朋友們一起去池塘裡散步，該怎麼辦呢？大家想了一個好辦法，讓小象站在小河馬的背上，小河馬站在小鱷魚的背上，小鱷魚站在小烏龜的背上，可是，這樣疊羅漢去散步，真的沒問題嗎？"},{"id":"4b0b2290a10542798eeb05ef","n":"露露上廁所──完成如廁訓練的遊戲操作書","a":"卡蜜莉亞‧里德","d":"艾莉‧巴斯畢","t":"李貞慧","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863423881","dt":"104","pr":280,"desc":"露露的媽咪買了個專屬馬桶給她，她很喜歡小馬桶，到哪裡都坐著它。你可以幫露露穿尿布，拉拉衛生紙、摸摸小馬桶&hellip;&hellip;現在，露露學會自己上廁所了，猜猜她在廁所發現什麼好玩的東西呢？"},{"id":"faa9b2226e2f45979ef634fa","n":"一直一直往下挖","a":"麥克．巴奈特","d":"雍．卡拉森","t":"林良","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862419359","dt":"104-12","pr":320,"desc":"兩個好朋友，山姆和大衛，帶著小狗一起去挖寶，大衛說：「不挖到奇妙的東西，我們就不停手。」他們一下子往下挖、一下子往右挖，一下子分開挖，一下子一起挖，卻總是和目標失之交臂。挖啊挖啊，地面崩塌了！他們不停的往下掉、往下掉&hellip;&hellip;與孩子一同經歷一場奇幻、妙趣的挖寶之旅。"},{"id":"efec59d93f9f4fcf9395b8fb","n":"長大!","a":"提姆‧霍普古德","d":"提姆‧霍普古德","t":"黃筱茵","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862115176","dt":"104","pr":290,"desc":"你想長大嗎？跟熊一樣大嗎？還是跟大象一樣大？《長大！》讓你與孩子一起分享小男孩渴望長大、長大、再長大的興奮與煩惱。"},{"id":"885af6685a23415d975ae6d2","n":"再一遍","a":"艾蜜莉．葛拉菲特","d":"艾蜜莉．葛拉菲特","t":"沙永玲","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862114742","dt":"104","pr":320,"desc":"小火龍賽瑞克的睡覺時間到了。他吃完點心、喝完奶、刷好牙、洗好澡，等著火龍媽媽讀故事書給他聽。故事書裡的小火龍跟他好像好像，所以他想要再聽一遍、一遍又一遍&hellip;&hellip;可是，火龍媽媽越說越簡短、越說越想睡&hellip;&hellip;賽瑞克越來越生氣，身體也越變越紅&hellip;"},{"id":"a34385d1f33e4b4c81da3afa","n":"偷偷看一下：農場","a":"安納．米爾布倫","d":"歐嘉．德米多娃","t":"臺灣麥克編輯部","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862036136","dt":"104-07","pr":320,"desc":"從封面開始，一輛拖曳機載著一位男孩和小狗，行駛在森林步道中，而有一隻公雞正在樹叢中偷看著他們。在一個有別於都市景觀的畫面當中，我們將被帶領進入充滿大自然氣息的農場！一窺農場的面貌，在看完了這本關於農場的翻翻書，你可以去試著當個小小農夫、也能去農場體驗看看這些美好的景色喔！"},{"id":"b4ddee863f854f248f2bd4df","n":"我長大了","a":"宗玉印","d":"陳麗雅","t":"","p":"","y":["106","108"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789862035405","dt":"104-01","pr":360,"desc":"在翻頁之間發現大驚奇你知道小小的種子可以長成什麼嗎？蝌蚪如何變青蛙？雞蛋如何長成母雞呢？這本好玩的翻拉書，讓小朋友透過自己動手操作了解動植物和人類是如何長大的，兼具遊戲和認知，還有重複、好念的句子，讓小朋友邊玩邊學習，是本寓教於樂的魔法書喔！[108]\n小小的種子長大以後會變成什麼？一顆透明的卵如何"},{"id":"a07e9c8f86a8406d93a8f579","n":"你看不見我！(紙板翻翻書)","a":"朱里安諾","d":"朱里安諾","t":"","p":"","y":["105","106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861896083","dt":"104-01","pr":280,"desc":"大大的圓耳朵，棕色的毛，咦？是誰呢？黑黑的蹄子，圓滾滾的身體，還有捲曲的尾巴，咦？這又是誰呢？《你看不見我！》以猜猜看和動手翻書的方式，引導小小孩從書頁中出現的耳朵、鼻子、嘴巴、手掌（或翅膀）等特徵，在遊戲中找線索，輕鬆認識各種動物。[106]\n躲貓貓，真好玩，你看不見我，猜猜我是誰？打開左手看一看"},{"id":"0ea8c1301c964c78802d19a4","n":"就快了","a":"提摩太‧奈普曼","d":"派克．賓森","t":"林瑋、\r\n林良審閱","p":"上誼文化","y":["105","106","107","108","109"],"ag":"0~3","c":"","cl":true,"lo":false,"isbn":"9789577625656","dt":"104-01","pr":280,"desc":"這是一本描述親子間溫暖、信任關係的圖畫書。在象媽媽為小象安排的一趟親子旅行中，讓小象經歷許多的第一次。面對新的事物，孩子難免膽怯，也會有害怕的情緒。象媽媽穩定又溫暖的回應，讓小象能持續跟著媽媽一起往前走。「就快了」讓孩子能獲得些安慰，也鼓勵孩子持續往前。[109、110]\n一大清早，天氣冷颼颼，象媽"},{"id":"fa258a85e5794f9db06ae7b8","n":"再過10分鐘就睡覺","a":"佩琪．芮士曼","d":"佩琪．芮士曼","t":"信誼編輯部","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789577625748","dt":"104","pr":280,"desc":"睡前10 分鐘，刷牙、洗澡、換睡衣、聽故事&hellip;&hellip;小男孩還有好多事沒做呢！就在此時，一群倉鼠突然造訪，準備展開睡前10 分鐘的旅行！在爸爸的倒數聲中，小男孩背著爸爸，焦急又興奮地等待一大車隊的動物朋友們光臨他的房間&hellip;&hellip;他能一邊接待倉鼠，一邊完成睡前"},{"id":"8c372fcacf4648baaf3273e0","n":"123 到台灣","a":"陳盈帆","d":"陳盈帆","t":"","p":"","y":["106","108","109"],"ag":"0~3","c":"認知探索","cl":false,"lo":true,"isbn":"9789570845099","dt":"104-01","pr":250,"desc":"「123 到台灣，台灣第 1 高是玉山，還有日月 2 個潭，3 隻獼猴樹上站，4 盆花兒真好看」，簡單有趣的念謠，配上臺灣的特色景物，可以帶孩子認識周遭。最後拉頁還有各行各業的 99 個人，表現臺灣的豐富性。[109]\n123 到台灣，臺灣真是一個寶島。 以歌謠與數字作為聯結， 將臺灣的好風光，好人"},{"id":"a24052d4fc79466c98ec229c","n":"小雞大冒險","a":"安娜‧沃克","d":"安娜‧沃克","t":"李貞慧","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789570846263","dt":"104-01","pr":300,"desc":"佩姬在小鎮過著恬靜安逸的生活。某日，一陣強風橫掃雲朵，颳起樹葉、細枝，也把佩姬吹到離家好遠地方。穿過擾嚷的人群，佩姬東晃晃西看看，感覺一切都好新奇。一個溫暖舒適、似曾相識的地方，讓佩姬想家了。佩姬好想家，在匆忙的人群中，牠看到熟悉的向日葵，於是便跟著向日葵上了火車⋯⋯。"},{"id":"a01a124ee3e34b078f8349a5","n":"蘿西最美好的一天","a":"蘿拉‧瑞金 Laura Rankin","d":"蘿拉‧瑞金 Laura Rankin","t":"柯倩華","p":"","y":["104"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789575749804","dt":"103-12","pr":280,"desc":""},{"id":"d98c00f74ed14541966907fc","n":"那天來的鯨魚","a":"班傑．戴維斯","d":"班傑．戴維斯","t":"郭妙芳","p":"","y":["106","107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865876159","dt":"103-11","pr":280,"desc":"諾伊的爸爸在漁船上工作，每天早出晚歸，陪伴他的只有六隻貓。暴風雨後的清晨，諾伊在沙灘上發現一隻擱淺的小鯨魚，他把牠帶回家，盡一切努力想讓牠有家的感覺。天黑了，諾伊好擔心爸爸知道浴缸裡有隻鯨魚會生氣，他整個晚上小心翼翼地謹守著祕密，偷偷給鯨魚送晚餐，但是⋯⋯。"},{"id":"12bae614c0854f8fb331cec0","n":"鳥兒的家","a":"何華仁","d":"何華仁","t":"","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789862114797","dt":"103-11","pr":270,"desc":"春天到了，鳥爸爸、鳥媽媽為了迎接鳥寶寶的出生，開始布置安全的家。赤腰燕、臺灣藍鵲、小啄木、小鷿鷈、翠鳥、白眉燕鷗、小環頸鴴，這些鳥兒的家在哪裡呢？這本情節重複模式的問答互動書，開啟孩子觀察本土鳥類生活環境的大門。"},{"id":"7452f4533e2b4e3cbbd1179e","n":"我是推土機","a":"三浦太郎","d":"三浦太郎","t":"張玲玲","p":"","y":["105"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861895307","dt":"103-11","pr":280,"desc":"小男孩在沙坑裡蓋大城堡，先要收集好多沙子，他是推土機；接著壓平沙子，他就是壓路機；現在要挖洞，他是挖土機；慢慢拿起桶子，他就是起重機；把水倒進去，他又是水罐車；城堡終於蓋好了，現在換爸爸當堆高機帶他回家。玩沙遊戲真有趣，任由孩子發揮想像，將自己幻化成各種工程車，玩得有模有樣。"},{"id":"eeeb61faae59483da1802392","n":"遲到的理由","a":"姚佳","d":"姚佳","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861615103","dt":"103-11","pr":250,"desc":"小豬最害怕遲到了，真的、真的！但是這天，小豬起晚了，該怎麼辦呢？他靈活地轉動大腦：「刷牙刷太久？」不行，這是大嘴巴鱷魚同學的理由；「圍巾圍很久？」不！這是長脖子長頸鹿同學的理由⋯⋯「怎麼辦？老師會相信哪一個呢？」說謊是很辛苦的，當小豬鼓起勇氣，說出「實話」時，連讀者都會跟著他一起舒了一口氣！"},{"id":"9a93f45b8eb54ba79e8fb8a8","n":"大象大象去郊遊","a":"王文華","d":"六十九","t":"","p":"巴巴文化","y":["105"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869033459","dt":"103-09","pr":280,"desc":"這天，是大象一家走出動物園，一起去郊遊的日子，他們要去看海。搭不成捷運和公車的大象一家，反而載著乘客，打算悠閒散步到海邊。能讓大象載著，一起漫步，真是奇特的經驗啊。現代感十足的圖像，讓我們看見這一天更多美好的意外，格外有滋味。"},{"id":"a770c5652ce84fdb9aaa42fc","n":"口袋洋裝","a":"土田伸子","d":"土田伸子","t":"盧本文","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862114506","dt":"103-09","pr":280,"desc":"穿著媽媽親手做的，有10個口袋的蛋黃色洋裝的小波娃，開心地想著：口袋裡要裝什麼呢？到森林裡散步的她，歡迎一隻隻小動物進到口袋裡來。松鼠、兔子、蜥蜴、小鳥和刺蝟都待在口袋裡了。小熊也想進去口袋，小波娃嚇壞了，哭著跑回家找媽媽。媽媽又開始車起東西來，創造一個大家都歡喜的結局。就此些，本書給了很好的演繹！"},{"id":"a67f2686583b41dcb927e9b3","n":"馬諦斯的剪刀","a":"貞娜‧溫特","d":"貞娜‧溫特","t":"","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789866049644","dt":"103-08","pr":280,"desc":"這本書言簡意賅，以切合傳記主角藝術風格的插畫，將野獸派的創始藝術家馬諦斯介紹給大家，很適合孩子或對這位藝術家不熟的讀者去瞭解他。內容描述馬諦斯如何在他熱愛的藝術道路上堅持不懈，發展出獨特的藝術表現方式，讓藝術始終充實他的人生且影響到喜愛他的人。"},{"id":"4c820d3cb0884197a0f5eae0","n":"小小的也很好","a":"強納森‧班特利","d":"強納森‧班特利","t":"呂行","p":"","y":["104"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863380399","dt":"103-08","pr":280,"desc":""},{"id":"4c1045400c164b0ca02c6f4d","n":"誰笑嘻嘻？","a":"松谷美代子","d":"瀨川康男","t":"沈晨音","p":"","y":["104"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862035610","dt":"103-08","pr":320,"desc":""},{"id":"b214e7298ec74b6c82d3b3f0","n":"這是誰的腳踏車","a":"高畠純","d":"高畠純","t":"米雅","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862741580","dt":"103-07","pr":280,"desc":"如果動物都會騎腳踏車，那麼，你能看著腳踏車猜出主人是誰嗎？鱷魚的腳踏車像他的身體那麼長，大象的腳踏車要有特製的輪子和一整桶的水。在地洞裡移動的鼴鼠，他的腳踏車需要什麼裝置呢？毛毛蟲、鴕鳥、蛤蟆的腳踏車又會是什麼模樣？我們一起看著圖猜猜看吧。"},{"id":"03b254147bf64081a9d78757","n":"還記得","a":"妮娜．雷登","d":"雷娜\r\n塔．麗斯卡","t":"柯倩華","p":"","y":["104"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866215315","dt":"103-06","pr":280,"desc":""},{"id":"d51e7554139e42cb951f8328","n":"只有一點點","a":"瀧村有子文;圖;譯","d":"鈴木永子","t":"米雅","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862741566","dt":"103-06","pr":280,"desc":"小寶寶出生，小娜當姊姊了！媽媽忙著照顧小寶寶，所以小娜要一點一點地獨立。小娜學著自己倒牛奶、扣扣子、綁頭髮、盪鞦韆，竟然都有一點點的成功，小娜眼睛閃爍著「我會了」的成就感。當小娜累了，要求媽媽抱她一點點時，出乎意料，媽媽回以深深長長的擁抱！"},{"id":"ac37f524a8724c2797b38fcd","n":"我們相親相愛","a":"米津祐介","d":"米津祐介","t":"桃樂絲","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861894416","dt":"103-06","pr":220,"desc":"這本運用鏤空及拆解組合設計的硬頁小書，帶出不斷的驚喜與溫馨感受，非常適合小嬰兒把玩。簡單的內容饒富創意與趣味，可以鼓勵孩子在反覆觀察操作中，學習認識顏色、物體名稱及形狀造型。親子共讀時可以玩預測、想像及看圖說故事的遊戲，也別忘了給孩子來個大大的擁抱。"},{"id":"91c74d6a7cc143ee8c3413f0","n":"有一天","a":"艾莉森．麥基","d":"彼德．雷諾茲","t":"張淑瓊","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862418697","dt":"103-05","pr":260,"desc":"媽媽對著小寶貝輕聲地呢喃著、呵護著，引領著她探索世界，享受著親子親密互動的幸福氛圍。媽媽想像著⋯⋯有一天女孩長大也必須面對人間的酸甜苦澀與悲歡離合，有一天女孩長大也會成為孕育下一代的媽媽，有一天女孩也會逐漸年華老去，而自己終究成為女孩腦海中的回憶，有一天⋯⋯。"},{"id":"a0f5a0488c184bb18fc5f047","n":"小熊的小船","a":"伊芙．邦婷","d":"南西‧卡本特","t":"劉清彥","p":"","y":["104"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863380269","dt":"103-04","pr":280,"desc":""},{"id":"a5acee84141c4972a5ced84d","n":"睡吧!像老虎一樣","a":"瑪麗．羅格","d":"潘蜜拉．札格倫斯基","t":"宋珮","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863204381","dt":"103-04","pr":300,"desc":"面對不想睡覺的孩子，睿智的父母使用尊重的態度予以引導，並耐心地鼓勵其天馬行空的想像。當孩子做好一切入眠前的準備，並確保想像的玩伴都安穩地入睡後，孩子也放心舒適地進入夢鄉。這本書的拼貼圖像精緻、夢幻，與旋律優雅，富含詩韻的文本共同譜出優美的晚安曲。"},{"id":"45b5ae948e43449487156ea1","n":"神探狗汪汪","a":"林秀穗","d":"廖健宏","t":"","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789861614793","dt":"103-04","pr":250,"desc":"1235678910，鴨媽媽的小寶貝不見了，找了神探狗汪汪和助理花生米來幫忙，河馬說小鴨鴨跟著穿紅色斗篷的走了，穿紅色斗篷的小兔子說斗篷是用黃色的壺換來的，拿黃色壺的大猩猩說小鴨鴨跟一個吹笛子的樂手走了⋯⋯，猜猜看小鴨鴨到底跑到哪裡呢？每一頁都在考驗觀察力和推理能力喔！"},{"id":"199c781416ac4ac3beadbf3d","n":"因為就是這樣","a":"阿涅絲‧拉侯許","d":"史黛凡妮‧奧古斯歐","t":"李旻諭","p":"","y":["105"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789570843781","dt":"103-04","pr":280,"desc":"面對爸媽的問題，尼可丹姆總是回答：「因為就是這樣呀！」這次換成爸媽也這麼回答他，引起尼可丹姆懷疑爸媽或許不愛他了⋯⋯故事反映出孩子的生活經驗，能夠引起共鳴，並進一步瞭解溝通時雙方的感受，與清新及刻意留白的畫面互補，能引發孩子思考有效的溝通方式。"},{"id":"9812269477a4467ea6e192fe","n":"別讓鴿子開公車！","a":"莫．威樂","d":"莫．威樂","t":"江坤山","p":"","y":["104"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789863204077","dt":"103-03","pr":280,"desc":""},{"id":"d0c86f11af0e4a1aa768c7b6","n":"1,2,3 到動物園","a":"艾瑞．卡爾","d":"艾瑞．卡爾","t":"","p":"","y":["104","105","106","107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625540","dt":"103-03","pr":250,"desc":"嘟&mdash;嘟&mdash;七恰七恰，火車要出發囉！上面載了什麼呢？第一節車廂，有1 隻大象。第二節車廂，有2 隻河馬。第三節車廂，有3 隻⋯⋯。1 隻大象、2 隻河馬、3 隻⋯⋯，嘟&mdash;嘟&mdash;七恰七恰，大家都到動物園囉！帶著你的寶寶找找看獅子住在哪裡？數數看有幾隻鳥兒，一起"},{"id":"4c12cfdc8f9848fc98756121","n":"不要打翻牛奶！","a":"史戴芬‧戴維斯","d":"克里斯多福‧柯爾","t":"馬筱鳳","p":"","y":["106","107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866049583","dt":"103-02","pr":280,"desc":"潘達自告奮勇，要代媽媽送牛奶給在草原區顧羊的爸爸。她頭頂著一碗牛奶，繞過山丘、越過大河、爬上山頭，還抵抗面具舞、白色長頸鹿的誘惑，並時常惕勵自己勿打翻牛奶。她最後可以成功把牛奶送達嗎？本書押韻的文本，多彩的景致，宛如一趟非洲風光之旅。[107]\n小女孩潘達自告奮勇代替媽媽送牛奶給在草原區照顧羊群的爸"},{"id":"afcedbcb1ff74f89afe326eb","n":"喀噠喀噠喀噠","a":"林小杯","d":"林小杯","t":"","p":"","y":["105","108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789866049668","dt":"103-08","pr":280,"desc":"小女孩最喜歡的洋裝、小包包，都是阿嬤做的，甚至她想要一個裝恐龍的大袋子， 阿嬤也答應她，因為阿嬤有一個很厲害、 會發出喀噠喀噠喀噠聲音的大玩具。有一天，阿嬤幫小女孩做表演的戲服時，大玩具卻壞掉了！阿嬤要怎麼完成重要的任務呢？[108]\n聽著縫衣機傳出一聲聲喀噠喀噠喀噠，小孫女總能安心又充滿期待地感受"},{"id":"918333fb657247a0a76788be","n":"我剛出生的時候","a":"伊莎貝爾‧米荷絲‧馬汀斯","d":"馬達琳娜．馬杜索","t":"黃筱茵","p":"","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865876166","dt":"103-12","pr":280,"desc":"我剛出生的時候，什麼東西都沒看過，只看過媽媽肚子裡的一片漆黑。我剛出生的時候，沒看過太陽，沒看過花朵，我不認識任何人，也沒有人認識我&hellip;&hellip;所有的孩子都喜歡知道他們是如何來到這個世界上的，本書將帶領孩子一起經歷他們來到這個世界上的冒險&hellip;&hellip;。"},{"id":"c90683686dc94577a1d154b9","n":"拉拉跳芭蕾","a":"茉莉．艾德爾","d":"茉莉．艾德爾","t":"","p":"","y":["106","107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789863205777","dt":"103-01","pr":360,"desc":"以一段美麗的舞蹈串起小女孩與紅鶴的友情無事字翻翻書。作者巧妙的運用小翻頁與大拉頁設計，讓讀者在翻閱的同時，彷彿隨著主角們翩翩起舞。書中美麗的插畫 與舞蹈如行雲流水般契合，帶給讀者富含藝術與旋律美感的閱讀新感受。[108]\n這本優雅的無字翻翻書，以一段美麗的舞蹈串起小女孩與紅鶴的友情。作者巧妙的運用小"},{"id":"19b0bc17982147ecb0d68ae2","n":"香蕉的祕密","a":"許玲慧","d":"鄭淑芬","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789862741344","dt":"103-02","pr":280,"desc":"從日本回到臺灣的小表妹，第一次吃到不用沾蜂蜜就又香又甜的香蕉。但是香蕉皮很快地長出黑點，不能吃了嗎？這你就搞錯囉！黑點可是香蕉成熟的暗號呢！本書介紹香蕉的生長過程、香蕉的營養及好處、還有香蕉的採收、產銷過程，為你完整解開香蕉的祕密。"},{"id":"1f73fb29af4e4b5caedb98de","n":"猜猜我是誰?","a":"松谷美代子","d":"岩崎知弘","t":"康冬誼","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862035924","dt":"103","pr":320,"desc":"鈴鈴鈴，鈴鈴鈴，什麼東西在響？一大早是誰打電話呢？「喂喂喂，我是小桃，還想再多睡一下。」小桃睡眼惺忪的接電話，沒想到，是太陽公公打來的！而且，除了太陽公公，小鴨子、蝴蝶也都打電話來了。起床囉！小桃！"},{"id":"901afda29da947eba515c2e1","n":"洗澡啦！","a":"松谷美代子","d":"岩崎知弘","t":"康冬誼","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862035917","dt":"103-09","pr":320,"desc":"小鴨鴨，你要去哪兒？小鴨鴨帶著毛巾、肥皂，正要去一個可以洗乾淨的好地方，「洗澡」是小朋友非常熟悉的主題。有人喜歡喜澡，有人不喜歡洗澡，讓我們一起跟著小鴨鴨，重拾洗澡的樂趣！"},{"id":"5316bf99ccd042aa8d422743","n":"哇，不見了","a":"松谷美代子","d":"瀨川康男","t":"康冬誼","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862035603","dt":"103-08","pr":320,"desc":"不見了，不見了，小貓不見了&hellip;&hellip;，每翻開一頁就會令人驚奇的逗趣表情，惹得孩子呵呵大笑，生動又傳神的呈現孩子喜歡玩躲貓貓的遊戲，讓孩子在邊玩邊讀中建立「物體恆存」的概念，對物體憑空的神奇出現感到興奮不已，寶寶非常喜歡這樣玩遊戲似的神奇經驗，這是幼兒在認知發展上很重要的學習喔！"},{"id":"2740c0a63b9a43408c0272bf","n":"月亮出來了！","a":"林明子","d":"林明子","t":"陸崇文","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862034767","dt":"103","pr":320,"desc":"夜、貓、月、雲&hellip;&hellip;在夜晚構成了一幅動人的夜色，帶出夜晚寧靜的氛圍。兩隻柔軟、輕巧的貓兒，你一句我一句的給夜晚增添了一些聲音。簡單明白又雋永的文字是幼兒繪本最難詮釋和表達的，但《月亮出來了！》卻以高水準的文、圖，將夜色裡的意境完美呈現。"},{"id":"06398ef3444f4b47831d3af8","n":"哇哇大哭","a":"","d":"","t":"","p":"","y":["99"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862034712","dt":"103","pr":"","desc":""},{"id":"ff9c0dea9e0a4016a6cb7e0a","n":"小雨滴──給0~3歲的律動兒歌","a":"李紫蓉、鄭榮珍、張麗雪（作詞）；蘇珊、陳中申、張硯田（作曲）","d":"何耘之、林小杯","t":"","p":"信誼基金","y":["104","106","107"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789861614779","dt":"103-01","pr":280,"desc":"「小車來，大車來，遇到紅燈排一排&hellip;...」八首貼近生活的律動兒歌，輕快的節奏， 能朗朗上口，滿足孩子喜歡說說唱唱的欲望，並增進他們的語文敏感度，豐富他們的語彙表達力。邊唱邊律動，還能幫助孩子的大肢體發展。[107]\n和小寶寶一起唱唱跳跳好快樂！唱什麼歌呢？先來一首小雨滴「滴答答，滴答答"},{"id":"3d1ebbfeb3f84d329c19128c","n":"花貓帽","a":"李紫蓉等","d":"何耘之","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789861615059","dt":"103-01","pr":280,"desc":"和孩子一起唱唱和和、玩玩遊戲真開心！來段繞口令吧！花貓帽、蜜蜂釀蜜、糖葫蘆串兒、麋鹿迷路⋯⋯一首接一首，好不快樂呀！來吧！和寶貝一起發揮天馬行空的創意，把文字以幻化為形狀與聲音，變成玩個千遍也不厭倦的好玩遊戲，一起感受咬文嚼字的美好時光。"},{"id":"2b1e635dc1c9436fb4c61364","n":"加油！熊醫生","a":"木村裕一","d":"木村裕一","t":"","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625601","dt":"103-01","pr":260,"desc":"動物村裡有一間熊熊診所，不管喉嚨痛、肚子痛、鼻子痛，請都別擔心，熊醫生會替所有身體不舒服的小朋友看病喔！本書利用有趣的軋型翻頁，讓孩子反覆模擬看醫生的情境，了解常見的疾病及檢查方法，舒緩孩子就醫的緊張情緒，並落實生活中的衛生保健。"},{"id":"d1394a74183c42a58283588a","n":"這是我的！這是我的！","a":"米歇爾．凡．傑弗恩","d":"米歇爾．凡．傑弗恩","t":"周婉湘","p":"","y":["105","107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625571","dt":"103-07","pr":220,"desc":"小青蛙在叢林裡撿到一顆蛋，他開心地抱著蛋說：「這是我的！」沒想到蛇和老鷹也說：「這是我的！」，到底這顆蛋是誰 的呢？作者將對生活的敏銳洞察力及想像力轉為幽默、輕鬆的故事，能和孩子細細探討搶奪、貪心、責任等議題，擁有不一樣的思考力！[108]\n小青蛙發現一顆蛋，他開心地說：「啊哈！ 這是我的！」沒想到"},{"id":"67688782048a4313bb3f8458","n":"到底是哪一個？","a":"儘田峰子","d":"儘田峰子","t":"上誼編輯部","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625496","dt":"103","pr":160,"desc":"翻開書頁，蘋果和穿山甲「哪一個是圓的？」，蘋果！被啃到只剩一點的蘋果和捲成球狀的穿山甲，哪一個才是圓的呢？《到底是哪一個？》作者以幽默的方式讓幼兒在書中學到大小、高低、快慢、顏色、形狀&hellip;&hellip;等認知概念，也能想一想、猜一猜，感受到思考的樂趣。"},{"id":"7125f686d09d4bfcbbbf5bcc","n":"一起去遠足","a":"小竹守道子 function enc(s){return encodeURIComponent(s)}

function links(b){
  const isbn=b.isbn;
  const name=b.n;
  let html='';
  if(isbn)html+=`<a class="act act-lib" href="https://cis2.ntl.edu.tw/search/?query_term=${enc(isbn)}&query_field=issn_isbn" target="_blank" rel="noopener">圖書館借閱</a>`;
  if(isbn)html+=`<a class="act act-books" href="https://search.books.com.tw/search/query/key/${enc(isbn)}" target="_blank" rel="noopener">博客來</a>`;
  html+=`<a class="act act-momo" href="https://www.momoshop.com.tw/search/searchShop.jsp?keyword=${enc(name)}" target="_blank" rel="noopener">momo</a>`;
  html+=`<a class="act act-eslite" href="https://www.eslite.com/Search?keyword=${enc(name)}" target="_blank" rel="noopener">誠品</a>`;
  html+=`<a class="act act-pchome" href="https://ecshweb.pchome.com.tw/search/v4.3/?q=${enc(name)}" target="_blank" rel="noopener">PChome</a>`;
  html+=`<a class="act act-yt" href="https://www.youtube.com/results?search_query=${enc(name+' 繪本 共讀')}" target="_blank" rel="noopener">YouTube</a>`;
  return html;
}

const searchBox=document.getElementById('searchBox');
const yearFilter=document.getElementById('yearFilter');
const catFilter=document.getElementById('catFilter');
const threadsCatFilter=document.getElementById('threadsCatFilter');

const resultCount=document.getElementById('resultCount');
const resetBtn=document.getElementById('resetBtn');
const subtitle=document.getElementById('subtitle');
const pccrFiltersEl=document.getElementById('pccrFilters');
const threadsFiltersEl=document.getElementById('threadsFilters');

let currentSource='pccr';
function getActiveBooks(){return currentSource==='threads'?THREADS_BOOKS:BOOKS}

let filters={search:'',age:'',year:'',cat:'',origin:'',classic:false};

function setupPills(containerId,filterKey){
  const container=document.getElementById(containerId);
  container.addEventListener('click',e=>{
    const pill=e.target.closest('.pill');
    if(!pill)return;
    if(filterKey==='classic'){
      pill.classList.toggle('active');
      filters.classic=pill.classList.contains('active');
    }else{
      container.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
      filters[filterKey]=pill.dataset.val;
    }
    render();
  });
}

setupPills('ageFilter','age');
setupPills('originFilter','origin');
setupPills('classicFilter','classic');
setupPills('threadsAgeFilter','age');

searchBox.addEventListener('input',()=>{filters.search=searchBox.value.trim().toLowerCase();render()});
yearFilter.addEventListener('change',()=>{filters.year=yearFilter.value;render()});
catFilter.addEventListener('change',()=>{filters.cat=catFilter.value;render()});
threadsCatFilter.addEventListener('change',()=>{filters.cat=threadsCatFilter.value;render()});

function resetFilters(){
  filters={search:'',age:'',year:'',cat:'',origin:'',classic:false};
  searchBox.value='';
  yearFilter.value='';
  catFilter.value='';
  threadsCatFilter.value='';
  document.querySelectorAll('.pill').forEach(p=>{
    if(p.dataset.val==='')p.classList.add('active');
    else p.classList.remove('active');
  });
}

resetBtn.addEventListener('click',()=>{resetFilters();render()});

document.querySelectorAll('.source-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.source-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentSource=tab.dataset.source;
    resetFilters();
    pccrFiltersEl.style.display=currentSource==='pccr'?'':'none';
    threadsFiltersEl.style.display=currentSource==='threads'?'':'none';
    subtitle.textContent=currentSource==='threads'
      ?'Threads 社群推薦書單 — '+THREADS_BOOKS.length+' 本'
      :'教育部 / 國立臺灣圖書館 嬰幼兒閱讀推廣計畫 — 歷年入選好書 '+BOOKS.length+' 本';
    render();
  });
});

function matchBook(b){
  if(filters.search){
    const s=filters.search;
    const fields=[b.n,b.a||'',b.p||'',b.t||'',b.d||'',b.note||'',b.cat||''];
    if(!fields.some(f=>f.toLowerCase().includes(s)))return false;
  }
  if(filters.age&&b.ag!==filters.age)return false;
  if(currentSource==='pccr'){
    if(filters.year&&!b.y.includes(filters.year))return false;
    if(filters.cat&&!b.c.includes(filters.cat))return false;
    if(filters.origin==='local'&&!b.lo)return false;
    if(filters.origin==='foreign'&&b.lo)return false;
    if(filters.classic&&!b.cl)return false;
  }else{
    if(filters.cat&&!(b.cat||'').includes(filters.cat))return false;
  }
  return true;
}

function renderPccrCard(b){
  const tags=[];
  tags.push(`<span class="tag tag-age">${b.ag}歲</span>`);
  if(b.y.length)tags.push(`<span class="tag tag-year">${b.y.join('/')}年</span>`);
  if(b.cl)tags.push('<span class="tag tag-classic">經典</span>');
  if(b.lo)tags.push('<span class="tag tag-local">本土</span>');
  if(b.c)b.c.split('、').forEach(c=>{if(c.trim())tags.push(`<span class="tag tag-cat">${c.trim()}</span>`)});

  const titleHtml=b.id
    ?`<a href="${PCCR}${b.id}" target="_blank" rel="noopener">${b.n}</a>`
    :b.n;

  let meta=`<span><span class="label">作者</span>${b.a}</span>`;
  if(b.d&&b.d!==b.a)meta+=` <span><span class="label">繪者</span>${b.d}</span>`;
  if(b.t)meta+=` <span><span class="label">譯者</span>${b.t}</span>`;
  meta+=`<br><span><span class="label">出版</span>${b.p}</span>`;
  if(b.dt)meta+=` <span><span class="label">日期</span>${b.dt}</span>`;
  if(b.pr)meta+=` <span><span class="label">定價</span>${b.pr}元</span>`;
  if(b.isbn)meta+=` <span><span class="label">ISBN</span>${b.isbn}</span>`;

  let desc='';
  if(b.desc)desc=`<div class="desc">${b.desc}</div>`;

  return `<div class="book-card${b.cl?' classic':''}">
    <div class="title">${titleHtml}</div>
    <div class="tags">${tags.join('')}</div>
    <div class="meta">${meta}</div>
    ${desc}
    <div class="actions">${links(b)}</div>
  </div>`;
}

function renderThreadsCard(b){
  const tags=[];
  tags.push(`<span class="tag tag-age">${b.ag}歲</span>`);
  tags.push(`<span class="tag tag-cat">${b.cat}</span>`);

  let meta='';
  if(b.a)meta+=`<span><span class="label">作者／出版</span>${b.a}</span>`;
  if(b.note)meta+=(meta?' ':'')+ `<span><span class="label">備註</span>${b.note}</span>`;

  let actions='';
  if(b.url)actions+=`<a class="act act-threads" href="${b.url}" target="_blank" rel="noopener">Threads 原文</a>`;
  actions+=`<a class="act act-momo" href="https://www.momoshop.com.tw/search/searchShop.jsp?keyword=${enc(b.n)}" target="_blank" rel="noopener">momo</a>`;
  actions+=`<a class="act act-eslite" href="https://www.eslite.com/Search?keyword=${enc(b.n)}" target="_blank" rel="noopener">誠品</a>`;
  actions+=`<a class="act act-books" href="https://search.books.com.tw/search/query/key/${enc(b.n)}" target="_blank" rel="noopener">博客來</a>`;
  actions+=`<a class="act act-yt" href="https://www.youtube.com/results?search_query=${enc(b.n+' 繪本 共讀')}" target="_blank" rel="noopener">YouTube</a>`;

  return `<div class="book-card threads-src">
    <div class="title">${b.n}</div>
    <div class="tags">${tags.join('')}</div>
    ${meta?`<div class="meta">${meta}</div>`:''}
    <div class="actions">${actions}</div>
  </div>`;
}

function renderCard(b){
  return currentSource==='threads'?renderThreadsCard(b):renderPccrCard(b);
}

function render(){
  const matched=getActiveBooks().filter(matchBook);
  resultCount.textContent=matched.length;
  if(matched.length===0){
    bookList.innerHTML='<div class="no-result">沒有找到符合條件的書籍</div>';
    return;
  }
  bookList.innerHTML=matched.map(renderCard).join('');
}

render();
