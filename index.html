],"ag":"0~3","c":"認知探索","cl":true,"lo":false,"isbn":"9789577625779","dt":"109.07","pr":350,"desc":"這是一本可以「玩」的形狀顏色認知書，厚紙材質，小小孩也能練習翻閱 ，封面有三個可以取下的彩色積木，配合內頁的凹槽，加上想像，把這三個積木組合成各種物品，小小孩一定會很喜歡。這本書可以幫助孩子認識形狀，還可以透過嵌入凹槽的過程，練習精細動作，是輔助幼兒發展的好繪本。[113]\n對小黑熊來說，紅色圈圈是"},{"id":"def13ef39bb54ed1966f4e99","n":"在爸爸的背上","a":"瑪麗安．杜布","d":"瑪麗安．杜布","t":"上誼編輯部","p":"上誼文化","y":["110","112","113"],"ag":"0~3","c":"社會情緒","cl":true,"lo":false,"isbn":"9789577626875","dt":"109-07","pr":250,"desc":"&nbsp;\n這本適合幼兒翻閱的硬頁書，用簡單文字和生動圖畫展現小無尾熊和爸爸的日常生活。這種親密的依賴和愛的互動，讓小無尾熊獲得足夠的安全感，勇敢又自信地嘗試和探索世界。共讀時，陪孩子尋找畫面的昆蟲小驚喜，培養孩子的觀察力。之後，一起玩背背的遊戲，真實體驗故事中愛的互動。[113]\n本書是一本適合"},{"id":"8e4d1536975d4218ba9e3378","n":"阿姆，謝謝妳！","a":"歐葛．摩拉","d":"歐葛．摩拉","t":"宋珮","p":"遠見天下文化(小天下)","y":["110","112","113"],"ag":"3~5","c":"社會情緒","cl":true,"lo":false,"isbn":"9789865535056","dt":"109-07","pr":360,"desc":"&nbsp;\n大地色調、和諧別緻的拼貼畫，帶你進入阿姆燉煮的「蕃茄燉肉」迷人香味之中，她的鄰居、警員、商販都被這香味吸引過來，阿姆把自己的晚餐分享給他們。 你可以在書中尋找拼貼畫動人的細節，例如：代表香味的米色色帶串聯著分享與感謝的人們。許多職業的人都被燉肉的香味吸引過來，你找到醫生了嗎？你有認出哪"},{"id":"2469820e58bb4603a633b745","n":"是誰留下的痕跡","a":"劉伯樂","d":"劉伯樂","t":"","p":"信誼基金","y":["113"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":true,"isbn":"9789861615561 ","dt":"109-07","pr":280,"desc":"用攝影和散文組合而成的知識類繪本，雖然並不直接說故事，但是因為每張拍攝出的畫面都忠實呈現大自然、動物和人在地球上留下的痕跡，而有了編故事的可能。作者優美的文字不僅從科學角度解釋痕跡，也用詩意的方式描寫，讓讀者對於大自然萌生敬畏之情，也學習思考人在其中的角色。[113]"},{"id":"f14a03fd5f9a4edb8a35a08f","n":"騎著恐龍去圖書館","a":"劉思源","d":"林小杯","t":"","p":"步步出版","y":["111","112"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789579380591","dt":"109.06","pr":320,"desc":"來不及了！鎮上圖書館的「說故事時間」快到了。小朋友最喜歡的小雷龍立刻來幫忙，牠載著米米、可可和飛飛，越走越快，快到被開了罰單，終於趕上了。可是，小雷龍身體太大，圖書館的門太小，不能進去聽故事，怎麼辦呢？巴館長有了一個好辦法&hellip;&hellip;雷龍行動圖書館，鄉鎮和村落趴趴走。記得打開書衣"},{"id":"dbabeb020cf6436d96005617","n":"歡迎光臨口罩動物村","a":"黃芝瑩","d":"黃芝瑩","t":"","p":"","y":["110"],"ag":"3~5","c":"健康與安全","cl":false,"lo":true,"isbn":"9789575036119","dt":"109-06","pr":"","desc":"小男孩和媽媽來到動物村，動物竟然全都戴著口罩。是不是全村子的動物都生病了呢？藉由男孩詢問的過程和有趣的情節互動，將保護生命的概念深植孩子的心，讓戴口罩不再是件難事，並讓孩子立刻學會正確使用口罩的方法，在新型冠狀病毒肺炎流行的今日更顯重要！"},{"id":"019b100f3d6d4fbf849fceff","n":"一打開 大驚喜  一二三 哇！","a":"新井洋行","d":"新井洋行","t":"張玲玲","p":"格林文化","y":["112"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861899725","dt":"10905","pr":299,"desc":"這是一本有趣且別出心裁的童書，書中不僅有精美的插圖和生動的文字，還設計了特殊的摺頁，能夠引起孩子們對書本操作的興趣和好奇心。每個摺頁都有不同的主題和圖像，能夠讓讀者在打開摺頁時，打破過去習慣翻書的方向，來獲得更多驚喜，增加閱讀的趣味性和互動性。\n此外，書中還穿插了一些有趣的問題，以「是什麼？」的問句"},{"id":"82451d4a42b54b35bfa6021c","n":"明天，很有可能","a":"戴夫．艾格斯","d":"藍．史密斯","t":"劉清彥","p":"拾光工作室","y":["111"],"ag":"3~5","c":"語言溝通","cl":false,"lo":false,"isbn":"9789869873604","dt":"109.05","pr":330,"desc":"極為日常的散步風景與小小探索，因為反覆出現一句「明天，很有可能」的懷想，就有了詩的韻味。不僅如此，這本書還含藏了對未知的期待，以及父母對孩子的盼望與祝福，是為孩子朗讀的佳選，也有機會為親子在生活中創造「明天，很有可能」的詩性對話。"},{"id":"24522e57511a44bdbd1893c7","n":"蔬菜白熊","a":"柴田啟子","d":"柴田啟子","t":"Choyce","p":"小魯文化","y":["111"],"ag":"0~3","c":"認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789865513306","dt":"109.05","pr":300,"desc":"愛吃蔬菜的白熊突發奇想，如果鑽進愛吃的蔬菜裡會是什麼感覺？本書從小白熊可愛的視角，想像自己成為番茄、高麗菜、南瓜、豆子的一部份，在奇幻有趣的體驗旅程中，透過淺顯的知識與日常料理的連結，傳達蔬菜兼顧營養、美味的印象，相信連不愛吃蔬菜的孩子都能感受蔬菜的魅力，不再挑食喔！"},{"id":"dbb8734d17f24d1eaa625e03","n":"甘伯伯的犀牛","a":"約翰･伯寧罕","d":"約翰･伯寧罕","t":"吳娉婷","p":"阿爾發國際","y":["111","112","113"],"ag":"3~5","c":"社會情緒","cl":true,"lo":false,"isbn":"9789869413169","dt":"109-05","pr":280,"desc":"這個故事結合了作者著名的角色「甘伯伯」和一頭真實存在過的北白犀牛。書裡提到人類的殘害，使小犀牛成為孤兒，還好有慈愛的甘伯伯，和一群善良的孩子為牠營造了友善的環境和舒適的生活，這是真實的北白犀牛應該擁有的。作者必定盼望故事能深植在孩子的心裡。[113]\n&nbsp;\n許多兒童文學作家不僅為兒童發聲，更"},{"id":"21f16a5defe249c980be596e","n":"我家是動物園","a":"正道薰","d":"大島妙子","t":"游珮芸","p":"上誼文化","y":["111","114"],"ag":"3~5","c":"語言溝通、社會情緒","cl":false,"lo":false,"isbn":"9789577626868","dt":"109/05","pr":250,"desc":"小男孩祥泰眼中的家是熱鬧的動物園，他是一隻愛吃香蕉的猴子，爸爸頂著亂蓬蓬的獅子頭，早上起床還會獅子吼，還有媽媽、妹妹、奶奶，每個家庭成員都變成獨特的動物，生動又逗趣！作者透過幽默的筆觸，展現孩子對家人的觀察與關愛，讓我們看到家是充滿溫暖與歡笑的地方。共讀之後，和孩子一起想想，我們的家人像哪些動物呢？"},{"id":"e66a310012b84316900d35d0","n":"不管怎麼樣你都會愛我嗎？","a":"黛比．葛莉歐利","d":"黛比．葛莉歐利","t":"李貞慧","p":"采實文化","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789865071172","dt":"109.04","pr":320,"desc":"當家長忙碌時，孩子時常因被疏忽而感到失落、鬧脾氣，如同故事中小狐狸憂心媽媽是不是不愛自己了，不停地提出各種疑問，而狐狸媽媽堅定且溫柔的回答也逐漸緩解了小狐狸不安的情緒。共讀時，藉由故事裡親子暖心的對話，不但能增加親子間的情感連結，也讓孩子感受父母永遠的愛！"},{"id":"ef69776b0510409682bb8b7d","n":"這條橡皮筋是我的","a":"吉竹伸介","d":"吉竹伸介","t":"許婷婷","p":"三采文化","y":["111"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789576583230","dt":"109.04","pr":280,"desc":"吉竹伸介是近年大受歡迎的創作者，他的作品充滿奇想，且思路百轉千迴，趣味性十足。此書承襲其創作一貫的特質本書站在兒童的角度，以理解兒童的小小渴望心理為出發點，僅以一條再普通不過的橡皮筋，就發展出想像力爆發的故事。"},{"id":"c96aff7cfc1f4e9cbd65f44d","n":"123轉台灣","a":"陳盈帆","d":"陳盈帆","t":"","p":"聯經出版","y":["113","114"],"ag":"3~5","c":"語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789570854909 ","dt":"109/04","pr":280,"desc":"搭乘自強號火車，孩子將展開一場繽紛的環島探索，隨著交通工具與時間推移，領略臺灣豐富的風景與文化。故事巧妙串聯城市風貌與日常生活，讓孩子仿若親歷其中。鮮明色彩與細膩細節增添童趣，結合地圖遊戲，激發探索精神，在遊戲與閱讀間培養對臺灣的認同與熱愛。[114]早上七點鐘，自強號從高雄出發，左上角的時鐘上標示"},{"id":"b13f04a129594ed19cefcea9","n":"等媽媽來的時候","a":"張筱琦","d":"張筱琦","t":"","p":"東方出版","y":["111"],"ag":"3~5","c":"社會情緒、生活自理、認知探索","cl":false,"lo":true,"isbn":"9789863383079","dt":"109.03","pr":280,"desc":"家長還沒來接孩子時，有的孩子又吵又鬧，或畏縮躲著，還有甚麼方法可以陪伴孩子呢？作者以藍色的小象為主角，用想像力陪她挺過這段時間，繪圖裡用尖牙鱷魚池和窄橋代表孩子的困境；用巨大脆弱的雞蛋運送相較藍色微小的身軀，還把紅色消防栓想像是大象爺爺&hellip;&hellip;，直到看見媽媽騎摩托車出現的那一"},{"id":"962e527fad7b4acca6fc9089","n":"早安動物園","a":"微笑先生（陳翠吟）","d":"莉秦（黃莉秦）","t":"","p":"南一書局(親子時堂)","y":["111"],"ag":"0~3","c":"身體動作、生活自理","cl":false,"lo":true,"isbn":"9789574436552","dt":"109.03","pr":270,"desc":"開門前的動物園會是什麼樣的情景呢？園外的公雞一大早就扯開嗓門大聲啼叫，遠處的早操音樂隨之響起，大家紛紛加入早起運動的行列。本書透過逗趣的畫面，一窺動物明星們準備迎接遊客前的「早操」儀式，甩手臂、轉膝蓋、動動身體，摔倒爬起來再做一次，下次帶孩子一起逛動物園時，不妨猜一猜動物們今天又做了什麼有趣的熱身動"},{"id":"d0056a367f6744aa936cae59","n":"滾啊滾 睡覺覺","a":"田中伸","d":"田中伸","t":"張玲玲","p":"格林文化","y":["111"],"ag":"0~3","c":"生活自理、語言溝通","cl":false,"lo":false,"isbn":"9789861899558","dt":"109.03","pr":220,"desc":"睡覺時間到了，大象、大熊、天鵝、小兔子、小松鼠、小貓咪都找到最舒服的地方安穩地睡覺。小寶寶也想睡了，你猜他要睡在哪裡呢？本書以黑色背景代表夜晚的意象，透過書中動物們安穩的睡姿和安詳的表情，傳達歡迎寶寶進入夢鄉的訊號，讓人看了忍不住也想躺下來睡一覺，真是催眠啊！"},{"id":"mgbdnrucv208y2xf0twpvuiy","n":"我才沒有迷路","a":"板橋雅弘","d":"茂利勝彥","t":"邱瓊慧","p":"上誼文化","y":["114"],"ag":"3~5","c":"社會情緒、生活自理","cl":false,"lo":false,"isbn":"9789577626806","dt":"109/03","pr":280,"desc":"既焦急又堅強的文字和畫面，細膩地描繪小男孩迷路時的情緒變化。「不可以哭！我才沒有迷路，是哥哥走丟了」，眼淚在眼框中打轉，忍住不讓它掉下來，好讓人揪心。畫家用小男孩的高度，描繪故事場景，更讓人感受到小男孩的無助和焦慮。也在每頁的角落，貼心地安排一個溫馨的戴黃帽的迷路猩猩陪伴小男孩和小讀者。[114]"},{"id":"930b0a7d8e6f4b95b8b74409","n":"神奇大傘","a":"艾美．瓊．貝茲、茱妮珀．貝茲","d":"艾美．瓊．貝茲","t":"劉清彥","p":"遠見天下文化(小天下)","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864799138","dt":"10902","pr":350,"desc":"倚在大門邊的一把紅傘，傘面上有一張嘴角上揚的閉眼休息的小臉。小女孩帶著傘出門，在大雨中撐開，化身為一把友善的大傘，隨著進來躲雨的人漸漸增多，傘面也越來越大，小臉也睜開眼睛越笑越開了，紅傘展現了神奇的愛與包容力量。[112]"},{"id":"30219f2711ed4704844e0490","n":"淘氣鴿子：我不想去上學！","a":"莫‧威樂","d":"莫‧威樂","t":"吳愉萱","p":"采實文化","y":["111"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789865070854","dt":"109.02","pr":320,"desc":"淘氣鴿子回來了！這次他不想去上學，開始胡思亂想，提出許多問題，加上誇張的思路、幽默的對白，大人小孩都會跟著會心一笑！孩子不想上學的原因並非「抗拒學習」，而是對新環境和未知事物的擔心和疑慮，大人不妨捨棄說教和循循善誘的方式，讓孩子跟著淘氣鴿子一起在自問自答中發現上學的樂趣。"},{"id":"88baa13665aa47629a2715cc","n":"哈囉，大象太太！","a":"珊曼．鮑頓","d":"珊曼．鮑頓","t":"謝維玲","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789579529181","dt":"109-02","pr":"","desc":"藉由探險非洲草原的視角，帶領翻開這本書的親子認識更多不同的物種。除了圖片與文字外，本書最大的特色就是拉頁，拉頁內介紹更多有關這種動物的神奇小知識，透過類似躲貓貓的方式探索拉頁，適合激發孩子的好奇心。"},{"id":"8d62238d7c814dfa8d2209a1","n":"比你更高！","a":"慶惠媛","d":"慶惠媛","t":"賴毓棻","p":"剛好閱讀","y":["113"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789869694179","dt":"109-02","pr":290,"desc":"我比你高。才不是，是我比你更高。孩子們總想要比別人高那麼一點點，感覺自己比較厲害。大小動物們也愛比身高，為了誰比較高爭吵不休，不服輸的大熊把樹推倒了，卻創造了意料之外的大逆轉。逗趣的表情，很有音效的簡潔文字，大人和小孩都會很有共鳴。[113]"},{"id":"1941070369744d60b581c902","n":"HOME","a":"林廉恩","d":"林廉恩","t":"","p":"巴巴文化","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":false,"lo":true,"isbn":"9789869743709","dt":"109-02","pr":350,"desc":"這本繪本既是豐盛的視覺饗宴，又是溫暖的心靈之旅。作者用拼貼技法把各種紙材或撕、或剪成北臺灣的風景，讀者在辨認材質的同時，也看到轉化後的建築物、大海、農園等等。早上出門的父女直到晚上回家，才發現紅鳥一路跟隨的原因，而「家」也因此有了更深一層的意義。[113]"},{"id":"nx762zbq6yrmvtwmm6msbozw","n":"送花給你","a":"姜景琇（강경수）","d":"姜景琇（강경수）","t":"葉雨純","p":"東方出版社","y":["114"],"ag":"3~5","c":"認知探索、健康與安全、美感","cl":false,"lo":false,"isbn":"9789863383024","dt":"109/02","pr":320,"desc":"早晨，大熊在樹林裡散步時，聽到小而急促的呼喚，有隻瓢蟲卡在蜘蛛網上。大熊猶豫要不要幫助瓢蟲。共讀時，試著引導孩子站在大熊、瓢蟲或蜘蛛的立場，開啟對話，思考如何化解危機或表達自己的意見。討論大自然的法則，領會微不足道的舉動，可能會改變世界。共讀前也可以來個封面和書名預測，最後的大拉頁是個美好的答案。["},{"id":"6ebd6f728a474abba3a9ad5d","n":"坐在世界的一角","a":"布蘭登・溫佐","d":"布蘭登・溫佐","t":"宋珮","p":"拾光工作室","y":["111"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789869685184","dt":"109.01","pr":450,"desc":"用柔和的圖畫描繪各種大自然的景象，讓孩子從書上探索各種自然景觀，也運用各種視角來敘述石頭對於這個大自然存在的意義，帶領小朋友發揮想像力飛揚在自然世界中。"},{"id":"c715f2c6861e4a3192bbb56a","n":"你來幫幫我，我來幫幫你！","a":"金福泰","d":"金福泰","t":"林玗潔","p":"小魯文化","y":["111"],"ag":"0~3","c":"社會情緒","cl":false,"lo":false,"isbn":"9789862119877","dt":"109.01","pr":280,"desc":"小象抓不穩樹幹、小熊無法刷自己的背、小豬摘不到樹上的柿子&hellip;&hellip;，一個人的時候，很多事常常做不到也做不好，但如果有人幫忙就不一樣了。本書描繪朋友間「互相合作」的重要性，透過彼此的協力和相互的幫忙一起克服困難，也從中培養友誼和關懷的情感。"},{"id":"c53e68fc54f8494f918bb2b3","n":"生氣的亞瑟","a":"海文．歐瑞","d":"喜多村惠","t":"柯倩華","p":"","y":["110","112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789864799121","dt":"109-01","pr":"","desc":"情緒是生而為人不可或缺而珍貴的一部分，提醒我們去看向自我的內在小宇宙，進而更認識自我。本書用不帶批判，幽默而創意的文學手法，細膩引人的圖像風格，以自然氣候、宇宙運行，具體化描繪了情緒的變化過程與強大破壞力，啟發人們以不同視角理解認識情緒。[112]\n主角亞瑟因為媽媽不同意他看電視，生氣了。他的氣像烏"},{"id":"ef009160e0b840889c133cad","n":"海浪","a":"蘇西・李","d":"蘇西・李","t":"吳文君","p":"","y":["110","112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789865406462","dt":"109-01","pr":"","desc":"認識自己，從探索身體開始，從感受身體律動帶來的歡快與自由開始。本書不但捨棄了文字敘述，更將圖像極簡為最純粹的線條色彩，帶動孩子用身體五感感受海浪，隨波起舞，或靜或動。海浪與孩子，在動靜交錯的節奏中，一起共譜了動人的樂章，不僅解放了身體，更自由了心靈。[112]\n出自近年備受國際矚目的韓國插畫家蘇西‧"},{"id":"0cbeaf1a9b1c4751bc04ce32","n":"寶寶喜歡吃","a":"李瑾倫","d":"李瑾倫","t":"","p":"信誼基金","y":["110","111","112"],"ag":"0~3","c":"認知探索、生活自理、身體動作","cl":true,"lo":true,"isbn":"9789861616063","dt":"109.01","pr":280,"desc":"本書透過可愛動物的飲食喜好作為每頁的引言，巧妙引導孩子思考，並藉由書中特殊摺頁來提問，讓孩子獲得更多延伸的互動體驗。作者運用明亮簡潔的畫風，呈現幼兒熟悉的食物和餐具，並設計出簡單易懂的圖畫，以促進幼兒更容易理解和學習。此書在共讀時能夠為家長和孩子帶來更多互動的樂趣。[112]\n本書使用翻翻書的設計，"},{"id":"49542bf20c9d416fab70d8d2","n":"國王陛下回來前的100秒！","a":"柏原佳世子","d":"柏原佳世子","t":"林宜柔","p":"","y":["110"],"ag":"3~5","c":"語言溝通","cl":false,"lo":false,"isbn":"9789579077767","dt":"109-01","pr":"","desc":"整本書沒有過多的文字，但不用擔心會不會沒了解到什麼故事，反而可以在翻閱這本書的時候更留心畫裡的每個小細節，也可以一邊和孩子幫士兵數數，一邊討論畫裡的誰正在做什麼事，是本富有互動性又能建立孩子簡單數學概念的好書。"},{"id":"7229d8b8518f48d0bbbca6e5","n":"老鼠牙醫──地嗖頭","a":"威廉‧史塔克","d":"威廉‧史塔克","t":"孫晴峰","p":"","y":["110"],"ag":"3~5","c":"生活自理、健康與安全","cl":false,"lo":false,"isbn":"9789577626615","dt":"109-01","pr":"","desc":"老鼠地嗖頭是名牙醫，即便遇到大動物求診，也能利用懸吊方式看病。老鼠牙醫為了自身安全，不替貓及危險動物看診，豈料竟有一牙痛欲裂的狐狸登門，老鼠牙醫面對倫理兩難該如何化解？書中刻畫老鼠牙醫另類看診方式，並娓娓描述機智解困之道，深具創意，堪稱經典。"},{"id":"fd93f65d82b14419bdfb86c9","n":"想念，不再傷心","a":"布萊恩利斯","d":"布萊恩利斯","t":"何儀","p":"","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"4713269121749","dt":"109-01","pr":"","desc":"不論失去親人或失去寵物（寵物也是某種意義的親人），沒有生命是永恆存在的。這本繪本探討生命中必然會發生的失去，書名替這個生命課題做了很好的詮釋：可以持續想念，但不要沉溺於傷心。最後主角艾文又收養了新生命，說明了生命就是不斷失去與更新。"},{"id":"798fc92a732249a99a719d17","n":"寶寶不想睡","a":"李瑾倫","d":"李瑾倫","t":"","p":"信誼基金","y":["110","112","113"],"ag":"0~3","c":"社會情緒","cl":true,"lo":true,"isbn":"9789861616070","dt":"109-01","pr":280,"desc":"&nbsp;\n這是一本適合睡前共讀的繪本，書中的場景家長再熟悉不過。帶著孩子和封面上的寶寶一起在床上翻滾，開始一段「寶寶不想睡」之旅吧！書中簡單又重複的句子，可讓孩子學習語言並獲得預測故事內容的成就感；翻開躲在棉被裡面的小動物，帶給孩子探索的樂趣並獲得一次又一次的驚喜。最後當家長給孩子一個親親之後，"},{"id":"797773231a6748e08299002c","n":"我愛新衣服","a":"石麗蓉","d":"石麗蓉","t":"","p":"小兵出版","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789579047548 ","dt":"109-01","pr":280,"desc":"小女孩有了美麗的洋裝後，就一直穿著它，即使去公園也不肯換下，直到爸爸及時幫她去除了心理障礙，才能盡情地玩。這本書必定能得到家長與孩子的共鳴，因為描述的是親子生活中常出現的狀況，而孩子也能透過這故事了解穿著衣服與場合互相搭配的重要。[113]"},{"id":"53f7b4dd98f0468e8bb5a470","n":"蛙弟穿衣服","a":"強納森．倫頓（Jonathan London）","d":"法蘭克．倫奇維滋（Frank Remkiewicz）","t":"張淑瓊","p":"拾光工作室","y":["110","111","114"],"ag":"0~3","c":"身體動作、生活自理、語言溝通","cl":true,"lo":false,"isbn":"9789869685160","dt":"109/01","pr":300,"desc":"蛙弟一心只想到雪地裡玩，疏忽了保暖，蛙媽一次一次的耐心提醒，蛙弟也往返增添衣物而耗盡體力，最終心甘情願上床睡覺。在「蛙弟忘記、媽媽提醒」重複情節的故事節奏中，讀到蛙媽的包容、耐心等待蛙弟滿足內在需求，讓蛙弟自主管理。一本讓媽媽讀來感同身受，學習包容孩子，也是引導孩子練習穿脫衣物的溫馨繪本！[114]"},{"id":"65accb6ccbd946c6b859357f","n":"還差一點 還差一點","a":"木村裕一","d":"高畠純","t":"林宜和","p":"上誼文化","y":["111"],"ag":"3~5","c":"身體動作、社會情緒","cl":false,"lo":false,"isbn":"9789577626653","dt":"108.12","pr":280,"desc":"某個東西掉進洞裡、滾進家具底下，伸手想拿出來，卻總是差一點，好不容易稍微碰到了，卻又不小心把東西推得更深。人人都曾有過類似的經驗吧？作者巧妙地將這種感受轉化為幽默的故事，繪者也生動畫出「還差一點」的肢體動作與表情，是孩子會樂在其中，甚至即興跟著表演的作品。"},{"id":"0de67917b00e41aba42787ae","n":"胡利安是隻美人魚","a":"潔西卡．洛夫","d":"潔西卡．洛夫","t":"陳思宏","p":"三民書局","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789571466927","dt":"108.12","pr":329,"desc":"這是一本充滿想像創意的繪本，帶領讀者進入孩子的想像扮演世界，祖母重視孩子表達自己真實的想法和感受，接納創意的想像扮演，更親身加入奇幻的遊行，書中無字的畫面，展現十足的動感和豐富的想像，親子共讀此書的第一步，可能就是要先放下自己的成見，鼓勵孩子自由自在地表達自我，支持孩子的想像奔馳。"},{"id":"7ebe1b962f5e4c6a87f139f9","n":"夢遊","a":"顏志豪","d":"薛慧瑩","t":"","p":"巴巴文化","y":["109"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789869743785","dt":"108-12","pr":350,"desc":"夜深之後，孩子的奇幻旅程也開始了。他走在電線桿上、爬上獅子背、坐上摩天輪、在海面上跳舞、搭上深夜的小火車⋯⋯為的是送一束花給遠方的爺爺奶奶，然後再和爸爸一路玩回家。在瘋狂的奇幻旅程中，小讀者一同經歷了想像力的馳騁，或許也會勾起對自己爺爺奶奶的想念。"},{"id":"51743b0ce57c45bcb7b1e7e8","n":"交通工具：小玩具大驚奇","a":"芭露吉","d":"芭露吉","t":"王欣榆","p":"","y":["109","110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789861899473","dt":"108-12","pr":320,"desc":"透過拉頁的設計，這本圓角厚頁的圖畫書，讓喜歡交通工具的幼兒，在每一次的翻頁中，都充滿了驚喜。作者運用圖畫的設計，讓每一個交通工具的造型都可再多出許多意想不到的變化，十分具有創意的設計。共讀時，可以和孩子一起猜猜看，這個圖形還可以變出哪些特別的交通工具。[110]\n這本拉頁書，適合正要認識各種交通工具"},{"id":"be2a34de4f894b6aaba103c5","n":"手指變魔術","a":"芭露吉","d":"芭露吉","t":"張政婷","p":"","y":["110"],"ag":"0~3","c":"身體動作、認知探索","cl":false,"lo":false,"isbn":"9789861899374","dt":"108-12","pr":"","desc":"本書開本小、紙質柔軟親膚，具遊戲及互動特質。鏤空的圓洞貫穿書頁，刻意造成頁面上部分畫面空缺，書中文字則邀請、引導幼兒將指頭伸入圓孔補足畫面。透過手動設計，一方面讓幼兒體會閱讀具遊戲性，同時也暗示故事的完成涉及讀者主動參與，構思巧妙。"},{"id":"ae468a081dec4526b4002cd5","n":"最可怕的一天（新版）","a":"湯姆牛","d":"湯姆牛","t":"","p":"遠見天下文化(小天下)","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":true,"isbn":"9789864798674 ","dt":"108-12","pr":350,"desc":"「上臺」說話或表演，那種緊張害怕的情緒和壓力是小孩和大人共通的經驗。本書用孩子一聽就懂的直白文字述說主角的心情。再用地震、火山爆發、海嘯、巨眼、怪獸和外星人攻擊的視覺圖像，具體呈現無形的恐懼。不僅安撫我們面對恐懼的心，也提供親子一起勇敢面對自我的對話機會。[113]"},{"id":"4026b11e3240410db346248e","n":"千千萬萬個聖誕老公公","a":"母袋裕子","d":"瑪麗卡．邁亞拉","t":"羅凡怡","p":"野人文化","y":["111","112"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789863843931","dt":"108.11","pr":350,"desc":"這本來自聖誕老人故鄉芬蘭的聖誕節繪本，用別出心裁的故事，讓孩子繼續相信聖誕老人的存在，也明白每年都由爸媽準備聖誕禮物的緣由。不僅保留孩子對聖誕老人美好的想像，也告訴孩子雖然看不見聖誕老人，他仍存在世上，默默守護他們和禮物。動人的故事，搭配蠟筆畫風，讓千千萬萬個聖誕老公公的心意，溫暖孩子純真的童年。["},{"id":"b63bc8b926a6412bbdccacb3","n":"小熊在哪裡？","a":"kiki","d":"許匡匡","t":"","p":"中華民國聾人協會","y":["109"],"ag":"0~3","c":"認知探索、語言溝通","cl":false,"lo":false,"isbn":"9789869840002","dt":"108-11","pr":380,"desc":"小孩（聾孩子）的小熊不見了。他著急的在家裡尋找，一次又一次的問「小熊在哪裡？」一次又一次的誤認，充滿了偵探的樂趣。\n以孩子的視角去發現最親近的小熊與家人，其中隱藏手語學習的彩蛋。"},{"id":"684d36b7cfb34086b76eede0","n":"黑漆漆的夜晚","a":"愛蜜莉‧蘭德","d":"愛蜜莉‧蘭德","t":"黃聿君","p":"","y":["109"],"ag":"3~5","c":"美感","cl":false,"lo":false,"isbn":"9789865876746","dt":"108-10","pr":300,"desc":"聲音，是人類生活與回憶的大部份。對於孩子來說，聲音更是他們關注的重點。夜幕低垂後，某些影像暫時黯淡，聲音卻更加清晰。在此書中，孩子可以注意到夜晚特有的聲音，甚至開始留意自己生活環境裡的夜間聲音。除了視覺圖像的刺激，小讀者腦海裡的聲音也被活絡了。"},{"id":"11ac489ace634dd199ba7952","n":"城市裡的小訪客","a":"席尼・史密斯","d":"席尼・史密斯","t":"宋珮","p":"拾光工作室","y":["109","112","113"],"ag":"3~5","c":"社會情緒、語言溝通、美感","cl":true,"lo":false,"isbn":"9789869685146","dt":"108-10","pr":360,"desc":"&nbsp;\n從連續畫面中，看到小男孩獨自走過城市的街道、小巷、公園&hellip;&hellip;，文字描述他反覆在與某個對象說話。隨著畫面推移，才揭曉他在風雪中尋找走失的貓。共讀時，引領孩子關注畫面的構圖變化，感受小男孩的擔憂和期盼的心情。在他投進媽媽懷抱和最後雪地的腳印，終於讓起伏不安的心安靜"},{"id":"9b79359d91a44ad78b8bccf3","n":"寶貝，該睡覺了……","a":"麥克．巴奈特","d":"伊莎貝爾．阿瑟諾","t":"游珮芸","p":"親子天下","y":["112","113"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789575033880","dt":"108-09","pr":320,"desc":"&nbsp;\n為什麼恐龍都不見了？什麼是黑洞啊？躺在床上的小女孩對世界充滿了疑問，無法入睡。父親非常有創意的回答，滿足了孩子的好奇心。這本繪本在單頁提出問題，答案展現在充滿意境的跨頁，激發孩子的思考力和想像力。共讀的睡前儀式，也可以這麼的迷人，這麼的詩意。[113]\n&nbsp;\n小女孩躺在床上，爸"},{"id":"8ce666a4116a45b8a43e00d8","n":"找找貓咪和老鼠","a":"米亞芙尼","d":"米亞芙尼","t":"周婉湘","p":"小果文創","y":["112"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869702157","dt":"10809","pr":340,"desc":"這是一本結合探險故事和找找看的搜尋遊戲書。共讀時，需要利用貓咪和老鼠雙面搜尋卡，在每個不斷變換的頁面中，找出正在城堡中玩遊戲，花色要和圖示一模一樣的胖貓和小老鼠。孩子也可以把兩隻動物搜尋卡當成棒偶，在不同的舞臺背景中互相追逐，述說全新的貓咪老鼠大冒險的故事，也可兩人合演探險遊戲，邊演邊競賽搜尋。[1"},{"id":"24888420a3d34ce1b7eb4d8a","n":"大家都會畫畫","a":"郭飛飛","d":"郭飛飛","t":"郭飛飛","p":"阿布拉教育文化","y":["111","113"],"ag":"0~3","c":"美感","cl":false,"lo":true,"isbn":"9789865876715","dt":"108-09","pr":320,"desc":"拼貼畫、手指畫、色筆畫、縫紉畫、水墨畫... 這本書給了我們好多畫畫的點子，真想每一樣都試試看！每個人有自己喜歡的畫畫方式，而且每個人的創作都是獨一無二的。作者送給大家這句話：好好享受你的畫畫旅程！[113]\n圖畫的風格千變萬化，各具獨到的美感和特色，無法用固定的標準來評價，重點在於畫畫的過程是否能"},{"id":"94fadd38d2014f03bd239ac5","n":"小羊睡不著","a":"喜多村惠","d":"喜多村惠","t":"劉清彥","p":"三之三文化","y":["110"],"ag":"3~5","c":"認知探索、生活自理","cl":false,"lo":false,"isbn":"9789865664435","dt":"108-09","pr":"","desc":"小羊阿武夜不成眠，走至戶外尋覓安睡之法，雖偶於蘋果樹下自得，卻依然睡不著，直至走進屋內放著畫具之室，將自己所見悉數畫下、懸掛欣賞，遂得稱心，接著裹腹、盥洗、就寢，闔眼數念家人睡去。本書既是數數書，也透過擬人化角色勾勒人的一生，淺讀或深思皆宜。"},{"id":"2703a1b41e0245008e08d3fb","n":"小可可愛打嗝","a":"竹下文子","d":"岡田千晶","t":"游珮芸","p":"上誼文化","y":["109","111","112"],"ag":"0~3","c":"生活自理、健康與安全","cl":true,"lo":false,"isbn":"9789577626622","dt":"108.09","pr":250,"desc":"貓咪小可可，捂起嘴巴、跳起身子，一直打嗝，停不下來。繪者很巧妙地讓動物朋友們發揮自己的特長幫忙解決打嗝的問題，「嚇一跳」、「搔搔癢」、「憋氣」、「倒立」、「翻跟斗」。爸爸媽媽陪寶貝一起共讀繪本，猜猜誰來幫小可可「搔搔癢」，然後幫寶貝「搔搔癢」，開啟身體的感受，捕捉親子互動的美好畫面。[112]\n小可"},{"id":"dcbb7b2a7e0945e0a8d9ef3e","n":"慢慢的小樹懶","a":"大村知子","d":"大村知子","t":"游珮芸","p":"上誼文化","y":["109","110","111"],"ag":"0~3","c":"認知探索、身體動作","cl":true,"lo":false,"isbn":"9789577626639","dt":"108.09","pr":280,"desc":"當孩子動作緩慢時，常常跟不上別人，家長是不是會心急？推薦親子一起共讀這本書，小樹懶住在高高的樹上，夏天時想去玩水，開始慢慢地往下爬。途中他遇到了好多朋友，大家都要去玩水，他們一轉眼就到河裡去了，只剩下小樹懶還在慢慢地、慢慢地爬樹，他終於和大家一起玩水了！還得到大象媽媽的幫助，一下子就回到家。特殊的排"},{"id":"e526d73f48b54c24ae5eb5c1","n":"山田家的氣象報告（新版）","a":"長谷川義史","d":"長谷川義史","t":"李瑾倫","p":"維京國際","y":["113"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789864402830","dt":"108-09","pr":280,"desc":"趣味的畫風把山田一家人的生活日常聯想成天氣變化，弟弟尿床是淹大水，隔壁太太的髮型設計像龍捲風，堆在衣櫃的雜物崩落是大雪崩，媽媽快要發脾氣是大氣不穩定。讀者被作者的幽默逗笑，也跟著興起無限聯想。孩子透過這本書可以體會，生活中的喜怒哀樂，就像天氣無時無刻在變換一樣地正常。[113]"},{"id":"03a53a7e79dd47adbbef6b62","n":"叭!叭!叭!這是什麼車？","a":"林柏廷","d":"林柏廷","t":"","p":"","y":["109"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789862119372","dt":"108-08","pr":280,"desc":"可愛的畫風與繽紛的色彩，為寶寶們帶來「聽覺想像」；利用不同車種之間所發出的各式聲音，吸引寶寶對書本的注意，在揭曉每一臺車子之前，運用車身的剪影及相對應的場景或人物，營造出小小懸念，引發年紀稍大的孩子的好奇心。"},{"id":"7f4a713a5087424d9b75440f","n":"腳踏車輪子","a":"陳志賢","d":"陳志賢","t":"","p":"","y":["109"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":false,"isbn":"9789579529150","dt":"108-08","pr":340,"desc":"老腳踏車輪子被做成藝術品，放在公園裡， 他喜歡小動物在身上跑、孩子在身邊繞，但是他更懷念以前是輪子的時候，在土地上像風一樣的滾動。當機會來臨，腳踏車輪子決定縱身一跳，勇敢的展開一段追尋自我的旅程！透過老師傅的手，腳踏車輪子最後成為一個既符合他的天職又是一件藝術品的古董腳踏車。 整本繪本讓人印象最深刻"},{"id":"1a40ea594b0d4b07bf05edda","n":"媽媽是一朵雲","a":"海狗房東","d":"林小杯","t":"","p":"巴巴文化","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":false,"lo":true,"isbn":"9789869743754 ","dt":"108-08","pr":320,"desc":"該如何讓孩子面對失去的悲傷或想念，幫助他們解開心中的結，重建安全感？書中小青蛙回到和媽媽共處的山丘，回憶媽媽的叮嚀和一起做過的事，終於想出「我的媽媽像是一朵雲。」的造句。讓牠明白媽媽就像雲一樣，抬頭就能見。這句話療癒孩子和家人，相互陪伴，有了往前走的勇氣。[113]"},{"id":"f11cfc35293840b2a1e0870d","n":"快點！快點！","a":"林廉恩","d":"林廉恩","t":"","p":"聯經出版","y":["111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789570853247","dt":"108.07","pr":320,"desc":"在凡事講求效率、追求快速的當代生活中，「快點！快點！」不僅是我們日常的心裡話，也時常是我們對家中幼兒的催促聲。此書不以勸戒的口吻試圖導正讀者的習慣，而是以一幕幕追、趕、跑、跳、碰的劇情引人莞爾，最後再透過鮮明的對比，讓讀者跟著舒心、放鬆，家長和孩子都能各自在此書中找到共鳴。"},{"id":"67bd6e0fb5c84d5fb25fb8c5","n":"車站老鼠","a":"梅格．麥凱倫","d":"梅格．麥凱倫","t":"柯倩華","p":"","y":["109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789579529143","dt":"108-07","pr":360,"desc":"人們總著對事物抱持著成見，總覺得車站不可以有骯髒的老鼠，因此負責處理失物招領的車站老鼠，必須小心翼翼不被人們看見。 不過，還是有不排斥車站老鼠的人，例如善良天真的小孩。家長可以藉這個故事與孩子討論「成見」，鼓勵孩子應多了解不熟悉的人事物，再下判斷。"},{"id":"720bc981fde14283ae2a94cc","n":"淅瀝嘩啦下大雨","a":"大成由子","d":"秦好史郎","t":"黃惠綺","p":"","y":["109"],"ag":"0~3","c":"語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789579077606","dt":"108-07","pr":399,"desc":"淋一場暢快淋漓的大雨吧！從烏雲滿天的醞釀，大雨滴帶來天空和地面的味道，在傘面上叭啦叭啦像打起大鼓一樣，到夾著緊張帶著興奮的心情，索性走進大雨全身濕透地跟大雨來一場遊戲！作者把夏日的一場大雨，繪出了視覺、嗅覺、聽覺與愉悅的感覺。這本書引導孩子用純真的五感細細體驗身邊的事物。叭啦、呷啵、噼沙沙⋯⋯爸爸媽"},{"id":"da8657b000bd4d11b2a6de18","n":"我的美術館","a":"廖倍恩","d":"廖倍恩","t":"","p":"拾光工作室","y":["109","111","113"],"ag":"3~5","c":"身體動作、美感、認知探索","cl":true,"lo":false,"isbn":"9789869685139","dt":"108-07","pr":330,"desc":"帶孩子觀看無字繪本中的小男孩走進美術館後，如何用單純的遊戲和環境互動來「欣賞」藝術品，並讓美術館成為他即興創作的舞台。你會發現原來藝術品中的線條、色彩、光影變化、圖案或雕像，都能和生活中的人事物連結。只要你用不同的角度看世界，就會發現生活處處充滿藝術之美。[113]\n&nbsp;\n全家一起走進美術館"},{"id":"1a7d9dabff704f848003c349","n":"最棒的禮物","a":"賴馬","d":"賴馬","t":"","p":"親子天下","y":["109","110","113"],"ag":"3~5","c":"認知探索、社會情緒","cl":true,"lo":true,"isbn":"9789575034382","dt":"108-07","pr":360,"desc":"賴馬的繪本總是藏著豐富的驚喜，雖然是一本為小小孩創作的「數數書」，但每一個跨頁都豐富多彩，又隱藏著很多親子可以一起尋找的細節。 共讀時能一起玩顏色捉迷藏，猜猜動物們送的是什麼禮物，並練習互相打招呼的方式。文末動物大集合，給新生了十個寶寶的豬媽媽送禮物，畫面熱鬧歡喜，孩子會很喜歡。這本書非常適合帶出門"},{"id":"56968a19ae4f4d8581ff7d31","n":"企鵝旅館","a":"牛窪良太","d":"牛窪良太","t":"周佩穎","p":"米奇巴克","y":["113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789866215872 ","dt":"108-07","pr":300,"desc":"這本書融合了許多孩子喜愛的元素，包括動物、新奇的旅行、旅館的設備，還有精心安排的懸疑效果。孩子只要對應房間的號碼進行推理，就能猜出住房的旅客。當孩子發現空著的六號房和箭頭指向下面的七號房住進了特殊的客人時，必定會有驚喜之感。[113]"},{"id":"2a5560c5576f4e9088e82bf6","n":"夏天的早晨","a":"谷內鋼太","d":"谷內鋼太","t":"游珮芸","p":"步步出版","y":["111","112"],"ag":"3~5","c":"認知探索、美感、語言溝通","cl":false,"lo":false,"isbn":"9789579380386","dt":"108.06","pr":320,"desc":"這是個夏日早晨小男孩在鄉間騎著自行車，趕著去小山丘上看蒸汽火車的簡單故事。精煉又富節奏感的文字，搭配大量留白又極簡的構圖，卻讓人看見隨風翻飛的草浪；聞到清新的草香；聽到火車咻咻、波波的聲響。共讀時，陪孩子安靜下來，享受單純閱讀的愉快，再陪孩子畫下能陪他在天空、星空或夢裡嬉遊的長長火車。[112]\n孩"},{"id":"65753fbfa7244a3baede4f94","n":"不要一直學我啦！","a":"喬納森．艾倫","d":"喬納森．艾倫","t":"游卉庭","p":"","y":["110"],"ag":"0~3","c":"語言溝通","cl":false,"lo":false,"isbn":"9789579125468","dt":"108-06","pr":"","desc":"大海鸚打算悠閒獨自散步，未料身後卻冒出小海鷗、小小海鷗、迷你海鷗三個跟屁蟲，牠們模仿大海鸚一舉一動，大海鸚該如何擺脫、得到片刻獨處？討論幼兒常見模仿大人的現象，故事詼諧，大小角色造型皆可愛討喜，尤其角色無輪廓線的身軀，增添些許神秘。"},{"id":"031aaf0f5f2c4600845fa028","n":"鱷魚的一天","a":"喬凡娜‧佐波莉","d":"瑪麗亞恰拉‧荻‧喬治","t":"吳文君","p":"","y":["109"],"ag":"3~5","c":"美感","cl":false,"lo":false,"isbn":"9789862139745","dt":"108-05","pr":380,"desc":"這本無字書，從鱷魚先生平凡的早晨揭開序幕，然而看似平凡的一天，卻有個幽默逗趣的意外結局。鱷魚先生經歷的一天，是都市上班族很熟悉的場景，很適合讓孩子了解家長上班途中經歷的都市風景，並且在無字書的架構中，培養對圖像細節的辨識觀察。"},{"id":"9c36d887ad14495db26930dc","n":"河馬河馬大嘴巴","a":"劉思源","d":"陳完玲","t":"","p":"巴巴文化","y":["113"],"ag":"3~5","c":"社會情緒、認知探索、健康與生活","cl":false,"lo":true,"isbn":"9789869743716 ","dt":"108-05","pr":280,"desc":"孩子一定有被誤會或誤會別人的經驗，讓他們產生生氣或難過的情緒。書中的河馬為保護鴨寶寶們而把牠們含進大嘴裡，卻被大家誤會。還好鴨寶寶的解釋讓真相大白，也讓河馬和朋友合好，施展牠大嘴巴的長處。共讀時，和孩子討論遇到類似情況該如何做？再觀察非洲草原有哪些動物和牠們的特徵？[113]"},{"id":"d93d2d44f422445a81af4e6a","n":"書中有一道牆","a":"強．艾吉","d":"強．艾吉","t":"賴嘉綾","p":"三民書局","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571466019","dt":"10804","pr":329,"desc":"簡潔明快的故事節奏，幽默有趣的表現手法，隨著故事一步步推演，我們的既有成見一點一滴被鬆綁，走向巔覆想像的意外結局。許多時候，閱讀讓人享受以如上帝般的全知觀點俯看人世，坐看書中主角的侷限甚至無知，引發讀者自省，是否在我們的心裡，也有著一道蒙蔽雙眼的牆呢？[112]"},{"id":"70f0f81b8e664c99a38d06d4","n":"一起去郊遊","a":"約翰．伯寧罕","d":"約翰．伯寧罕","t":"林真美","p":"遠流出版","y":["111","112"],"ag":"0~3","c":"語言溝通、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789573284932","dt":"108.04","pr":350,"desc":"旅程不論短長，總難免發生各種始料未及的意外，而善於活在當下的孩子不但不為所苦，更每每將意外轉換成興味十足的遊戲，從中獲得樂趣，創造生命的快樂泉源。繪本大師約翰‧伯寧罕總是能在看似平淡恬靜，放鬆自在的日常故事裡，提供成人認識孩子本質的洞見，令人在不經意間體會了生命智慧。[112]\n這本可愛、充滿童趣的"},{"id":"7bdd58930e80413c9752a35a","n":"好煩好煩的長頸鹿","a":"喬里．約翰","d":"藍・史密斯","t":"游珮芸","p":"水滴文化","y":["109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869706759","dt":"108-04","pr":360,"desc":"幼齡孩童已經開始意識到自己的身體特徵， 有些孩子會有不滿意，就像此書中的長頸鹿，非常不滿意自己長長的頸子，感到困擾不已，總是羨慕其他動物。直到他遇到同樣對自己脖子不滿意的烏龜才明白 - 長脖子也有好處。此書可讓孩子學習接納自己的樣貌，學會愛自己。"},{"id":"a80152b4a5c9471da5b982d5","n":"哇！公園有鷹","a":"何華仁","d":"何華仁","t":"","p":"青林國際","y":["109","111","112"],"ag":"3~5","c":"認知探索、社會情緒","cl":true,"lo":true,"isbn":"9789862744345","dt":"108.04","pr":350,"desc":"本書是獨特珍稀的木刻版畫繪本，由愛鳥成痴，被譽為「臺灣鳥人畫家」的何華仁所創作。他以樸實雄渾的風格、蒼勁有力的線條、運鏡自如的遠觀近察，細膩刻劃大安森林公園中鳳頭蒼鷹充滿生命力的都市奇景。高度的文學性與藝術性，為我們帶來讚歎生命奧妙與自然之美的深刻感動。[112]\n作者以精湛的木刻版畫，將觀鳥的生態"},{"id":"c008ed9c41be4e8590242831","n":"小房子烏比","a":"吳語緁","d":"吳語緁","t":"","p":"","y":["109","112"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789861615998","dt":"108-04","pr":280,"desc":"先生和太太輕輕的敲門，叫醒烏比，小房子開始有了表情，有了生命，有了溫暖的故事。像似方格紙的淡雅藍格子，襯托這一家人質樸美好的平凡生活。小房子烏比，靜靜地守護這一家人，陪伴著他們的聚散離合，幸福地笑著、難過地哭著，烏比感到很滿足。[112]\n家庭與房子，是兩個不同的概念。家庭會演化，成員數目會增減，成"},{"id":"2921f31badbb46b9b73dc850","n":"阿里的車","a":"約翰．伯寧罕","d":"約翰．伯寧罕","t":"林真美","p":"遠流出版","y":["109","111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789573284949","dt":"108.04","pr":280,"desc":"對狗會開車這般異想天開的故事。阿里原本是一條難搞的狗，但如果在咖啡館得到正向接納的回應，阿里也不會難搞，倘若給阿里可以勝任的事做，那麼阿里的成就感會大大改變了他的模樣，透過繪本大師獨到詮釋的父母經，父母會心一笑有所啟發，讓孩子透過圖畫搭上狗開的車，那就更開心囉！[111]\n阿里是一隻與眾不同的狗，他"},{"id":"5979bec0ee1b4349b0984044","n":"送給你","a":"童嘉","d":"童嘉","t":"","p":"聯經出版","y":["112"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789570852691","dt":"10803","pr":270,"desc":"送給朋友自己最喜歡的東西，蘊含了最深切的情意，以及最美好的分享。童趣的造形，樸拙的筆觸，映照了如孩童般的真摯心意。簡潔的文字充滿詩意，意味深長雋永迷人。最適合用歡快愉悅的聲音朗讀出來，是0-99歲的讀者都能從中享受生命與人情之美的最佳禮物書。[112]"},{"id":"12478738259e419dbd107054","n":"我是誰？","a":"崔斯坦莫瑞","d":"崔斯坦莫瑞","t":"黃鈞荻","p":"","y":["109"],"ag":"0~3","c":"身體動作、認知探索","cl":false,"lo":false,"isbn":"9789861898766","dt":"108-03","pr":420,"desc":"這是一本可以與孩子互動的厚紙書。簡單、色彩鮮艷的構圖，可以吸引小小朋友的目光。從封面就可以開始玩，每一頁都有可以＂動手＂的驚喜：拉出耳朵，啊～是晚上不睡覺的貓頭鷹；張開眼～是喜歡跳在荷葉上的青蛙；敲敲硬殼～拉出躲在裡面的烏龜⋯⋯每一拉頁都有不同的操作方式，每一頁都寫有動物的聲音與習性，每一頁的動物表"},{"id":"38225bb6600b4721a0494ea8","n":"挖土機與小花","a":"約瑟夫‧庫夫勒","d":"約瑟夫‧庫夫勒","t":"黃筱茵","p":"水滴文化(城邦出版)","y":["112","113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789869674744","dt":"108-02","pr":350,"desc":"&nbsp;\n本書描述協助蓋大樓、外表剛強的黃色挖土機，細心柔情地照護在都市叢林中，象徵自然生命的一朵藍色小花。當僅存的花朵不敵文明發展而被摧毀時，挖土機帶著三顆種子到山上，展開守護與延續生命的使命。共讀這個大自然重生與希望的故事，引領孩子用行動擔負起保護自然的責任。[113]\n&nbsp;\n充滿力"},{"id":"f54eb4e33f154bb7bd835c3a","n":"樹林裡的房子","a":"茱莉‧福萊諾","d":"藍‧史密斯","t":"劉清彥","p":"拾光工作室","y":["109"],"ag":"3~5","c":"社會情緒、語言溝通、美感、認知探索","cl":false,"lo":false,"isbn":"9789869685115","dt":"108-02","pr":360,"desc":"一間房子帶給人的印象及功能是什麼？是遮風避雨的地方、是擺了溫熱晚餐等你享用的家，還是⋯⋯？故事透過兩個小主角探訪樹林深處一間廢棄的房子，將讀者引進對廢棄房子背後歷史的揣想與回顧。對比小主角們充滿生命力與溫馨親情的家，讓讀者們感到珍惜當下與回憶的美好。"},{"id":"6995822fe8914b3bbc9b9926","n":"好癢！好癢！","a":"陶樂蒂","d":"陶樂蒂","t":"","p":"","y":["109"],"ag":"0~3","c":"認知探索、社會情緒","cl":false,"lo":false,"isbn":"9789862942246","dt":"108-02","pr":300,"desc":"小熊突然覺得背癢癢的，前腳抓抓，抓不到；後腳抓抓，抓不到。小猴子、啄木鳥、大象、刺蝟都來幫忙抓背，但小熊還是癢得受不了！到底該怎麼辦呢？重複節奏相近的情節和語句，讓孩子加倍朗朗上口。「書中書」的情節設計，增添閱讀驚喜。"},{"id":"74cf41386e914979a4b4b728","n":"蔬菜頌歌","a":"窗道雄","d":"齊藤恭久","t":"米雅","p":"步步出版","y":["109","110","111"],"ag":"3~5","c":"語言溝通、認知探索","cl":true,"lo":false,"isbn":"9789579380270","dt":"108.02","pr":320,"desc":"孩子都不吃蔬菜怎麼辦？請與孩子一起共讀《蔬菜頌歌》日本童謠及詩歌作家窗道雄的眼中，這些蔬菜如其他生命一般，散發著光輝，小黃瓜穿著一身涼爽的綠色衣，別著那麼多晶晶亮亮的小珠珠；紅蘿蔔剛泡完澡，臉紅通通的&hellip;&hellip;，蔬菜們個個有不同的特色，就像每個人都有自己的樣子，所以我們每天要吃"},{"id":"3090dcc1486e4c2c85ca3e98","n":"比一比，誰最長？","a":"佐藤伸","d":"山村浩二","t":"蘇懿禎","p":"小熊出版","y":["109","110","112"],"ag":"0~3","c":"語言溝通、認知探索","cl":true,"lo":false,"isbn":"9789578640757","dt":"108-02","pr":300,"desc":"本書以一個富有創意的方式引導孩子認識比較的概念。作者巧妙地運用公雞和各種動物比較長短，讓孩子在閱讀過程中自然而然地學習到比較的技巧。此外，故事還強調了每個動物的特徵和長處，從而讓孩子明白比較不僅限於尺寸，也包括其他方面。這本書不僅有助於孩子提高高等認知能力，更能激發他們對個人特質的認同和尊重。[11"},{"id":"fad20eba429e4d94a3cd7480","n":"手套｛烏克蘭民間童話｝","a":"羅馬娜．洛瑪尼新、安德瑞．雷西夫","d":"羅馬娜．洛瑪尼新、安德瑞．雷西夫","t":"蔡季佐","p":"布克文化","y":["111"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789579699594","dt":"108.01","pr":320,"desc":"出身烏克蘭的兩位創作者，出版過許多圖像表現新穎、大膽的繪本作品；本書的圖畫同樣具有新意，但配合故事主題，加入針織元素在其中，重新以圖像詮釋廣為世界所知的烏克蘭民間童話，在前衛的構圖裡，更增添了幾分溫度。故事簡單，有穩定的節奏，圖畫中的小細節則為幼兒創造許多發現的樂趣。"},{"id":"790c2415889b457781188abb","n":"小麻雀，你去哪裡吃飯？","a":"田代千里","d":"田代千里","t":"方美鈴","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789864795918","dt":"108-01","pr":"","desc":"以小麻雀的視角，帶領幼兒到動物園，看看小麻雀如何和動物們一起吃飯、喝水、洗澡、睡覺、參加派對，以及和書中的小朋友們一起野餐。透過本書可認識不同動物的習性與模樣，很適合和孩子討論動物與自己的日常生活，且文字淺白，是一本讓人覺得很親切的繪本。"},{"id":"e0e1de8603df4664a56ec9c9","n":"好忙的除夕","a":"翁藝珊","d":"翁藝珊","t":"","p":"信誼基金","y":["110","111","112"],"ag":"3~5","c":"認知探索、社會情緒","cl":true,"lo":true,"isbn":"9789861615929","dt":"108.01","pr":280,"desc":"本書充滿節奏感和過年氛圍，作者以文字押韻和生動的描寫，描繪了滿桌豐盛的佳餚、年貨大街、除舊佈新、貼春聯以及孩子們最期待的領紅包等過年必備的活動，呈現了豐富的過年文化和傳統習俗，讓孩子們感受到過年的緊湊氛圍，同時也能夠體驗到傳統文化的魅力，讓親子們共同回味美好的傳統文化節慶。[112]\n本書以孩子視角"},{"id":"36e21f6155ff49e089e590d7","n":"我好無聊喔！","a":"車載赫","d":"崔恩英","t":"陳思瑋","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789579125307","dt":"108-01","pr":300,"desc":"房間地上散落著玩具、塗鴉畫冊，一個感覺無聊的小男孩咬著棒棒糖，想著如何打發這段無聊時間？他拿起一枝水藍色蠟筆，開始在自己房間的牆壁上，大膽地畫了一條線，線從房間內延伸到房間外，沿途經過各自忙碌的家人和擺設，自得其樂地在家中享受了一段無聊的甜蜜時光。"},{"id":"4a80ecc0ee364cd29189e1a4","n":"尿尿太郎","a":"吉竹伸介","d":"吉竹伸介","t":"許婷婷","p":"","y":["108","110"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789576580970","dt":"108-01","pr":250,"desc":"書中的敏感男孩堪稱是位愛思考的哲學家，敘述男孩成長過程中一件容易遇見的生理困擾，或許有些孩童不曾因尿尿會沾到內褲而困擾，但不難對書中主角感同身受。不論是親子共讀或孩童自讀，書中幽默的文圖讓閱讀變得極為輕鬆、有趣。[110]\n唉呀~尿尿稍微沾到內褲了，可是其實褲子穿上就看不見啦！而且一下下就乾了嘛！我"},{"id":"bae6bb5a122546e69c47665f","n":"在爺爺背後","a":"內弗‧席夫","d":"沙哈‧柯伯","t":"黃筱茵","p":"青林國際","y":["108","113"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789862744222","dt":"108-01","pr":280,"desc":"小男孩坐在爺爺的腳踏車後座，一路上看到的會是什麼樣的風景呢？ 雖然爺爺大大的背擋住了所有東西，但你還是可以透過男孩童稚的眼光看到許多發現，感受依靠爺爺的溫暖和安全感。閱讀這本書使我們感受到祖孫間的親情，在現今社會中彌足珍貴。[113]\n&nbsp;\n搭著爺爺的腳踏車，好舒服啊！不過每次坐在爺爺腳踏車"},{"id":"d0634d16d1c44c15b71444d3","n":"啊，怪獸！（新版）","a":"周思芸","d":"劉瑞琪","t":"","p":"遠見天下文化(小天下)","y":["113"],"ag":"0~3","c":"身體動作、社會情緒、語言溝通","cl":false,"lo":true,"isbn":"9789864798155","dt":"108-01","pr":300,"desc":"小女孩睜大了好奇的眼睛，觀察著身邊的怪獸。它在公園裡、餐廳裡、房間裡大叫：我就是要養小狗！我就是不要吃豆子！我討厭睡覺！ 繪本不帶批判地將每個父母都遇過的衝突場景，以旁觀者的角度帶到讀者面前。爸爸媽媽念故事時，也可以問問孩子：你覺得怪獸怎麼了？它為什麼叫這麼大聲？帶孩子認識情緒。孩子也因為得到大人的"},{"id":"3a81d965e8474e26b9dea40c","n":"小小挖土機","a":"安娜‧杜德尼","d":"安娜‧杜德尼","t":"黃筱茵","p":"","y":["110"],"ag":"3~5","c":"身體動作、社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789863382287","dt":"107-12","pr":"","desc":"以各式擬人化的土木機具為角色，以工地為場景，描寫小小挖土機（兒童）與各式大型機具（大人）的互動，一則介紹機具、一則傳達孩童雖弱小，但具關鍵重要性。書中圖像化的文字凸顯擬聲字、動詞、形容詞；滿版出現畫面及近距離特寫，則邀請小讀者走進故事。"},{"id":"e05be08f8b4942b587f04ccd","n":"小狐狸回家","a":"茱莉‧湯普森","d":"賈斯汀‧湯普森","t":"游珮芸","p":"米奇巴克","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866215797","dt":"10711","pr":300,"desc":"好的兒童文學帶領讀者跳脫人類視角，發現不同觀點。當我們跟著孤單的小孤狸一起沈浸在追憶童年與思念親人之時；當我們發現因人類社會的高度開發致使狐狸找不到回家之路時，我們深刻明白自然生態的重建刻不容緩，並在故事的巧妙安排下，相信人們的努力終將帶來改善與希望。[112]"},{"id":"2efe841c7603492f83bea5ee","n":"有時爸爸家，有時媽媽家","a":"芭絲卡．芙翁古特","d":"芭絲卡．芙翁古特","t":"吳宣恩","p":"大穎文化","y":["111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789579125239","dt":"107.11","pr":290,"desc":"作者以細膩筆觸刻畫出家庭成員間的情感變化，運用孩子的口吻和視角敘寫父母離異時，主角從一開始的害怕、無助、適應到坦然接受的心路成長，也才明白原來有時爸爸家，有時媽媽家，也能擁有三個人的幸福！"},{"id":"b675291e5f7b41909dfc510a","n":"遊戲場發生什麼事？","a":"超級可愛月亮班","d":"超級可愛月亮班","t":"","p":"遠流出版","y":["111"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789573284062","dt":"107.11","pr":320,"desc":"清楚描述小朋友設計遊樂場的過程，彼此分工合作想辦法解決遇到的問題，也讓大人們了解孩子們的想法，當孩子閱讀這本書時，也可以學習表達自己的想法，書中小朋友畫的圖畫也能拉近本書與家中孩子之間的距離。"},{"id":"693d2936686c498daf09f6fb","n":"白貓黑貓","a":"菊地知己","d":"菊地知己","t":"米雅/","p":"拾光工作室","y":["108","109","112"],"ag":"3~5","c":"社會情緒","cl":true,"lo":false,"isbn":"9789869685108","dt":"107-11","pr":350,"desc":"在耀眼可人的白貓身旁，始終見不到自我價值的黑貓，終於在歷經生命追尋之旅後，在天寬地闊、兼容並蓄的大地之母懷裡，找到了安身立命的一角，閃耀自己獨特的光芒。揮灑奔放的筆觸、濃淡交織的水彩，變化多端的光影，如東方水墨畫的特有風格，為這個故事賦予絕佳的藝術性與說服力。[112]\n白貓喜歡黑貓黝黑的毛色，黑貓"},{"id":"aecc23ebe68642d6b88d1f39","n":"風之星","a":"新宮晉","d":"新宮晉","t":"林真美","p":"維京國際","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864402540","dt":"10710","pr":320,"desc":"這本書的主角是風，畫家用詩的語言和繽紛的圖畫，讓我們跟隨風的眼睛，透過不同視角和高度的轉換，結合視覺、觸覺和聽覺，感受風在不同季節、時間越過陸地、海洋、山脈和不同生物一起同行的感覺，引領我們去探看地球的自然之美。共讀時，輕聲朗讀文字，引領孩子欣賞如空拍美景般的藝術畫作，進行一場美的心靈饗宴。[112"},{"id":"8862b763d39c4f39a51854dd","n":"失物招領所","a":"澀谷純子","d":"澀谷純子","t":"張詩宜","p":"布克文化","y":["111"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789869551618","dt":"107.10","pr":300,"desc":"本書不只有好看的故事，每一個上門尋找遺失物的動物，也都是一道道謎題。作者將預測猜謎的遊戲自然融入在故事中，為這本書增添許多樂趣，且充滿層層疊疊的幽默感與驚喜，故事最後還有意想不到的發展，是一本能讓孩子開心投入、享受參與故事的作品。"},{"id":"b98859aabf3646f391fe95bd","n":"這是我的位子！","a":"羅恩敬","d":"羅恩敬","t":"賴毓棻","p":"布克文化","y":["111"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789579699297","dt":"107.10","pr":300,"desc":"小狗汪汪和小貓喵喵是我的好朋友，但我更喜歡和爸爸玩，每當我坐在爸爸腿上時，汪汪和喵喵總是想要搶走我的位子，因為牠們也喜歡爸爸。這可不行，那是我的位子啊！ 孩子為何需要一個位子？因為那是安全感和愛的來源，小主人翁捍衛著自己的位子，卻忽略毛小孩們的感受，其實愛是可以共享的，書中可愛有趣的角色互動正是「分"},{"id":"dc065b92f284471bad55d73f","n":"當小偷的第一天","a":"劉旭恭","d":"劉旭恭","t":"","p":"巴巴文化","y":["108","109"],"ag":"3~5","c":"認知探索","cl":false,"lo":true,"isbn":"9789869629300","dt":"107-10","pr":350,"desc":"今天，是當小偷的第一天。貓老大召集大家，要每個人拿出自己的戰利品。這本書的形式很特別，每一頁的寬度會比上一頁的寬度多一些，像是階梯一樣。掀開每一頁時， 隨著逐漸變寬的頁面，可以發現他們偷來的東西，最後還有出乎意料的結局。[109]\n今天，是當小偷的第一天。小豬得意的說：「我找到一鍋剩飯！」小狗搖著尾"},{"id":"aa8499d4d5af4587954bbe95","n":"我和怕怕","a":"法蘭切絲卡．桑娜","d":"法蘭切絲卡．桑娜","t":"黃筱茵","p":"讀書共和國(字畝文化)","y":["108","109"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789869674454","dt":"107-10","pr":350,"desc":"每個人心中都有一個怕怕，它可以是保護我們的機制，但如何與它和平共處，不被吞噬是需要學習與得到幫助的。新移民的小女孩因過度膨脹的怕怕而阻礙了她許多學習或交往的機會，直到她認清了這樣對自己不好， 且知道別人也需克服同樣的問題後，找到了自己的定位與勇氣。[109]\n即將面對新環境的小女孩，雖然有小夥伴「怕"},{"id":"6100fadbe48f47dc8782c555","n":"電車來囉！","a":"三浦太郎","d":"三浦太郎","t":"鄭明進","p":"小魯文化","y":["111"],"ag":"0~3","c":"認知探索、生活自理、語言溝通","cl":false,"lo":false,"isbn":"9789862118474","dt":"107.09","pr":290,"desc":"0~3歲的嬰幼兒會有一陣子的愛玩不愛吃的時期，爸爸和媽媽經常煩惱寶寶連蔬菜、水果和肉都不吃怎麼辦？本書以電車、平交道，讓小朋友期待即將進站的各種小動物和他們最愛的食物，顏色鮮艷、動物造型很可愛，各種食物玲瑯滿目，最後還有驚喜的超級大餐跨頁設計。這是本啟發幼兒聯想力和統合力的恢復食慾繪本！"},{"id":"712364e584e24fca946f7dd0","n":"活了一百萬次的貓","a":"佐野洋子","d":"佐野洋子","t":"林真美","p":"步步出版","y":["109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869677813","dt":"107-09","pr":320,"desc":"有一隻貓，他死了100 萬次，也活了100 萬次。每一次牠死去時，牠的主人都哭得很傷心，但這隻活了100 萬次的貓，卻一次也沒有哭過，因為牠從來都沒有愛過誰。有一次，牠遇見一隻白貓，第一次，他，愛上了別人⋯⋯。他終於體會到愛的感受，那種喜悅與悲傷的歷程深植人心。"},{"id":"0dcbe2978ef443ebacbedb1f","n":"今天真好","a":"理查德‧傑克遜","d":"蘇西‧李","t":"黃又青","p":"阿布拉教育文化","y":["108","111","112"],"ag":"0~3","c":"身體動作、語言溝通、美感","cl":true,"lo":false,"isbn":"9789865876517","dt":"107.09","pr":280,"desc":"因為能夠盡情跳躍奔跑，因為能夠隨心所往，舞動身體，天天都真好！書中每一筆如行雲流水般的流暢線條，都展現了身體躍動的自在歡愉，喚醒孩子身為動物那內在本能的自我覺察。對孩子來說，認識自我必須從享受身體自由律動的歡愉開始，為獨立自主心靈的養成打好堅固基礎。[112]\n一開始只有黑白兩色加上簡單的線條，慢慢"},{"id":"e42fa0a32c8243c09a7e5957","n":"我和我的冠軍甲蟲","a":"信實","d":"信實","t":"蘇懿禎","p":"小熊出版","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789578640320","dt":"10708","pr":300,"desc":"書中的小康不僅為心愛寵物昆蟲取名為「冠軍」，更為了實現「冠軍」的夢想陪牠展開訓練，並在昆蟲大賽關鍵時刻，讓「冠軍」知道，他會一直陪伴牠。這種超越寵物與飼主的關係，轉化成夥伴之間的愛與支持，他們才能實現夢想。共讀時，孩子能從閱讀中體會如何珍惜和重視陪伴自己的寵物，在友情中找到勇氣和力量。[112]"},{"id":"766cf30ea70b447484256fbb","n":"屁屁工廠","a":"茂利勝彦","d":"茂利勝彦","t":"邱瓊慧","p":"東方出版","y":["111"],"ag":"3~5","c":"認知探索、健康與安全","cl":false,"lo":false,"isbn":"9789863382164","dt":"107.08","pr":280,"desc":"本書滿足幼兒對自己身體充滿著探索的好奇心，特別是對每天都會從身體釋放的生產物倍感興趣，很多社會對於在公眾場合放屁有所禁忌，故事也點出故事主角不斷忍耐的情節，但整個工廠是競競業業地製造屁屁，親子共讀時可適時討論「想放的時候就放」的心願，在不同場合該怎麼做才有益健康。"},{"id":"30fd10920e944676a0cbdbfc","n":"咚咚咚，下一個是誰？","a":"矢野朱美","d":"矢野朱美","t":"蘇懿禎","p":"小熊出版","y":["110","111"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789578640344","dt":"107.08","pr":300,"desc":"動物們排排站，要小心別撞到別人喔！ 最小的老鼠排第一個，旁邊是大一點的兔子，再來是更大一點的浣熊&hellip;&hellip;下一個會是誰呢？本書將動物由小到大排列，再輕輕一推，咚─咚─咚，來個動物骨牌遊戲。除了體驗大小、序列的概念，對孩子來說，更重要的應該是骨牌倒下所產生的驚喜和趣味吧 ！不信，"},{"id":"0ec0017ff8a4421aba1bbdb7","n":"森林裡的小狐狸","a":"史蒂芬妮‧葛雷琴","d":"史蒂芬妮‧葛雷琴","t":"","p":"水滴文化","y":["108","109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869634069","dt":"107-07","pr":360,"desc":"這本無字書，訴說小女孩發現自己心愛的布偶被小狐狸偷了之後，一路追到森林裡，終於找到偷走布偶的小狐狸。在這個故事中， 偷走布偶的小狐狸並不可惡，而是反映了幼齡孩童對於喜歡事物的「所有權」仍處於蒙昧無知的階段。家長可藉此書與孩子討論 「喜歡的東西是否就能據為己有呢？」[109]\n安靜卻充滿力量的無字繪本"},{"id":"26c1e8c5133449d8a3b518c7","n":"一起去動物園","a":"林柏廷","d":"林柏廷","t":"","p":"","y":["109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789573283188","dt":"107-07","pr":280,"desc":"親人的死亡，是小孩生活中也可能碰到的課題。幫助幼齡孩童思考生命教育議題，更是重要。此書中以小姐姐的口吻，對生病住院的弟弟表達關愛與想念，相約病癒之後一起去動物園，不論最後心願有無達成，讓想像中的可愛動物陪伴住院的弟弟，對小姐姐而言，已是莫大的心理慰藉。"},{"id":"8521c7feed834c90ba4e694a","n":"71隻小羊踢足球","a":"巴布羅‧艾爾伯","d":"谷瑞迪","t":"陳伊莎","p":"采實文化","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789578950368","dt":"10706","pr":320,"desc":"當小羊發現牠們不多不少正好71 隻時，決定來場刺激的足球比賽。可是，球一踢出去，就卡在樹上了。小羊們想盡各種方法把球弄下來，怎麼少了一隻羊？接著狼來了&hellip;&hellip;比賽到底什麼時候可以繼續呢？插圖簡潔有力，很貼近孩子的筆觸，讓孩子在哈哈大笑中，想一想、找一找，學習以不同的角度看待問"},{"id":"bff58135498649dcb788b336","n":"可莉米的白色畫布","a":"李賢珠","d":"李賢珠","t":"賴毓棻","p":"","y":["108","109"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789579699129","dt":"107-06","pr":300,"desc":"看著冬天陰沉的灰暗天空，可莉米用白色蠟筆，在灰色天空中畫上白雪，這時神奇的事情發生了！她畫的白雪變成片片雪花，一轉眼就堆積成雪堆⋯⋯。故事最後面的一頁留白，讓讀者能發揮想像和可莉米的朋友們一起自由玩耍！[109]\n在白雪皓皓的冬日世界裡，可莉米用白色蠟筆，在灰色天空中畫上白雪，在堆滿積雪的森林深處，"},{"id":"7dfd2b00260043c7ba3bbbdd","n":"嘰咕怪","a":"愛德華．蒙梭","d":"愛德華．蒙梭","t":"周婉湘","p":"上誼文化","y":["109","110","111"],"ag":"0~3","c":"認知探索、美感","cl":true,"lo":false,"isbn":"9789577626356","dt":"107.06","pr":300,"desc":"嘰咕怪想要來抓我，但我一點都不害怕，只要對著嘰咕怪的身體搔癢，他就會慢慢人間蒸發，因為嘰咕怪最怕被「嘰咕嘰咕」了。這是一本充滿創意、幽默和愛的圖像魔法書，原來嘰咕怪被搔癢魔法變不見的身體並沒有真正消失，而是轉化成月亮、樹木、汽車和讓孩子安心睡覺的房子，所以說可怕的妖怪也是有美好本質的。[111]\n怪"},{"id":"4c8a836b4d7e43b5a1df29d1","n":"左先生與右先生","a":"丹尼爾．費爾","d":"塞莉絲特．艾里斯","t":"酪梨壽司","p":"三民書局","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571463865","dt":"10705","pr":329,"desc":"左先生與右先生很想見面，卻沒辦法跨越書頁。動手翻一翻，看看有什麼辦法可以讓左先生和右先生在同一頁，不再寂寞！插圖利用幾何圖形勾勒出獨特的人物造型與場景，跨頁中間的留白，成功凸顯最遙遠的距離就在隔壁。巧妙運用翻頁設計，讓人物彷彿可以穿越書頁的框架上天下地，蘊含無限的想像力。[112]"},{"id":"ca0f1d32f4914a7e93d1ae4b","n":"形狀國王","a":"小杉早苗","d":"立本倫子","t":"蘇懿禎","p":"小熊出版","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789578640269","dt":"10705","pr":300,"desc":"本書充滿創意和啟發性，透過生動的圓形、三角形和四方形角色，讓孩子們融入一個幾何形狀的奇幻世界，巧妙地將數學概念融入引人入勝的故事情節中，使孩子在享受閱讀的過程中，自然而然地學習到形狀組合及其特點。作者以生動有趣的方式，激發孩子們的好奇心和探索精神，使得這本書成為幼兒教育的佳作。[112]"},{"id":"4e5468ebd9de49a9aa04e318","n":"公園裡有一首詩","a":"米夏‧亞齊","d":"米夏‧亞齊","t":"吳其鴻","p":"","y":["109","110","112"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":true,"lo":false,"isbn":"9789866215728","dt":"107-05","pr":300,"desc":"小男孩從動物觀察和描述世界的方式，明白只要你用心觀察和傾聽，即使身處在城市之中，也能發現大自然的美，美妙的詩就在你身邊。獨特的拼貼藝術，營造色彩豐富又有質感的自然美景。共讀時，可朗讀詩般的句子，引導孩子觀察詩句與圖畫的關聯，進而一起到公園觀察、感受，再寫下自己的詩，做成一本小詩集。[112]\n小男孩"},{"id":"1227401a03654547b5c504b5","n":"月亮想睡覺","a":"林思辰","d":"林思辰","t":"","p":"信誼基金","y":["111"],"ag":"3~5","c":"美感、生活自理","cl":false,"lo":true,"isbn":"9789861615776","dt":"107.04","pr":250,"desc":"孩子不想睡覺時，家長可以和孩子一起讀這本單純色系的故事書，本書描繪晚上四周靜悄悄的，月亮守護著大地，但是月亮也有工作疲累的時候，月亮問各種小動物、小花朵，「我可以一起睡覺嗎？」請家長陪孩子找一找，哪一個是有屁股溝的月亮喔！"},{"id":"9b2fbad8bbde4956aa35ae4d","n":"企鵝體操","a":"齋藤槙","d":"齋藤槙","t":"葉依慈","p":"","y":["107","108","110"],"ag":"0~3","c":"身體動作、健康與安全","cl":false,"lo":false,"isbn":"9789866215704","dt":"107-04","pr":320,"desc":"用動物跳脫只有人能做動作的束縛，吸引幼兒的注意力，還有書中富有韻律感的體操口訣，搭配簡單的韻律運動，讓活動力較旺盛的的幼兒也能享受書本的樂趣。鮮明的繪圖風格，就算不懂文字，看著圖片就能一起動起來！[110]\n企鵝體操要開始嘍。吸氣──吐氣──伸長 脖子，縮起脖子──拍拍翅膀，啪噠啪達。 兩歲幼兒已經"},{"id":"6a75d16872ad4fb9a1e93c82","n":"月球旅行指南：小兔子的月球之旅","a":"PHP研究所","d":"藏澄咲帆","t":"卓文怡","p":"小熊出版","y":["112"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789578640177","dt":"10703","pr":320,"desc":"小兔子想要去拜訪在月亮上搗年糕的兔子朋友，於是參加月球旅行團，認真研讀月球旅行指南，認識了月球的形成、月相的變化、月球引力造成的潮汐效應、月食與日食的原理、月海的形成過程。小兔子準備好了，讓我們陪著小兔子「走」一趟月球之旅吧！不，走路去月球要11 年，還是搭乘太空船較快。[112]"},{"id":"ad457f13845f4299ba472745","n":"今天的月亮好圓","a":"荒井良二","d":"荒井良二","t":"林真美","p":"遠流出版","y":["108","110","111"],"ag":"0~3","c":"認知探索、美感","cl":true,"lo":false,"isbn":"9789573282280","dt":"107.03","pr":300,"desc":"在忙碌一整天後，爸爸媽媽有沒有過牽起孩子的手，一起看月亮呢？本書描繪夜景的繪本塗色飽滿、黑色背景下更顯出顏色鮮豔，當透過窗戶或抬頭望向天空，圓圓大大的月亮高掛在空中，城市、森林、馬戲團許多故事正在發生，散發著溫暖的氣息，藉由此書，讓家長與孩子在晚間可多留意天空中的月景和發揮想像力，也可藉由溫暖的月色"},{"id":"20a2fff0229d4b7d9b79a233","n":"我只是想要說晚安","a":"瑞秋．伊莎朵拉","d":"瑞秋．伊莎朵拉","t":"黃迺毓","p":"上誼文化","y":["107","109","110","111"],"ag":"0~3","c":"社會情緒、語言溝通","cl":true,"lo":false,"isbn":"9789577626332","dt":"107.03","pr":300,"desc":"每個經歷育兒階段的家庭中，通常都有個捨不得上床睡覺的孩子。這本書以溫暖的色調、恬靜的氛圍，營造出安穩的氣息。書中小女孩的睡前儀式展現在小讀者面前，也宛如一首漸弱的催眠曲。另外，小女孩溫柔對待萬物，以及適當表達情緒的小動作，皆能引發幼兒共鳴，深得同理。[111]\n入睡前的儀式中，跟身邊的人與物說聲「晚"},{"id":"a7608913b6c540aaa84cae4f","n":"OH．．．我好害怕．．．","a":"劉彤渲","d":"劉彤渲","t":"","p":"小文房","y":["107"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869577465","dt":"107","pr":280,"desc":"我們也跟小巴士一樣，從小就憧憬長大後的美好。但長大後，才發現好多事物等著面對、處理，工作也沒想像的神氣。受傷的靈魂開始退縮，只想回到原點。終於，小巴士在旁人的協助下，克服恐懼，勇敢面對挑戰，走向未來，為自己開啟一條理想大道。"},{"id":"172e869dbf3841b280f9f4d3","n":"害怕黑夜的大象","a":"馬丁．巴茲塞特","d":"卡特琳娜．西格","t":"林敏雅","p":"水滴文化","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789869634021","dt":"107-06","pr":380,"desc":"強壯又勇敢的大象，在夜裡會睡不著，黑暗吃了牠的勇氣。大象總嚇得左衝右撞，跑到沒力氣就睡著了。動物們聽說有東西到處破壞森林，感到很害怕，決定找大象保護牠們&hellip;&hellip;超大摺頁，隱藏精采可愛的結局！最適合睡前閱讀的床邊故事。"},{"id":"d41fb7637e98434da240d759","n":"誰說不能往上挖？","a":"丹‧雅卡理諾","d":"丹‧雅卡理諾","t":"李貞慧","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865730895","dt":"107-03","pr":320,"desc":"勇於嘗試才有機會看見不一樣的風景。小鼴鼠莫里斯個子小小的，內心卻藏著大大的勇氣。他和哥哥們住在地洞裡，有一天，食物吃光了！所有鼴鼠拚命往地底下挖，小小的莫里斯卻有個絕佳的好點子&hellip;&hellip;鼓勵孩子挖掘內心勇氣的溫暖故事。"},{"id":"0aae7f36986745b9bfbedf14","n":"誰來幫我拍拍睡？","a":"約格．穆勒","d":"約格．穆勒","t":"李紫蓉","p":"","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864793327","dt":"107-01","pr":260,"desc":"《誰來幫我拍拍睡?》邀請小小孩一邊聽故事，一邊幫小兔子阿尼拍拍睡，從換睡衣、拍鬆枕頭、揉揉背，到蓋被被都完成囉，「啾」再給他一個晚安親親，「晚安，阿呢！」完成了入睡前的儀式，小小孩也懷著安心、滿足的心情進入夢鄉。[107、108]\n&nbsp;"},{"id":"b129c7f797e44ec1a362b2ea","n":"寶貝瑜伽──幼兒的第一本瑜伽書","a":"瑞貝卡．惠特福德","d":"瑪蒂娜．賽爾韋","t":"麥維","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864401451","dt":"107-12","pr":260,"desc":"《寶貝瑜伽》中收錄九個溫和、簡單的幼兒瑜伽體式，從模仿動物開始，讓孩子用有趣的方式認識瑜伽。這本充滿活力的繪本除了九個基本瑜伽動作，還包含「給家長和照顧者的話」、「練習小祕笈」讓孩子更加自信。瑜伽練習強調的「靜」與「止」，也有助於幫助孩子們平靜下來、放鬆身心。"},{"id":"1c7aaed592904eabb0a8844f","n":"小小人兒來幫忙──快樂星期天","a":"中川千尋","d":"古寄純嗣","t":"周姚萍","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862118580","dt":"107-11","pr":300,"desc":"「小小人兒來幫忙」的系列第四集，一本能在畫面各角落享受到發現樂趣的圖畫書，快樂玩耍的小小人兒，他們穿便服的模樣也超級可愛呢！今天是星期天，小小人兒的放假日，大夥兒一起去野外玩耍囉。可是，小小人兒發現了一隻遇到麻煩的烏龜，小小人兒會怎麼做呢&hellip;&hellip;？"},{"id":"414810c7dd3646f5834f4465","n":"瘋狂的一天：JUNE 29, 1999","a":"大衛威斯納","d":"大衛威斯納","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861898636","dt":"107-09","pr":300,"desc":"在大衛威斯納筆下，1999 年6月29日，發生在美國的天降蔬菜事件，既瘋狂荒謬，又讓人感覺真實。大紅椒、大茄子、大豌豆、大南瓜等，降落在美國各城市。蔬菜成為蓬勃發展的新興產業，人人為之瘋狂！它們不但可以吃，還可以用來蓋房子、做雕刻！這一切來自於一個名叫荷莉的女孩所做的瘋狂實驗！"},{"id":"7fca882b7e82434488e79f22","n":"我們來比高","a":"艾米勒賈杜","d":"艾米勒賈杜","t":"賴羽青","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789861898360","dt":"107","pr":299,"desc":"高個子的小兔喜歡玩球，就算球踢到牆上也拿得到。小雞、小豬、小鴨、小羊也想玩球，但小兔只願意和高個子玩。小動物們不論是抬頭挺胸、偷偷墊腳尖，還是比小兔矮了一點。正當小兔得意時，突然咚的一聲，球被踢到一個望不到頂的牆上，這下連最高的小兔也拿不到&hellip;&hellip;"},{"id":"0fc280dc485c4c6d92ab4f18","n":"小紅母雞","a":"皮耶・德里","d":"瑟西兒‧羽德希吉耶","t":"尉遲秀","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789579095075","dt":"107","pr":280,"desc":"溫柔的小紅母雞發現了一些小麥種子，她邀請小豬、小貓和鴨子一起分工合作栽種，這三個朋友總是找各種理由拒絕幫忙&hellip;&hellip;等到小紅母雞用辛苦收成的小麥烤了香噴噴的蛋糕，他們居然跑來說要「幫忙吃」！一直忍氣吞聲的小紅母雞會怎麼回應？"},{"id":"c4e15548b29c4250ab429d1a","n":"雪獅","a":"吉姆‧黑爾摩","d":"理查德‧瓊斯","t":"游珮芸","p":"親子天下","y":["108","111","112"],"ag":"3~5","c":"社會情緒","cl":true,"lo":false,"isbn":"9789579095112","dt":"107.04","pr":300,"desc":"卡蘿與媽媽搬到小山丘上的新房子，房子裡有很多地方可以探險，但卡蘿希望有人可以陪她一起玩。她有了新朋友──雪獅，她們玩捉迷藏、比賽跑步。雪獅鼓勵卡蘿去公園玩，因而認識了新朋友。有時候，我們需要一位像雪獅這樣獨特的朋友，幫我們找到隱藏在內心裡的勇氣。[112]\n「雪獅」是主角卡蘿想像出來的特別朋友，在卡"},{"id":"4a4e002ce2d0442f8ae043b0","n":"朱瑞福的游泳課","a":"賴馬","d":"賴馬","t":"","p":"親子天下","y":["108","110","111"],"ag":"3~5","c":"身體動作、健康與安全","cl":true,"lo":true,"isbn":"9789579095914","dt":"108.07","pr":360,"desc":"本書以生活經驗鋪陳，人物角色平易近人，背景考究寫實，孩子很容易將自己生活上的挫折，投射到故事中。面對全班都學會，只有自己學不會，主角朱瑞福示範了不放棄的精神、態度，以及行動力。本書圖畫細膩，幽默詼諧，孩子能從圖畫中想像身體活動的樂趣，值得親子花時間仔細討論圖畫，鼓勵運動。[111]\n運用孩子熟悉的生"},{"id":"bfbc4ea6cae341948f1b0318","n":"美好動物園","a":"李憶婷","d":"李憶婷","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789574436088","dt":"107-08","pr":320,"desc":"美好動物園開門了！遊客們在左邊排隊，準備上班的動物往右邊走。動物們紛紛在自己的工作區開始工作，在海豹表演區，海豹認真的表演特技、在豹點時尚區，豹姐優雅地走臺步走秀、猴子大樂隊正在準備演奏表演&hellip;&hellip;。但，今天是小刺蝟尖尖第一天上班，他卻不知道該往哪裡去，究竟尖尖在動物園裡的工"},{"id":"5013002bcb0c4f7abc5afffc","n":"討厭的颱風","a":"王春子","d":"王春子","t":"","p":"遠流出版","y":["108","111","112"],"ag":"3~5","c":"認知探索","cl":true,"lo":true,"isbn":"9789573283737","dt":"107.10","pr":380,"desc":"這本描寫颱風生命週期的書，巧妙地將颱風擬人化，讓讀者更容易理解其中的奧妙。書中生動地呈現了颱風形成的原因，以及颱風來襲時所帶來的破壞和危險。同時，書中也展現了颱風過後美好的風景和帶來的好處。在颱風放假期間，家長可以與孩子共讀此書，引導孩子思考颱風帶來的影響，增強他們的災害意識和安全意識。[112]\n"},{"id":"2770d9a3f8834f798edf2e07","n":"是誰躲在草叢裡","a":"鄭潔文","d":"鄭潔文","t":"","p":"","y":["108","109"],"ag":"3~5","c":"認知探索","cl":false,"lo":true,"isbn":"9789570850628","dt":"107-01","pr":330,"desc":"是誰躲在草叢裡？用羨慕的眼光看著別人。是誰躲在草叢裡？期待別人來接近他。小朋友都曾經有過這樣一段害怕不被團體接納的時候。但是只要學習故事中的主角勇敢走出去，一定會發現大家其實很喜歡你喔！這本繪本除了給孩子這樣的概念之外，最特別的是故事裡的主角是臺灣黑熊，他生活的環境裡有金剛櫟、呂宋莢蒾；他的朋友有石"},{"id":"1df0b929e8014c41a0f4e531","n":"很久很久以前……大家來過河","a":"維若妮卡‧馬賽諾(V'eronique Massenot)","d":"克蕾夢絲‧波列(Cl'emence Pollet)","t":"王卉文","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571463667","dt":"107-01","pr":299,"desc":"很久很久以前有隻大象想過河，很快的來了兩位新伙伴，接著又有幾位、再幾位的朋友加入牠的行列。身上載滿乘客，大象像一艘大型郵輪般啟航了&hellip;&hellip;一段為了過河而展開的小小冒險，一首如詩般的短短童話，呈現出一則關於分享與感謝的美麗故事。"},{"id":"f11ba2caf0e8439fa27526b9","n":"來自火星的男孩","a":"賽門‧詹姆斯(Simon James)","d":"賽門‧詹姆斯(Simon James)","t":"黃筱茵","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571464640","dt":"107-11","pr":299,"desc":"媽媽出差的那一天，史丹利決定前往火星。接著家中出現了一位跟史丹利長得一模一樣的火星人，但他的行為和史丹利處處相反，不僅不愛乾淨，甚至在學校惹事&hellip;&hellip;這一則溫暖人心的故事，蘊含了幼兒角色扮演與假想、情緒發展、冒險探索、愛與包容的主題。"},{"id":"bb6ce188d51f470abe8e03d0","n":"香蕉爺爺香蕉奶奶","a":"野志明加(のしさやか)","d":"野志明加(のしさやか)","t":"米雅","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571464879","dt":"107-11","pr":299,"desc":"小蕉蕉家裡有爸爸、媽媽、爺爺和奶奶，總共五個成員。有一天，地上竟然出現一張剛脫下來的香蕉皮&hellip;&hellip;誰說熟齡香蕉一定是又軟又黑？誰說年紀大了點就不能愛美愛自己？就讓這群魅力四射的老人「蕉」來告訴你，他們不只要活到老，更要FASHION 到老，快樂到老！"},{"id":"2f1dbbd657e34fd7ac44b319","n":"蘋果園的12個月","a":"松本猛","d":"中武秀光","t":"陳瀅如","p":"幼獅文化","y":["111"],"ag":"3~5","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789864490974","dt":"106.12","pr":280,"desc":"平時常常見得到、吃得到的蘋果，究竟是如何種植出來的？本書不用知識科普的理性口氣向讀者介紹，而是以具有溫度的書信口吻，由故事中的舅舅向小外甥娓娓道來。本書是蘋果農家的一年農務記事，也蘊含了親族羈絆的情感，和自然餽贈的豐盛。"},{"id":"9abf4cf5918b44dbb8afb8a6","n":"小雪球的夢想","a":"李宰京","d":"李宰京","t":"劉清彥","p":"","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789865664350","dt":"106-12","pr":"","desc":"故事開頭，小雪球羨慕大雪球的巨大，就像每個小孩都想快點長大一樣。但長大的過程不僅漫長，且往往伴隨著挫折。本書細膩地描繪了小雪球的成長過程，圖文都很有深度，因為親子共讀，孩童可能在幼時就接觸到它，而它是本可以讀一輩子的書。"},{"id":"2f38ab9cf4864d02a4d60c16","n":"小小船，小心哦！","a":"五味太郎","d":"五味太郎","t":"李慧娟","p":"","y":["109"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789864401987","dt":"106-12","pr":250,"desc":"好可愛的擬人化寶寶書，小小船就像一個對世界充滿了好奇的小小孩，迫不及待地出發去探險。一路上除了美好的風景，也有疼愛他的人不時的提醒著：「小小船，小心喔！」 作繪者以簡潔的大色塊及線條述說這個充滿元氣，且易朗朗上口的溫馨故事，能引發孩子的興趣與勇氣。"},{"id":"7189bb96f8364d5c87b430e2","n":"媽媽的畫像","a":"劉智娟","d":"劉智娟","t":"蘇懿禎","p":"","y":["109"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":false,"isbn":"9789863381877","dt":"106-12","pr":280,"desc":"與我們每天在一起的媽媽，有著什麼樣不同的樣貌？有著什麼樣不說出來的內心世界？我們想過嗎？左邊頁面是腳底粗糙、平凡、為家庭付出、 熟悉的媽媽的樣貌；右邊頁面是熱情、敏感、自尊、愛打扮的美英。 在每天平凡的生活裡，每個媽媽心裡都有個浪漫、美麗、愛旅行的探險家。 帶孩子認識媽媽的內心，跟孩子一起畫畫看，你"},{"id":"5ebaa41b5ff844fa8abbd529","n":"時間長或短？","a":"莉亞‧杜凡妮","d":"亞莉安娜‧妲布里妮","t":"陳俊蓉","p":"幼獅文化","y":["111"],"ag":"3~5","c":"認知探索、語言溝通","cl":false,"lo":false,"isbn":"9789864490929","dt":"106.11","pr":280,"desc":"人類的「時間概念」發展比較緩慢，父母常不了解，以孩子聽得懂的時間語言，才能有效溝通，此書恰好讓父母有機會，正視幼兒正在發展的「時間概念」和成人的有所不同，絕不可能強求幼兒快速完成時間概念的發展！但父母可協助幼兒以生活具體經驗，連結時間的概念和語言。"},{"id":"1241cfec981e4399af9ad95b","n":"我喜歡……","a":"安東尼．布朗","d":"安東尼．布朗","t":"余治瑩","p":"維京國際","y":["111"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789864401635","dt":"106.11","pr":250,"desc":"作者運用動物形象的主角畫出一件又一件生活上的事情，讓孩子在閱讀的同時將自己代入，找出自己喜歡的事情，並認識那些還沒做過，但未來可以去做的事情。"},{"id":"51555c72e4804bfeb669468c","n":"獅子補習班","a":"強‧艾吉","d":"強‧艾吉","t":"柯倩華","p":"","y":["107","108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866215667","dt":"106-11","pr":280,"desc":"小男孩拜獅子為師，學習成為強者，經過七堂課的訓練，他能順利拿到獅子證書嗎？獅子補習班課程設計很有趣，首先，要學會做出凶猛的樣子，接下來要選擇食物，還要悄悄偵察，並具備獅子吼的技能，最重要的一堂課是&hellip;&hellip;。"},{"id":"57fb8540815241be9ff91e9b","n":"你的心情好嗎？","a":"安東尼．布朗","d":"安東尼．布朗","t":"俞治瑩","p":"","y":["109"],"ag":"0~3","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789864401642","dt":"106-11","pr":250,"desc":"控制情緒的第一步，就是要學會感知情緒， 進而清楚地表達情緒，並練習由大腦前額葉思考來取代衝動的杏仁核。這是一本可以幫助孩子辨認情緒的書：感覺孤單，感覺生氣，開心得想大叫，難過得想哭⋯⋯每個頁面都有一個情緒名詞，輔以簡單明瞭的圖畫，孩子可以從書中認識情緒， 進而對照、找到自己要表達的情緒。透過這本書，"},{"id":"4eb4703ca4e447469168f0ab","n":"森林照相館","a":"李時遠","d":"李時遠","t":"許延瑜","p":"青林國際","y":["111"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789862743386","dt":"106.10","pr":280,"desc":"此書大量運用昏黃的色調，帶出一股濃濃的懷舊之感。故事中專營家族合照的貓頭鷹攝影師，為許多動物家庭留下珍貴的合影，作者也利用翻頁的瞬間比擬按下快門、拍下相片的瞬間，令讀者驚喜連連。故事最後情節一轉，原本教人心酸的發展，又有令人心暖的結局，是一本帶著讀者思考家庭價值、人際關懷的溫柔之作。"},{"id":"dbe115028cca4619bee6c6e3","n":"小鈕扣","a":"小川洋子","d":"岡田千晶","t":"王蘊潔","p":"步步出版","y":["109"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789869517720","dt":"106-09","pr":320,"desc":"小鈕扣和鈕扣洞是形影不離的好朋友，他們是安娜最喜歡的襯衫上的鈕扣組合。但有一天，小鈕扣縫在襯衫上的線斷了，他滾呀滾的，滾到幾乎再也沒有人會想起他的地方⋯⋯。透過擬人化的友誼故事述說小鈕扣與玩具們的奇遇，皆大歡喜的結局讓孩子感受到愛物惜物，以及分享的可貴。"},{"id":"ab6cb14d4b0e4a1eaf713577","n":"我可以加入你的俱樂部嗎？","a":"約翰．凱利","d":"史蒂芬．拉伯利斯","t":"黃又青","p":"","y":["110"],"ag":"3~5","c":"語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789865876395","dt":"106-09","pr":"","desc":"鴨子先後嘗試加入獅子、蛇、大象各自組織的俱樂部，卻每因生理屬性不同、並非同類而慘遭拒絕，鴨子索性自行成立「我們的俱樂部」，只要想同在一起的各類動物皆可加入，果然大受歡迎。本書處理兒童團體生活常見的排擠與成見，闡揚悅納異己的概念。"},{"id":"03c39b71b1b14ec0a2690364","n":"超神奇種子鋪","a":"宮西達也","d":"宮西達也","t":"周姚萍","p":"","y":["110"],"ag":"3~5","c":"語言溝通、健康與安全","cl":false,"lo":false,"isbn":"9789862117439","dt":"106-09","pr":"","desc":"狸貓販售的種子獨一無二，埋入土中並經魔法加持，會瞬間成長結果。小豬買下神奇種子正要走入森林，野狼隨即現身，小豬要如何藉種子化險為夷？本書描寫小豬、狸貓、野狼的三角關係，創意靈感取材自生活中涉及「孕」與「育」、「縮」與「漲」、「進」與「出」等的過程，充滿想像。"},{"id":"109bd9ca2a9f4d1e90a71613","n":"今天的點心(3D鏡面繪本)","a":"渡邉千夏","d":"渡邉千夏","t":"張玲玲","p":"","y":["107","110"],"ag":"0~3","c":"身體動作、認知探索","cl":false,"lo":false,"isbn":"9789861898094","dt":"106-09","pr":380,"desc":"透過特殊鏡面設計，打開繪本呈直角，建立影像立體感，邀請孩子一同視覺感受做點心的樂趣！ 打個蛋，倒入麵粉、砂糖和牛奶，攪拌均勻，再倒進熱熱的平底鍋。哇！味道好香，擺好餐具，一起開動吧！[110]\n3D鏡面繪本，平面變立體，閱讀變遊戲！本書使用鏡面紙張，打開繪本呈90度直角，立體影像就在眼前。今天的點心"},{"id":"d09d5e4a398d4038aa9b52dd","n":"爸爸總是有辦法","a":"娜汀・布罕－柯司莫","d":"奧荷莉・吉耶黑","t":"尉遲秀","p":"親子天下","y":["111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789869498340","dt":"106.08","pr":300,"desc":"本書以假設語法的親子對話，向離家上幼兒園的孩子確保爸爸的父愛，溫馨的畫風，搭配爸爸充滿想像力的溫暖對話，孩子獲得滿滿的信任感，親子共讀後，更可延伸進行充滿想像，假設語法的親子對談，加溫親情。"},{"id":"e5d38a49250545a79256d6bd","n":"獅子一起去上學","a":"海倫‧史蒂芬","d":"海倫‧史蒂芬","t":"黃筱茵","p":"","y":["110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789866215636","dt":"106-08","pr":"","desc":"獅子跟著小主人愛麗絲去上學，但老師不同意，那要躲在哪裡好呢？獅子意外地和小朋友一起去戶外教學，還溜進了博物館，但要如何偽裝才不會被發現？校車被大樹擋住了，獅子要如何幫助小朋友和老師回到學校呢？書中無論情節和繪圖都非常有趣可愛，會讓孩子愛不釋手。共讀時可讓孩子假想他們若是獅子，要如何躲藏和偽裝？一定會"},{"id":"38dd2ae968bb4df081499739","n":"水公主：喬琪．巴迪爾的真實故事","a":"蘇珊．維爾德、喬琪．巴迪爾","d":"彼得．雷諾茲","t":"劉清彥","p":"","y":["110"],"ag":"0~3","c":"社會情緒、認知探索","cl":false,"lo":false,"isbn":"9789864001750","dt":"106-08","pr":"","desc":"每一口乾淨的水都得之不易，本書以孩童的角度來敘寫，呈現住在非洲的人們取水的辛苦歷程以及生活的狀況。親子共讀時，可以和孩子聊聊，生活中的水從哪兒來？以及可以如何珍惜這些資源。同時也可一起討論，如何幫助故事主角琪琪達成她的夢想。"},{"id":"e2a5bcc00d56490eaeaf02b5","n":"去冒險","a":"哲也","d":"陳美燕","t":"","p":"","y":["110"],"ag":"3~5","c":"社會情緒、認知探索","cl":false,"lo":true,"isbn":"9789862117309","dt":"106-08","pr":"","desc":"書中男孩迫不及待想出門冒險，母親口頭答應兒子願望，但交代長串必備清單，叮囑孩子放入行囊。本書刻畫兒童出門冒險之前的親子溝通，也是一則關於輕與重、擔與放、有與無的故事。本書傳達和平達觀、與萬物友善、順勢而為的處事態度，圖畫詮釋與文字相得益彰。"},{"id":"f58e8bee0e8142d390ba9a86","n":"紅髮多莉","a":"蔡淨澤","d":"尹盛喆","t":"黃譯嫺、吳羽涵","p":"東雨文化","y":["109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789869481335","dt":"106-07","pr":280,"desc":"在認識自己的過程中，接納自己與別人不一樣的地方，是相當不容易的事。當孩子進入交朋友的年齡，會想要跟別人建立關係、尋求認同。如果自己的外觀、能力，讓自己看起來跟別人很不一樣，的確是讓孩子相當困擾的事。如何找到欣賞自己的眼光，透過這本圖畫書，好好跟孩子聊聊，是很棒的機會。"},{"id":"3ec1add06a68449ebec45ef8","n":"小麗騎三輪車","a":"豐田一彥","d":"豐田一彥","t":"米雅","p":"","y":["107.110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789864792351","dt":"106-07","pr":300,"desc":"小麗騎著三輪車，不過今天她是「公車」司機，從孩子自己可以駕馭的第一輛車去展開想像。一開始沒有人要上小麗的車，可是她沒有退縮，她把「公車」變大再開回去，大家就結伴著上車了。故事中能學習到邀請他人與解決問題的教育意義。[110]\n孩子的世界因想像而自由。一起坐上小麗的三輪車，你希望，下一站會有什麼乘客上"},{"id":"796ccfe33a2e448e98e9c6a4","n":"一起玩！","a":"傑茲．阿波羅","d":"傑茲．阿波羅","t":"","p":"上誼文化","y":["110","111"],"ag":"0~3","c":"認知探索、身體動作、社會情緒","cl":false,"lo":false,"isbn":"9789577626141","dt":"106.07","pr":280,"desc":"當睡覺時間到了，寶寶不想睡、還要玩，爸媽該怎麼辦呢？這是本適合睡前共讀的繪本，在書中的小猩猩到了睡覺時間還想玩，偷偷溜出去找長頸鹿朋友、大烏龜一起玩&hellip;&hellip;，結果太陽下山，森林變得好黑，小猩猩好害怕，幸好有個神祕好心鄰居把他安全送回媽媽身邊。繪本裡簡潔的對話和細膩的圖像描繪，"},{"id":"aba3c206807548cb9dab9735","n":"啵！啵！啵！海裡有什麼呢？","a":"笠野裕一譯","d":"笠野裕一譯","t":"米雅","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789862743287","dt":"106-06","pr":"","desc":"到海邊玩，會遇到甚麼動物呢？透過這本圖畫書趣味的呈現方式，讓孩子逐樣地認識海裡動物的名稱與外型。親子共讀的時候，家長可以透過手指的指認方式，指出每個動物並說明牠的名稱，以及動物外型的特徵。在彼此堆疊的過程中，動物們的表情多樣，也是可以一起欣賞與說明的部分。"},{"id":"5527d656e64d41eb90cd22f8","n":"奶奶臉上的皺紋","a":"西蒙娜．希洛羅","d":"西蒙娜．希洛羅","t":"黃筱茵","p":"三民書局","y":["111"],"ag":"3~5","c":"語言溝通","cl":false,"lo":false,"isbn":"9789571462899","dt":"106.05","pr":299,"desc":"此書文字細膩，簡單卻飽含文學性。書中的小女孩發現自己難以辨識奶奶的情緒是難過、煩惱或是開心，奶奶說是皺紋讓她看起來如此，因為每一條皺紋裡都保存了一些特別的回憶。小女孩不相信，指著奶奶臉上的皺紋測試，一問一答間，奶奶回顧了一生最精彩難忘的幾個片段，讀者也像是聆聽了一段美好的人生故事。"},{"id":"8ef9fabf9205411f8a57288e","n":"爸爸再一次：好高、好高","a":"秦好史郎","d":"秦好史郎","t":"游佩芸","p":"米奇巴克","y":["110","111"],"ag":"0~3","c":"身體動作","cl":false,"lo":false,"isbn":"9789866215582","dt":"106.05","pr":250,"desc":"爸爸的鼻子是個神奇的按鈕，只要輕輕按一下，爸爸飛機立刻啟動，帶著寶寶飛高高，然後降落，這麼好玩的遊戲總是讓人玩不膩，所以我還要再按一次。書中父子的親密互動充滿無窮的想像與愛，飛機遊戲讓小小的房間變成無邊無際的天空，也讓父親的愛一次又一次地陪伴孩子快樂成長。[111]\n爸爸媽媽是孩子人生中第一位也是最"},{"id":"0f40a392ab5f4560819ce80b","n":"好忙的鳥兒","a":"露西．卡森","d":"露西．卡森","t":"李紫蓉","p":"","y":["109","110"],"ag":"0~3","c":"語言溝通、認知探索、身體動作、美感","cl":false,"lo":false,"isbn":"9789577626127","dt":"106-05","pr":320,"desc":"讓孩子想像變成一隻鳥兒，學鳥兒一下飛高又飛低，一圈又一圈，或像麻雀一樣跳著、企鵝一樣搖擺的走路、紅鶴單腳站立等等，學習用身體來表達想法和感覺。帶領孩子認識鳥類，並透過五顏六色的繪圖和鳴叫的狀聲詞步步引導。[110]\n想不想跟著輕快的韻文一起唱唱跳跳，並且發揮想像力玩扮演各種美麗鳥兒的遊戲？那麼《好玩"},{"id":"2f46cf0bf67b46cdaf74efb4","n":"箱子！箱子","a":"珍．尤蘭","d":"克里斯．席班","t":"劉清彥","p":"","y":["109"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789864001705","dt":"106-04","pr":300,"desc":"如果給小孩一個紙箱，會發生甚麼事？故事中，孩子廢物利用，展開各種想像漫遊。一個簡單的紙箱，隨著圖文的推展，幻化成各式各樣的空間、工具甚至超越現實的世界，充分滿足了小孩的遊戲樂趣。"},{"id":"e58fefd3b3324223ab56500c","n":"你為什麼不開花？","a":"凱特琳娜．瑪庫洛娃","d":"凱特琳娜．瑪庫洛娃","t":"柯倩華","p":"","y":["110"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789862743263","dt":"106-04","pr":"","desc":"這是一本可愛、有趣的繪本。小熊為牠奇特的植物早晚澆水，還請它喝好茶、為它撐陽傘、和它道晚安，甚至教它開花，但它就是不開花。殊不知地底下是另一個世界，那個世界小熊看不到，書裡的文字也沒寫。共讀時，可鼓勵孩子看圖說故事，幫幫小熊，告訴小熊地底下發生了什麼事，牠的植物為何不開花。"},{"id":"4a646b48a2594cc38130e839","n":"小白","a":"郭乃文","d":"周見信","t":"","p":"","y":["108","109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789861615547","dt":"106-04","pr":250,"desc":"這本圖畫書描述了人與寵物 - 小狗小白間溫暖的情誼。過往一起共同的經歷，編織了美好的記憶，但也難掩分離時的悲傷。透過圖畫書，可以跟孩子聊聊生命中與別人的關係、與寵物的關係。如何珍惜相處時的美好，同時也學習面對悲傷的情緒。親子一起學習這堂不容易的生命功課。[109]\n全書無任何對白，只以圖畫導演出人與"},{"id":"4ddbeae1f64b400c93609780","n":"小水窪","a":"任惠元","d":"任惠元","t":"黃筱茵","p":"遠流出版","y":["108","109","110","111"],"ag":"3~5","c":"社會情緒、認知探索、美感","cl":true,"lo":false,"isbn":"9789573279723","dt":"106.04","pr":280,"desc":"當孩子說「最討厭下雨天了，什麼事都不能做」爸爸媽媽該怎麼回應呢？我們可以與孩子一起讀讀本書！故事裡的主角是個討厭下雨天的男孩，他的媽媽一邊和男孩對話、一邊循循善誘他畫畫，在家中畫個下雨天，「這只是圖畫嘛！，媽媽別生氣。」、「我們有雨衣雨鞋，真的可以去散步嗎？」讀完之後，家長和孩子一定可以體會到畫畫的"},{"id":"c118ed620cd04d3aa3ae14dc","n":"我想變成綠色的","a":"柳珠永","d":"柳珠永","t":"徐鳳擎","p":"大穎文化","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789869425001","dt":"106-03","pr":290,"desc":"紅紅的男孩喜歡綠色，想像穿上媽媽織的綠色毛衣，變變變，卻又擔心媽媽找不到變身以後的自己。幸好媽媽手上穩穩拉著線，尋回飛得高高的變身綠氣球。「逃家小兔」式的遊戲情節，紅配綠的幸福色調，母子之間的親情，溢滿書頁。"},{"id":"d33007af134548f4b80cdff7","n":"車票去哪裡了？","a":"劉旭恭","d":"劉旭恭","t":"","p":"遠見天下文化(小天下)","y":["108","110","111"],"ag":"3~5","c":"社會情緒、認知探索","cl":true,"lo":true,"isbn":"9789864791804","dt":"106.03","pr":300,"desc":"此書以藍色和橘色兩個對比色作為主要的色彩，十分吸睛，橫式的開本翻開來後，跨頁的圖更長，創造出許多壯闊的場景。書中乘客們的車票同時被一陣大風吹走了，巴士司機帶著整車乘客上山下海、不遠千里去追，展開一場驚心動魄的旅程。主角的堅持令人莞爾也令人敬佩，故事收尾則是溫柔、溫暖得令人安心。[111]\n如果對老師"},{"id":"f86a6086e67a4cb5a66da509","n":"月亮先生，晚安","a":"中嶋香織","d":"中嶋香織","t":"許婷婷","p":"","y":["110"],"ag":"0~3","c":"生活自理","cl":false,"lo":false,"isbn":"9789862116852","dt":"106-03","pr":"","desc":"月亮先生不睡覺，它在看睡得呼嚕呼嚕的小狗、睡得咕嚕咕嚕的小鳥兒、一閃一閃的小星星，還有睡得香香甜甜的孩子。繪本內色彩清新柔和，文字貼近孩子生活，很適合家長在睡前和幼兒共讀，讓溫柔的月亮先生陪伴孩子進入夢鄉。"},{"id":"da02a83ba94f4909ab824274","n":"啊！","a":"林美琴","d":"黃郁軒","t":"","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":true,"isbn":"9789862116906","dt":"106-03","pr":"","desc":"全書內容僅有一個字，就是書名的「啊！」，它也是一個簡單的發音。幼兒不識字，但親子共讀時，家長不妨不斷發出「啊！」這個音，讓幼兒進入狀況。書中描述的都是日常生活常見的場景，但對牙牙學語的幼兒而言，這是個令人好奇的世界。"},{"id":"f5e6e1b531c241ebb1787e6d","n":"我的水果寶寶","a":"陳麗雅","d":"陳麗雅","t":"","p":"","y":["108","109"],"ag":"0~3","c":"認知探索","cl":false,"lo":true,"isbn":"9789862116937","dt":"106-03","pr":280,"desc":"臺灣的水果豐富多樣，這本圖畫書細細描繪常見的水果－楊桃、草莓、香蕉、西瓜、葡萄、蘋果、柿子、橘子。透過指圖識物、指物命名的共讀策略，讓孩子認識這些水果的名稱。而且共讀時，成人如能提供實體可觸摸的水果，一定更能豐富孩子的感官經驗， 強化對圖畫書中水果的理解與認識。[109]\n一起來找水果寶寶吧！找一找"},{"id":"5d38555a8789439b9a1fbd7a","n":"黑面琵鷺來過冬","a":"王徵吉","d":"王秋香","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789861615493","dt":"106-03","pr":280,"desc":"當北風吹起，黑面琵鷺就會大舉南遷。牠們飛越高山，遠渡重洋，克服重重險阻，年年來到曾文溪口的七股保護區過冬，引發一年一度的「黑琵熱」。黑琵先生王徵吉走遍世界各地，透過鏡頭和淺顯的文字將黑面琵鷺的成長歷程、生活習性，以及對當地自然與人文的影響，完整呈現在《黑面琵鷺來過冬》中，是親子認識黑琵的入門書。"},{"id":"47f23681f7504fcc90718d31","n":"1234，動動體操","a":"李紫蓉、林世仁、蘇珊","d":"林小杯","t":"","p":"信誼基金","y":["111"],"ag":"0~3","c":"身體動作、語言溝通、健康與安全","cl":false,"lo":true,"isbn":"9789861615486","dt":"106.02","pr":280,"desc":"你今天元氣了嗎？快跟著可愛的小朋友一起來動動身體，做個元氣健康操，開始美好的一天。本書內含CD，親子可以透過一首首活潑有趣、琅琅上口的兒童歌謠，搭配圖畫中小朋友、機器人、動物們舉手彎腰、跳躍翻滾、活力無限的肢體動作，一起來場元氣滿滿的韻律體操大會串。"},{"id":"45998c8e8ea84e589d3cebe1","n":"為了特別的你","a":"許育榮","d":"許育榮","t":"","p":"典藏藝術家庭(小典藏)","y":["109","111"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":true,"isbn":"9789869406017","dt":"106.02","pr":280,"desc":"本書以孩童喜愛的慶生為主軸來鋪陳故事情節，也以大大小小各式各樣的動物作為故事中的角色，孩子比較擅長詮釋動物在故事中代表的抽象意義，親子共讀除了欣賞接待動物賓客的奇招妙想，解決難題，不妨鼓勵孩子也說說自己對各種動物賓客的想法，當我們為了特別的你而設想，他人也會為了特別的你而設想。[111]\n小男孩的生"},{"id":"37fbe92f6e864fc2abce9910","n":"大藝術家巴布","a":"瑪莉安‧杜莎 (Marion Deuchars)","d":"瑪莉安‧杜莎 (Marion Deuchars)","t":"柯倩華","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789571462684","dt":"106-02","pr":329,"desc":"巴布是隻鳥，有人說他的腿瘦巴巴，走起路來像滑稽的竹竿。巴布很難過，想盡辦法要改善。他努力的運動、吃東西，腿還是沒有變粗壯，要把它遮起來又很好笑。終於巴布在美術館受到啟發，成功轉移大家的焦點，注意到他精采的美麗。到底巴布是怎麼做到的？"},{"id":"18ef8dfea66f455183ae09e1","n":"乖乖溜滑梯","a":"陳致元","d":"陳致元","t":"","p":"親子天下","y":["107"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789869453158","dt":"106","pr":280,"desc":"乖乖坐在高高的滑梯上，斜斜躺著、直直躺著，就是不肯溜下來。儘管朋友們一個個排隊等著溜滑梯，乖乖依然不讓，堅持要「想一個厲害的方法溜滑梯。」究竟是乖乖不想讓其他人玩？還是乖乖會怕自己溜滑梯?"},{"id":"9bf54fb61c6e49b0b153fce8","n":"騎著恐龍去上學（新版）","a":"劉思源","d":"林小杯","t":"","p":"步步","y":["107"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869433709","dt":"106","pr":320,"desc":"騎著恐龍去上學真的很神氣！小雷龍不會排放廢氣，不會製造噪音，還很環保。不過，身形巨大的小雷龍，也帶來不少困擾。牠走在路上會撞到天線，踏壞馬路，牠大大的尾巴常會把東西掃壞，學校因此接到好多好多罰單，只好把小雷龍禁足了！孩子們都好傷心&hellip;&hellip;"},{"id":"d8ac044b039f469eb0dff09f","n":"十二生肖的故事","a":"賴馬","d":"賴馬","t":"","p":"親子天下","y":["109"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789869421508","dt":"106-01","pr":360,"desc":"同一班的孩子，常常因著生肖，讓成人找到描述孩子行為的理由，例如屬猴的孩子，容易成為調皮的代表。究竟12生肖是怎麼選擇的？老鼠又是如何奪得第一？這些動物的關係，因為這場比賽產生了哪些變化？都是人們津津樂道的情節。這本圖畫書充滿了想像以及有趣的互動，加上處處驚喜的插畫，讓親子在共讀過程中，增添了許多樂趣"},{"id":"38264e81cd0744f1963ccf36","n":"搭便車","a":"貓小小","d":"貓小小","t":"貓魚","p":"巴巴文化","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869300797","dt":"106-04","pr":280,"desc":"貓在山上撿到好多垃圾，有紙箱、瓶蓋、噴漆，貓用這些材料做一臺車，並開車出發拜訪山下的朋友。一路上動物們都想搭便車，貓面對大家搭便車的要求卻不敢拒絕。眼看出現的動物愈來愈多，有北極熊、小狗、野豬一家人&hellip;&hellip;等，這臺小到不行的車真的能繼續前進嗎？會有人發現這臺車的祕密嗎？透過這"},{"id":"b0ec1ad5fa8b4b468398636f","n":"動手玩童話--三隻小豬","a":"GWE","d":"GWE","t":"高竹馨","p":"禾流文創","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869369961","dt":"106","pr":380,"desc":"「豬小弟蓋了一棟堅固的紅磚房，大野狼用力吹一口氣，磚房穩穩地動也不動&hellip;&hellip;」《動手玩童話-- 三隻小豬》將大家耳熟能詳的經典童話重新演繹，透過小機關讓親子一起「玩轉童話」，嬰幼兒在聽故事與遊戲中可認識顏色、圖形，訓練手指小肌肉，提升「手眼協調、五感統合」。"},{"id":"41443da1b85c4b90b987a35f","n":"小熊坐椅子","a":"雪莉‧派倫托","d":"大衛‧沃克","t":"張淑瓊","p":"親子天下","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789869371971","dt":"106","pr":280,"desc":"快樂分享的時刻來囉！四隻小熊坐在四張小椅子上。大棕熊也想找張椅子坐，但是沒有椅子了，該怎麼辦呢？來看熊寶貝們如何攜手合作解難題，讓大棕熊也能一起坐椅子！"},{"id":"8b36b2d41df0432ca3fef33d","n":"你在媽媽肚子裡的時候．．．．．．","a":"金槿熙","d":"金槿熙","t":"魏嘉儀","p":"大穎文化","y":["109"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":false,"isbn":"9789869375238","dt":"106-01","pr":290,"desc":"這是一本用繡畫織成的書，紙頁上散發著手工繡製的衣被的獨特溫度。用暖色調繡出大自然中的小動物、花草樹木，陪伴著還是受精卵、還是胎兒、還未成形的小小靈魂漸漸茁壯，期待他來到這個正在等待他的地方。在與孩子親子共讀的時候，妳會回想起懷孕時看到超音波的驚喜、聽到心跳聲的悸動、 感覺到胎動的興奮、為孩子吃下的特"},{"id":"aef410a0b71e45eabb422110","n":"請來我家玩","a":"崔麗君","d":"崔麗君","t":"","p":"小典藏","y":["108"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789869535427","dt":"106-11","pr":320,"desc":"豆豆搭上公車，從市區到山上的妮妮家玩。妮妮和小貓招待好朋友豆豆，帶著他爬上階梯，看那積木般的房子、山丘上飛舞的芒花和蓬蓬的雲，還在大樹下野餐。這一天讓豆豆到處都充滿驚奇。隔週，妮妮和小貓搭公車從山上來到城市的豆豆家，豆豆家有好多車子、高大的房子、好多攤販等，都市裡的一切讓妮妮和小貓感到好新鮮&hel"},{"id":"e0a54ea0056d481789ceefc0","n":"下眼淚雨的一天","a":"盧貞穎","d":"盧貞穎","t":"","p":"小典藏","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869478182","dt":"106-01","pr":320,"desc":"小熊在睡夢中被哭聲吵醒，牠擔心又好奇的循著聲音出門尋找，一路遇到痛痛怕怕的小企鵝、切洋蔥的獅子、想念媽媽的小長頸鹿、開心而笑出眼淚的小魚、為大地災難而感傷的大象、因為美麗的夕陽而感動的狐獴。眼淚是傷心，也是釋放與力量。"},{"id":"a5999cfb30c14a30b740cdf9","n":"好餓好餓好餓","a":"劉思源","d":"南君","t":"","p":"巴巴文化","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789869520515","dt":"106-11","pr":280,"desc":"虎斑貓喵大好想要隻胖嘟嘟的老鼠當生日禮物！在家裡東找找、西找找，哎呀！那是老鼠的尾巴嗎？用力一跳！糟糕，是窗簾的繩子。哎呀！那個圓圓的是老鼠的屁股嗎？用力一咬！糟糕，是主人的滑鼠。找不到老鼠，卻一直聞到老鼠的味道是怎麼回事？真煩惱，真煩惱&hellip;&hellip;。"},{"id":"07769ddd24e64cee80b98607","n":"跟我說晚安","a":"茱莉亞•唐諾森","d":"蕾貝卡•寇柏","t":"艾可","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865730598","dt":"106-01","pr":299,"desc":"這本兼具動手操作遊戲與輕快童謠風格的可愛翻翻書非常適合親子閱讀。趣味的對話，充滿溫柔的引導與調皮的撒嬌。以想像串連的情節、富循環式的重複模式與可預測性，可以讓親子在共讀中進行猜謎與唱謠。可愛的插畫中有孩子熟悉與喜愛的小玩偶等，適合激發小小孩進行看圖說故事。"},{"id":"232ba79347b04f97aafcc052","n":"誰來躲貓貓","a":"茱莉亞•唐諾森","d":"蕾貝卡•寇柏","t":"艾可","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865730604","dt":"106-02","pr":299,"desc":"躲貓貓是幼兒最喜歡的遊戲，藉由「尋找」、「發現」的重複過程，會讓幼兒擁有成就感與樂趣。在這本可愛的寶寶翻翻書中，就是藉由童謠般的文字引導，大人可以一邊唸故事，一邊帶著幼兒一起玩猜一猜、躲貓貓的遊戲。"},{"id":"30bab4c839a64d6390f05a9f","n":"我本來就很愛你啊！","a":"喬里．約翰","d":"班傑．戴維斯","t":"李紫蓉","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864792511","dt":"106","pr":300,"desc":"真正的愛，不用刻意付出；我愛你，正因為你是你。逗趣的大熊和鴨子回來了！這次，大熊想要單獨在家好好放鬆，但鴨子卻想和大熊一起出門去散步，他們又會發生什麼樣的趣事呢？"},{"id":"ea5955ae18e749978ddfd638","n":"寶寶翻翻書：蓋被被乖乖睡","a":"新井洋行","d":"新井洋行","t":"張桂娥","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864792634","dt":"106","pr":300,"desc":"《蓋被被乖乖睡》以幫寶貝「蓋被被」的創意翻頁設計，讓小小孩透過遊戲的方式學習生活常規，在睡前為每一種陪睡的動物寶貝蓋上柔柔的、軟軟的被被，練習說晚安，然後懷著安心、滿足的心情乖乖入睡。除了蓋被被之外，書中還有好多線索與趣味，等待親子一起探索唷。"},{"id":"7b666cb186e64bc7ba6a2e3e","n":"笑咪咪情緒變變轉盤書","a":"金秀姬","d":"Mickey Bean","t":"徐鳳擎","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864292479","dt":"106","pr":450,"desc":"拉拉緞帶，「魔法轉盤」上的小臉蛋就會變得完全不一樣喔！看書中的小朋友擺出不同的表情，在觀看的過程中理解他們的情緒並產生共鳴，利用開懷大笑來抒解負面情緒，遇到生氣、恐懼、害羞的事，好好笑一笑，奇妙的感染力，會啟動寶貝的正能量基因唷！"},{"id":"1696e50fb88f4d3984785fea","n":"我喜歡書","a":"安東尼．布朗","d":"安東尼．布朗","t":"麥維","p":"","y":["108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789864401659","dt":"106-11","pr":250,"desc":"你喜歡書嗎？我喜歡書，我喜歡各式各樣的書，有趣的、嚇人的，還有漫畫書&hellip;&hellip;你呢？你也跟我一樣，喜歡看書嗎？國際知名繪本大師安東尼．布朗用精簡的文字和生動的圖畫，帶領小朋友一起認識各種不同的主題、類型的書。"},{"id":"aaea697f9072445da971337e","n":"史賓奇生悶氣","a":"威廉．史塔克","d":"威廉．史塔克","t":"劉清彥","p":"","y":["110"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789864001552","dt":"106-01","pr":"","desc":"男孩史賓奇為小事生悶氣，無論家人好友如何勸誘都不能絲毫消解，僵持的局面隨著時間拉長逐漸陷入死胡同。史賓奇要如何讓這場越演越烈的生氣大戲落幕，優雅下臺？本書處理家庭常見的孩童生氣議題，尤其巧妙捕捉生氣者的幽微心聲與肢體反應，畫面陽光，令人莞爾。"},{"id":"0b48b2baa0954553af083444","n":"晾衣服的日子","a":"潔西莎．貝格利","d":"潔西莎．貝格利","t":"黃筱茵","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864001620","dt":"106","pr":270,"desc":"「我好無聊喔。」小滴說。「對啊。」小答說。獾兄弟在家裡閒得發慌，他們已經玩遍所有能玩的東西，直到媽媽問他們要不要幫忙晾衣服。從沒做過家事的兄弟倆被這個提議吸引了。媽媽出門之後，他倆玩得津津有味，甚至想出了許多古靈精怪的點子&hellip;&hellip;。"},{"id":"a119c7df25c44aa0b053965e","n":"天亮之前","a":"喬艾絲．席曼","d":"貝絲・科隆斯","t":"宋珮","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864001811","dt":"106-12","pr":280,"desc":"生活中總是有飛機要趕、有公車要等，這裡卻有個孩子期望擁有脫離常軌的一天。當孩子的祈求從沉睡的城市昇起&hellip;&hellip;匆忙的世界回歸寂靜，大雪帶回了自由與平安。本書以獨特的刮版畫搭配如詩的文字，讓人在豐富內斂的圖像語言中，重新找回片刻的寧靜與安詳。"},{"id":"ac035df2df774cd6aae6961c","n":"野鳥食堂","a":"劉伯樂","d":"劉伯樂","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862743621","dt":"106-12","pr":280,"desc":"高山上住著一群美麗的野鳥，山上生活困苦，食物也很缺乏。某天，安靜的山谷裡傳來了烏鴉的叫聲：「ㄚ！ㄚ！食物來了，食物來了！」電報鳥和畫眉鳥聽到了，也紛紛告訴大家美味的食物來了。不過，在食物貧瘠的高山上，這些食物是從哪裡來的呢？"},{"id":"4951053b7acf49e393f3126b","n":"藍色小洋裝","a":"張又然","d":"張又然","t":"","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":true,"isbn":"9789862743355","dt":"106-06","pr":399,"desc":"老街的嘉年華遊行要到了，小玉因為皮膚過敏的關係，只能穿白色的洋裝。她偷偷的穿上紅花裙，沒想到卻開始全身發癢，她難過的一邊哭一邊跑到後山去。阿嬤看著傷心的小玉，提議了好方法可以幫忙把衣服變得漂亮。小玉真的可以順利穿著漂亮的衣服去參加遊行嗎？"},{"id":"39e9b55bf6164e74877afe3e","n":"一起去散步","a":"五味太郎","d":"五味太郎","t":"莫凡","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862743140","dt":"106","pr":430,"desc":"小雞排成一列，出去散步了。在綠油油的草地上，小牛也悠閒的散步著。我們也跟著這些小動物們一起出門散步吧！路上遇到了好多不同的小動物們，先學一學活潑的蝗蟲，用輕快的跳躍散步吧，也可以像小烏龜一樣慢慢的走，卻從不停下腳步，一直一直往前走！"},{"id":"3a3ea5d7996e4bef9b426939","n":"運輸總動員","a":"鎌田步","d":"鎌田步","t":"黃惠綺","p":"","y":["107"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862116579","dt":"106","pr":290,"desc":"從人力搬運到牛車運送，從挖土機到輪船、太空梭&hellip;&hellip;人類發明了各式各樣的運輸工具，不斷擴充運載量，隨著運輸工具的種類越來越多，人類也將自己帶到更遠的地方。《運輸總動員》載著你我穿越時空，一窺運輸工具的歷史演進。"},{"id":"44eab7bf2953417d941c6f09","n":"放屁，噗嘶！","a":"村上八千世","d":"瀨邊雅之","t":"黃郁婷","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862116838","dt":"106-02","pr":280,"desc":"放屁的味道與聲響是身體的警報器。「噗&mdash;&mdash;」還是「嘶&mdash;&mdash;」，意義都大不同喔！這其中包含著身體所釋放的訊息，多多留意放屁的聲音，就能了解腸道內部的狀況，以及飲食是否均衡。"},{"id":"7f40981e913544a59d1d7475","n":"相親又相愛","a":"佐古百美","d":"佐古百美","t":"許婷婷","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862116869","dt":"106","pr":270,"desc":"小豬與小貓互為好朋友，大家一起玩總是好開心！小山羊跟小狗不小心和對方碰撞成一團，雖然好痛好痛，但仍不忘為對方呼呼，於是很快又和好，還是好朋友。小朋友們，即使發生爭執，也要快快和好，一起手牽著手，相親又相愛喔！"},{"id":"271faa10500b4ae493b679a9","n":"拜拜，我要出門囉!","a":"宮西達也","d":"宮西達也","t":"陳瀅如","p":"","y":["107"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789862117316","dt":"106","pr":280,"desc":"寶寶漸漸長大，開始有機會暫時離開爸媽的視線，到保母家，或是上幼兒園&hellip;&hellip;日本繪本大師宮西達也運用能引起寶寶興趣的動物和昆蟲圖畫，引導牙牙學語的寶寶學習「拜拜」這句問候語。讓寶寶在學習離開父母的懷抱時，也能學習有禮貌、有自信地與人溝通、互動。"},{"id":"77f4b920032244cc9cfdaef0","n":"我愛洗澡嚕啦啦","a":"沙永玲","d":"沙永玲","t":"陳美燕","p":"","y":["110"],"ag":"0~3","c":"生活自理","cl":false,"lo":true,"isbn":"9789862117385","dt":"106-01","pr":"","desc":"透過圖畫書中動物角色的動作，一步步地引導幼兒洗澡的步驟，從洗頭、洗耳朵、洗脖子、擦擦背、搓搓手、洗屁屁，最後擦乾身體。本書使用防水材質，讓幼兒在洗澡的時候，也能享受閱讀的樂趣。家長可以讓孩子帶著一起洗澡，最後幫書也洗一洗，記得擦乾淨，下次再一起洗澡。"},{"id":"59f6dda58e7a4684bfd09ba3","n":"猩猩爹地","a":"三浦太郎","d":"三浦太郎","t":"劉康儀","p":"小魯文化","y":["107","111"],"ag":"0~3","c":"身體動作、社會情緒","cl":false,"lo":false,"isbn":"9789862117392","dt":"106.08","pr":290,"desc":"精力旺盛的小猩猩要求正在休息的大猩猩陪他玩，猩猩爹地原本只答應玩一次「爹地溜滑梯」，遊戲開始後卻欲罷不能地繼續變身為「爹地飛機」、「爹地盪秋千」、「爹地攀爬架」&hellip;&hellip;。書中猩猩父子互動的內容都是作者記憶中跟女兒一起玩過的遊戲，令他回味無窮，邀請您一起來當孩子的人體遊戲場，一"},{"id":"d9b6d60328a8420c818bfa90","n":"誰在微笑?","a":"米津祐介","d":"米津祐介","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861897356","dt":"106-01","pr":280,"desc":"點、線、顏色與形狀能組合出什麼？一種可能、兩種可能？還是很多種可能？這本書好玩的挖空設計，把點點、線條、顏色、形狀，變身成快樂的小動物，不僅讓孩子笑個不停，也讓大人會心一笑，充滿想像、預測與發現的樂趣。"},{"id":"a59d874d6eba49f1abbcfc27","n":"誰要來喝下午茶？","a":"葉曼玲","d":"葉曼玲","t":"","p":"信誼基金","y":["108","109","111"],"ag":"3~5","c":"美感、社會情緒、語言溝通","cl":true,"lo":true,"isbn":"9789861615554","dt":"106.04","pr":280,"desc":"孩子想像扮演的童言童語，在秋天的筆觸下，以層次分明的文字鋪陳，輕鬆自然開展，小讀者會很容易感受到小女孩玩「扮家家酒」自得其樂的歡愉，透過此書，喚起家長自己的童年，以及重視孩子的童年，在實際生活中，讓孩子有機會撿起枯枝、樹葉、果實、花瓣、石頭玩起扮家家酒，和孩子一起喝杯下午茶吧！[111]\n佩佩到公園"},{"id":"4eb2f9ea1644474abc1ecfe3","n":"父子開車","a":"揚．巴特利克","d":"J．M 布隆","t":"林蔚昀","p":"","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789577625946","dt":"106-08","pr":280,"desc":"小男孩和爸爸有一輛紅色跑車，很神氣呢！爸爸不用開車門，就可以跳上車。不管下雨天、下雪天、大熱天，都能向前行。 他們還會一起幫車子換雪胎、撐開車篷， 放假了，拖著露營車就可以出去玩；天黑了，就把車燈打開......。這是一本幽默的想像遊戲書，內容充滿驚喜。[108]\n快繫好安全帶，小男孩要和爸爸開車去"},{"id":"75ee105b1c584fc9bebb706d","n":"點點玩聲音","a":"赫威．托雷","d":"赫威．托雷","t":"周婉湘","p":"上誼文化","y":["107","108","111"],"ag":"3~5","c":"身體動作、認知探索、語言溝通","cl":true,"lo":false,"isbn":"9789577626110","dt":"106.04","pr":300,"desc":"孩子常抱怨，書又不會有聲音，看書有什麼好玩？作者將點點們化身為有趣的聲音，邀請孩子跟著「喔！」「啊！」和「哇嗚！」，一同創造好玩的聲音魔法。讓孩子在遊戲中，不知不覺體驗了聲音的大和小、快和慢、漸強與漸弱，還有好冷、好兇、傷心哭泣、和最溫柔的「喔！」等不同情境。爸爸媽媽是不是忍不住要和孩子一起來場聲音"},{"id":"1d5cbb6ab1384b96abd24104","n":"小天空","a":"葛西新平","d":"伊勢英子","t":"林真美","p":"","y":["108"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789573281740","dt":"106-12","pr":300,"desc":"啟太有一個隨時都在等他的朋友，它是媽媽兒時的布偶「小天空」，每天放學後，啟太和「小天空」互相分享幼兒園及家裡發生的事。啟太媽媽的肚子一點一點變大了，啟太就要當哥哥了。但是當哥哥是怎麼一回事呢？本書呈現了家人對新生命的期待，以及親子、手足間的親暱情感，讓親子、手足間的互動多了更豐富的意涵。"},{"id":"fabc1ac64c1e4ddbb6b9c9f9","n":"妮妮不見了","a":"安妮塔．羅北兒","d":"安妮塔．羅北兒","t":"宋珮","p":"步步","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789869343879","dt":"105-12","pr":300,"desc":"有一天，天空好藍，外面的世界迷人極了！妮妮貓溜出閒逛，悠遊徜徉在大自然。但入夜之後，妮妮開始感到身邊的危險，於是鼓起勇氣，速離森林，奔向呼喚她的聲音，回到溫暖的家門，體會在家千日好！不過，當風光明媚的一天又來臨，妮妮還會再度出發探險嗎？"},{"id":"116910a01cc2484b93c7ed82","n":"藍尼和露西","a":"菲立普．史戴","d":"艾琳． 史戴","t":"宋珮","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865876340","dt":"105-12","pr":350,"desc":"走過蜿蜒崎嶇的小路，穿過黑暗的森林，彼得和哈洛終於來到新家。彼得說：「這房子哪裡比得上我們的舊房子，我想回去了。」晚上，黑暗的樹林中彷彿藏著可怕的東西，彼得和哈洛一點兒也睡不著。藍尼和露西的出現，讓彼得與哈洛安心展開新的生活。"},{"id":"370ab568ea5f46a29e3a06f1","n":"外公的大衣","a":"吉姆‧艾利斯沃斯","d":"芭芭拉‧麥克林托克","t":"柯倩華","p":"","y":["106","108","109","110"],"ag":"3~5","c":"社會情緒、語言溝通、認知探索","cl":false,"lo":false,"isbn":"9789865730673","dt":"105-12","pr":280,"desc":"一個家族記憶的溫馨故事，透過外公的大衣，看到一個家族的成長，一點一滴地慢慢孕育新生命，同時也可透過細緻的圖畫了解當時的成長環境。親子共讀的時候，鼓勵爸爸媽媽可以多說說屬於自己家庭與過去成長的故事。讓孩子對於爸媽小的時候，多一份了解，一起編織美好的家族記憶。[110]\n外公用又舊又破的大衣，能做出多少"},{"id":"6e4f0115377e41fdb504de8d","n":"夏天","a":"曹文軒","d":"郁蓉","t":"","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864271153","dt":"105-12","pr":290,"desc":"烈日當空，大荒原上揚起陣陣煙塵，一群狂奔的動物急切地找尋遮蔭。眼尖的野狗叫了一聲「樹！」動物們拼命跑向那棵樹。「是我先跑到樹下的！是我先跑到樹下的！」大家爭論了半天之後，發現那不過是一棵光禿禿的枯樹罷了，都不由得笑了起來。不一會兒，牠們看見一對父子安靜地走著，穿越荒原⋯⋯。"},{"id":"580cc23176d24bd8a4fdd324","n":"誰是大壞蛋？","a":"保利(Lorenz Pauli)","d":"莎樂爾(Kathrin Schärer)","t":"劉孟穎","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864271191","dt":"105-12","pr":270,"desc":"農場裡，平日安分的動物們七嘴八舌的爭論誰才是農場中最壞的大壞蛋，乾草堆中的老鼠一點也不在意，因為牠正忙著找食物。動物們一個個使壞，小狗嚇得公雞四處亂竄，山羊越過圍籬踐踏花草⋯⋯貓咪悄無聲息地走近稻草堆，老鼠卻渾然不覺，仍自顧自地找著地上的穀粒。正當大家都緊張的屏住氣息，盯著貓咪看時，啪噠一聲⋯⋯。"},{"id":"98fcbbf4975042aa833507b1","n":"年糕去澡堂","a":"苅田澄子","d":"植垣步子","t":"米雅","p":"","y":["110"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789864001514","dt":"105-12","pr":"","desc":"日本作者讓本書的內容充滿日本味。臺灣年糕並不像書中所描述，這點可先向孩子說明。把食品擬人化，再把火鍋當浴池是本書有趣的設定。吃火鍋是件既歡樂又溫暖的事，讀完本書，孩子下次吃火鍋時，很容易想起書中各種食物泡在浴池的情景。"},{"id":"fdea3f70a8a1459999a105a8","n":"小蠶豆的新床","a":"中屋美和","d":"中屋美和","t":"米雅","p":"","y":["110"],"ag":"3~5","c":"社會情緒、認知探索、生活自理","cl":false,"lo":false,"isbn":"9789862743010","dt":"105-12","pr":"","desc":"本書是作者以小蠶豆為主角的系列創作之一。小蠶豆以包覆其外的豆莢為床，既是小主角的家、也充當載具及遊樂器。故事描述主角小蠶豆為了充實其床（家），展開尋找棉花之旅。書中除蠶豆，尚有各式豆類出場，角色造型渾圓討喜，情節溫馨富創意。"},{"id":"fcfca2b8fed042369571dd37","n":"小小的大冒險","a":"周見信","d":"周見信","t":"","p":"步步出版","y":["109"],"ag":"3~5","c":"社會情緒、語言溝通、生活自理、健康與安全","cl":false,"lo":false,"isbn":"9789869343855","dt":"105-11","pr":300,"desc":"誰能屏除刻板印象，無限發揮想像？是學齡前的孩子！他們對世界的認知也是我們無法想像的啊！書裡最有趣的就是，孩子的想像力把所有的東西都變成新奇冒險的物事：小叉子變成魔法棒，紅色水瓢變成了帥氣的帽子，單車變成了超酷的坐騎。在他眼中，貓咪變成黃虎怪，公車是可怕的大鐵龍，來幫助他的里長伯變成老樹公！最後，令人"},{"id":"c53868f51edb498091fc7559","n":"今天萬歲!","a":"布萊恩萬","d":"布萊恩萬","t":"張政婷","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789861897363","dt":"105-11","pr":280,"desc":"月兒彎彎，星光閃閃，貓頭鷹精神抖擻出發去找朋友玩。牠陸續找了大象、斑馬、烏龜、長頸鹿、獅子，一一對牠們歡呼：「今天萬歲！我有⋯⋯喔，要不要一起玩？」，大家的回答都是「等一下！我好想睡！」找不到玩伴的貓頭鷹在夜裡呼喊：「唷呼！今天萬歲！有誰想要出來玩？」回應牠的是⋯⋯"},{"id":"e46fa5178d7a4e7bab4a1e8d","n":"來問我呀","a":"伯納．韋伯","d":"蘇西．李","t":"黃迺毓","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789577626059","dt":"105-11","pr":280,"desc":"戴上帽子，穿好衣服，秋高氣爽的午後，小女孩迫不及待和爸爸散步去！一路上，小女孩不停地要爸爸問她喜歡什麼，並嘰嘰喳喳地說著她喜歡的事物。父女倆到湖邊看野雁，在花叢中看蝴蝶、找蟲子，共享最愛的蛋捲冰淇淋，在滿天紅葉的森林中嬉戲、小憩，共度美好時光。閱讀《來問我呀》是否讓你想起和家中小寶貝相處的每一刻？"},{"id":"c92ce2807962468c9b7529da","n":"動物和我","a":"林良","d":"趙國宗","t":"","p":"","y":["106","109"],"ag":"3~5","c":"語言溝通、認知探索、美感","cl":false,"lo":true,"isbn":"9789864790906","dt":"105-10","pr":300,"desc":"公雞不管別人睏不睏，只要自己醒了，就不許大家再睡！螢火蟲到底決定要把燈籠掛在哪棵樹上？要是白兔的前腿長一點，牠們走路就方便多了⋯⋯。 書中用了很多小朋友熟悉的元素，例如粉蠟筆作圖，明亮的配色，簡單的幾何圖形組合，童稚的語言，這些都能緊緊抓住孩子的心，小朋友讀起來一定會深有共鳴。[109]\n套用林良自"},{"id":"6e002c5eac9a43f9b7235925","n":"屋頂上的貓","a":"羅傑‧梅德","d":"羅傑‧梅德","t":"吳敏蘭","p":"步步出版","y":["106","109"],"ag":"3~5","c":"社會情緒、美感","cl":false,"lo":false,"isbn":"9789869343800","dt":"105-09","pr":280,"desc":"一隻身手矯捷，外表帥氣的貓卻在一次意外的失誤中喪失了驕傲與尊嚴，從此他只能潛伏，只能仰望著高聳的屋頂。然而他的英雄本質與神氣是無法被奪走的！當他一躍而起時，自信的光華讓他再度閃耀在光榮的舞臺上。整本書以不同的視角及節奏呈現主角貓的情緒起伏與心境轉變。[109]\n帶著神祕與驕傲的氣息，屋頂上的貓彷彿王"},{"id":"70e1a7efd0b1462f98a29a26","n":"貝拉的生氣天","a":"蕾貝卡‧派特森","d":"蕾貝卡‧派特森","t":"黃筱茵","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789866215513","dt":"105-09","pr":280,"desc":"「快點出去！」貝拉一早就因為弟弟闖入她的房間，舔她的寶貝項鍊而大吼大叫，開始這生氣的一天。貝拉哭鬧、耍賴、抱怨、吼叫⋯⋯表達種種的不滿。相較於哭鬧吼叫，情緒失控的貝拉，弟弟就顯得特別乖巧單純，而且總是得到媽媽特別的照顧。當媽媽溫柔而專一的為貝拉唸故事，全部的注意力都集中在她身上時，貝拉也因再次確定媽"},{"id":"880e609395914a349a5f1aef","n":"杯杯英雄","a":"蔡兆倫","d":"蔡兆倫","t":"","p":"","y":["109","110"],"ag":"3~5","c":"社會情緒","cl":false,"lo":true,"isbn":"9789864001064","dt":"105-09","pr":320,"desc":"每個人都想成為英雄。書中使用對話的方式，提供不同角度的英雄定義，究竟英雄需要具備哪些能力或是特質呢？清潔員小巴認真勤奮地工作，為了將獎盃擦亮，還完成爬上高塔之任務，那他算不算是英雄呢？值得親子共讀的時候，一起想一想，找到欣賞自己的眼光！[110]\n在杯杯王國裡，誰能爬上廣場中央的高塔， 就是杯杯英雄"},{"id":"2942bc3da499462ea776e48b","n":"海的另一頭","a":"五味太郎","d":"五味太郎","t":"游珮芸","p":"","y":["110"],"ag":"3~5","c":"認知探索","cl":false,"lo":false,"isbn":"9789866215476","dt":"105-08","pr":"","desc":"海的另一頭，是城市、是船、是夜晚、還是一望無際的田地？想像站在沙灘上享受自由無拘束的感受，家長可以運用孩子對未知世界的好奇心，搭配圖畫激發孩子無限的想像力與創造力，感受動靜畫面之間的變化。共讀時，可以引導孩子聯結生活經驗，讓親子對話盡情發揮。"},{"id":"39509a80239e4c2db73d55da","n":"菲菲真的很受傷","a":"莫莉‧卞","d":"莫莉‧卞","t":"黃筱茵","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789865664237","dt":"105-08","pr":270,"desc":"在贏得國際大獎的《菲菲生氣了》書中，菲菲的情緒經驗受到肯定。這次在《菲菲真的很受傷》書中，菲菲用心畫出她心目中最心愛的老椈樹，卻遭到小朋友說她用色不對，還把樹畫錯。這樣受傷的心要如何化解？展開書頁，看看菲菲的老師怎麼做！"},{"id":"b9608e8582fa4394a65735db","n":"林桃奶奶的桃子樹","a":"湯姆牛","d":"湯姆牛","t":"","p":"","y":["106","107","108"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789864790340","dt":"105-08","pr":320,"desc":"林桃奶奶家門口的桃子樹開花了！等到花謝了，樹上就會結滿一顆顆好吃的桃子。 小松鼠第一個發現，拜託林桃奶奶給他一顆桃子吃。吃完好吃的桃子，小松鼠告訴了山羊，山羊又告訴了老虎......，所有的動物都跑來找林桃奶奶要桃子吃。然而，再多的桃子總有分完的時候，這時烏龜一家終於趕到了，他們還有桃子可以吃嗎？充"},{"id":"63a1caf43e3047c3981cb48a","n":"他們都看見一隻貓","a":"布蘭登．溫佐","d":"布蘭登．溫佐","t":"宋珮","p":"","y":["106","108","109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789864001194","dt":"105-08","pr":320,"desc":"小孩、狐狸、老鼠、蜜蜂⋯⋯全都看見同一隻貓，但因生理構造或角度等種種原因，每雙眼睛看到的貓都呈現不同的樣貌。幼齡小孩仍處於以自我為中心的時期，透過此書可讓孩子明白，每個人所看到的，可能只是真實的一部份而已。同一個事物，可能存在多種面向。[109]\n當你見到一隻貓，你看到了什麼呢？這隻貓帶著他同樣的鬍"},{"id":"29ea36b492bf4613964b12f8","n":"一模一樣，一模一 樣!","a":"苅田澄子","d":"土田伸子","t":"黃惠綺","p":"","y":["107","108","110"],"ag":"3~5","c":"社會情緒、語言溝通","cl":false,"lo":false,"isbn":"9789862116340","dt":"105-08","pr":270,"desc":"孩子剛出生不久，最喜歡注視人的臉龐，開始學習認識周遭親近的人的五官與表情，進而建立人際互動關係。繪本用可愛的大大圓圓的臉，讓家長與孩子一同觀察家人間，眼睛、鼻子、嘴巴、額頭、臉頰有什麼一樣的地方，很適合學齡前孩童認識自己與他人間的關係。[110]\n蜜寶的眼睛、鼻子、嘴巴，跟誰一樣呢？蜜寶的額頭、臉頰"},{"id":"e6c82bcb4ed042f9b19698a3","n":"想哭的時候","a":"克里斯多福．希拉斯．尼爾","d":"克里斯多福．希拉斯．尼爾","t":"李紫蓉","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789577625922","dt":"105-08","pr":300,"desc":"故事主角想哭的時候就將破掉的藍氣球踢到太空、眼角的藍淚水和著藍雨水滴下，很能引起小讀者的共鳴。《想哭的時候⋯⋯》以同理的話語，童趣的插圖向小讀者保證：「⋯⋯每個人都是這樣。」、「我們都一樣。」並且溫柔地鼓勵著孩子：「你一笑⋯⋯快樂就開花了」。"},{"id":"960d60f9fddd4a48b34c0a32","n":"貓頭鷹蝙蝠","a":"瑪麗路易絲．菲茲派翠克","d":"瑪麗路易絲．菲茲派翠克","t":"","p":"","y":["106","107","109","110"],"ag":"0~3","c":"社會情緒","cl":false,"lo":false,"isbn":"9789577625953","dt":"105-08","pr":280,"desc":"對家長而言，向幼兒講述兩種族群的相處之道應是這本無字繪本顯著的重點，或許也是作者的本意之一。然而閱讀繪本並不須有負擔，孩子讀到什麼都好，他們往往會有大人意想不到、卻深具意義的看法。[110]\n這本圖畫書透過生動有趣的圖畫，引導孩子觀察到貓頭鷹與蝙蝠這兩種生物的相似與差異，故事情節也引導孩子學習跟不同"},{"id":"98b867ff3ac44db4aee5a49a","n":"跳著去噗噗囉，我的小寶貝!","a":"莎莉．里歐瓊斯","d":"安妮塔．婕朗","t":"張水金","p":"","y":["109"],"ag":"0~3","c":"生活自理","cl":false,"lo":false,"isbn":"9789577625960","dt":"105-08","pr":300,"desc":"這本圖畫書是引導進入如廁練習階段的小小孩，嘗試坐上自己小馬桶的好工具書。透過小動物們，一個接一個的示範與鼓勵，在共讀過程中，成人也可順勢引導孩子模仿這些小動物的行為，順利地讓孩子坐上小馬桶， 完成如廁這件事。讓孩子透過輕鬆的方式， 學習生活自理能力。"},{"id":"8414f8f67f7346709351dbf3","n":"爸爸山","a":"曹益欣","d":"曹益欣","t":"","p":"","y":["107","108"],"ag":"0~3","c":"","cl":false,"lo":true,"isbn":"9789570847772","dt":"105-08","pr":250,"desc":"爸爸是一座山，我是最佳的探險家。山，一直都在那兒，我，隨時可以攀爬。寬容的爸爸從來不曾失去耐性，總是微笑著說：「又要來爬爸爸山了嗎？」"},{"id":"7cf258c95f2543e48c19b8b7","n":"沉睡中的種子","a":"黛安娜・哈茨・阿斯頓","d":"希薇亞・隆","t":"張東君","p":"","y":["106"],"ag":"0~3","c":"","cl":false,"lo":false,"isbn":"9789865730482","dt":"105-07","pr":320,"desc":"這本書讓我們知道，原來知識性的自然圖畫書也可以這麼吸引人！三種大小字體的安排，適合不同年齡的孩子閱讀，可深可淺，可簡可繁，滿足對知識不同層次的好奇。優美的色彩，精緻的畫工，輕重的構圖，是很有藝術美感的科普書，讓人不禁跟種子墜入愛河。"},{"id":"4245cb390e604ff09496ff14","n":"皮可大冒險： 想像不到的朋友","a":"丹．桑塔","d":"丹．桑塔","t":"柯倩華","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789864790241","dt":"105-07","pr":320,"desc":"他出生在一個想像朋友被創造出來的島上。他每晚都站在星空下，等待被某個小孩選中並給他一個特別的名字。可是，他一直都等不到機會。他不停的想，一定是什麼奇妙的事物，使他的朋友想像不到他。於是，他不再等待，他坐上船，航向陌生的大海，經歷許多讓他害怕的事，終於來到真實的世界⋯⋯。"},{"id":"388ace9735264e47885a5a1b","n":"小洋蔥大作戰","a":"瀨名惠子","d":"瀨名惠子","t":"游珮芸","p":"","y":["107","109"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789577625908","dt":"105-07","pr":280,"desc":"這本可愛的圖畫書，透過擬人化的方式，呈現了廚房中常見蔬菜的外觀與特性，也展現了彼此間的友誼與關懷。讀完了這本圖畫 書，成人可以讓孩子實際地摸摸、聞聞，甚至吃吃洋蔥。相信透過實際的探索經驗，孩子對這些蔬菜將有更多的認識與理解。[109]\n馬鈴薯被老鼠咬了一口，哇哇大哭，小洋蔥、胡蘿蔔、高麗菜和廚房裡的"},{"id":"4268812bcbda43f9b17f7978","n":"丹丹的褲子","a":"岩村和朗","d":"岩村和朗","t":"黃惠綺","p":"","y":["109"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789862742686","dt":"105-06","pr":260,"desc":"奶奶送給小猴子丹丹一條褲子，可是褲子鬆 鬆垮垮的，吊帶也太長。丹丹把把吊帶掛在 耳朵上穿，就剛剛好。他還可以用褲子來盪 鞦韆、玩電車遊戲、拉小提琴。 具節奏感的文字與可愛的圖像，帶來無限的 想像空間。"},{"id":"7c2b519dfd1f449fb4286b99","n":"丹丹的帽子","a":"岩村和朗","d":"岩村和朗","t":"黃惠綺","p":"","y":["110"],"ag":"0~3","c":"認知探索","cl":false,"lo":false,"isbn":"9789862742693","dt":"105-06","pr":"","desc":"一頂帽子可以做甚麼呢？在丹丹的手裡有多種的玩法，如果到你的手裡會變成甚麼呢？這是本充滿創意的趣味性小書，鼓勵親子也可試試，身邊的物件可以變出哪些有趣的玩法。例如：小紙杯、小紙盤、小手帕可以怎麼玩呢？透過圖畫書的討論，一起玩出創造力與想像力！"},{"id":"d1ab1dc292b24f8d9603b741","n":"丹丹的白熊弟弟","a":"岩村和朗","d":"岩村和朗","t":"黃惠綺","p":"","y":["110"],"ag":"0~3","c":"認知探索、美感","cl":false,"lo":false,"isbn":"9789862742723","dt":"105-06","pr":"","desc":"以猴子丹丹為主角，本書為作者幼兒創作的一系列作品之一。書冊開本小，畫面簡潔、用色粉嫩，線條圓潤。書中所稱的「白熊弟弟」實為天上白雲，小主角將其擬人化與具象化。本書故事採框架敘事，頭尾以寫實開場，過程情節則充滿創意奇想。"},{"id":"3033537ae4804f1c8f5d8eb0","n":"路邊的小花","a":"強亞諾羅森","d":"席尼史密斯","t":"","p":"","y":["106","108","109"],"ag":"3~5","c":"美感","cl":false,"lo":false,"isbn":"9789861896755","dt":"105-06","pr":260,"desc":"在這本無字書中，穿紅帽兜的小女孩，在和爸爸一起走回家的路上，眼睛總被美麗的事物吸引，沿途採集美麗的野花。她將美麗的花兒送給可憐的對象或心愛的人。這本書可以讓小讀者學會觀察生活中的美麗事物，培養對他人的關心與悲憫，領略何謂生命的美好。[109]\n小女孩跟爸爸上街去，在灰暗的城市中， 爸爸漫不經心講著電"},{"id":"010334e176c54a6b94ccb5c0","n":"我有理由","a":"吉竹伸介","d":"吉竹伸介","t":"黃惠綺","p":"親子天下","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789869292092","dt":"105-05","pr":300,"desc":"他「挖鼻孔」，是為了發射開心光束；他「咬指甲」，是為了趕走垃圾上的烏鴉；他「在走廊上拔腿狂奔」，是因為衝刺蟲蟲停在頭上讓身體不由自主的奔跑起來；他「用吸管往飲料裏吹泡泡」，是在向神明打報告⋯⋯在這些被媽媽禁止的小小享受中也能引發這麼多創意！大人們！我們是不是也有這種「無傷大雅」的小小習慣呢？"},{"id":"de0c022ae9364724a9df07c7","n":"脫不下來啊!","a":"吉竹伸介","d":"吉竹伸介","t":"許婷婷","p":"","y":["106","107","109"],"ag":"0~3","c":"認知探索、生活自理","cl":false,"lo":false,"isbn":"9789863425762","dt":"105-05","pr":250,"desc":"這是一本你看完一定會噗哧！笑出聲的幽默童書，用詼諧的方式呈現年紀小小卻不求媽媽協助，什麼事都想要自己來的主人翁，在衣服脫不下來的事件中，從堅持自己完成的努力，到無法完成的妥協，與無厘頭的超現實想像，鼓勵孩子不要放棄，一定要繼續試試看喔！[109]\n看似孩子因為脫不下衣服而引發一連串爆笑事情，實則充滿"},{"id":"ab1918a648ac462d9c8684ee","n":"送給爸爸的小船","a":"潔西莎．貝格利","d":"潔西莎．貝格利","t":"劉清彥","p":"","y":["106","109"],"ag":"3~5","c":"社會情緒","cl":false,"lo":false,"isbn":"9789864001163","dt":"105-05","pr":270,"desc":"這是一本看完眼睛會濕濕的圖畫書。面對親人的離世，悲傷與思念的情緒，常常縈繞在心頭。小巴克利透過手作的小船，不斷地向離世的父親表達深深的思念。負向的情緒需要適度的宣洩與表達，讓自己能慢慢地、慢慢地調整，找到可以重新出發的力量。親子可以一起思考與對話，如何能協助小巴克利跨越這個挑戰。[109]\n巴克利和"},{"id":"cc4da2de7b444b06a4913c05","n":"尿床天神","a":"長谷川義史","d":"長谷川義史","t":"游珮芸","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862742471","dt":"105-05","pr":280,"desc":"小祐夢見自己在尿尿的海裏游泳，好冷、好冷、好冷唷！⋯⋯原來是尿床了！小祐好難過⋯⋯這時總會出現一位無厘頭的大叔，自稱尿床天神，陪小祐唱歌、跳舞、唸「不會尿床」的咒語⋯⋯在這本書的世界裏，「尿床」也可以輕鬆面對！"},{"id":"f0ceb3a41b0a4f688ba2c959","n":"小熊晚安曲","a":"班傑明．蕭","d":"班傑明．蕭","t":"許肯馨","p":"","y":["106"],"ag":"3~5","c":"","cl":false,"lo":false,"isbn":"9789862116081","dt":"105-05","pr":320,"desc":"冬冬眠的時間到了，滿腦子都是蜂蜜的小熊，聽不見冬天的喃喃聲，只被嗡嗡聲所吸引，追著蜜蜂跑出森林。著急的熊爸爸緊隨其後，進入都市的大叢林，最後來到戲劇院。他找得到小熊嗎？要用什麼方法呢？本書「尋找威利」式的互動性設計，邀請讀者找一找！"},{"id":"8a205e4ac5a44e389f509da2","n":"市場街最後一站","a":"馬特．德拉佩尼亞","d":"克里斯汀．羅賓遜","t":"宋珮","p":"","y":["106","107","109"],"ag":"3~5","c":"
